<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/profile/tokens.css">
  <link rel="stylesheet" href="/profile/components.css">
</head>
<body>
  <div class="frame-header">
    <h1>Design</h1>
  </div>

  <div class="frame-main">
    <div id="frame-content">

      <h2 class="frame-title">收银台 · 方案 A：对等方式卡</h2>
      <p class="frame-subtitle">银行卡还款选中态 — 两种方式同构对等，整卡可点切换；金额白底居顶突出</p>

      <div class="phone-gallery presentation--single">

        <div class="phone-slide">
          <div class="phone-mockup">
            <div class="phone-screen">
              <div class="wld-page">

                <preview-chrome variant="inner" title=""></preview-chrome>

                <div class="wld-page-body">

                  <!-- Amount hero — white panel, amount is the single focal number -->
                  <div class="cx-hero">
                    <div class="cx-hero-label">还款金额</div>
                    <div class="cx-hero-amount">&#165;10006.00</div>
                  </div>

                  <!-- Method card: 银行卡还款 (selected) -->
                  <div class="cxa-card">
                    <div class="cxa-method-row">
                      <span class="cxa-method-name">银行卡还款</span>
                      <div class="wld-radio is-checked"></div>
                    </div>
                    <div class="cx-divider"></div>
                    <div class="cxa-detail-row">
                      <span class="cx-bank-chip">
                        <img src="/profile/icons/logo-icbc.svg" alt="工商银行" width="24" height="24">
                      </span>
                      <span class="cxa-detail-label">工商银行 储蓄卡 (2004)</span>
                      <svg class="cx-chevron" width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </div>
                  </div>

                  <!-- Method card: 转账还款 -->
                  <div class="cxa-card">
                    <div class="cxa-method-row">
                      <span class="cxa-method-name">转账还款</span>
                      <div class="wld-radio"></div>
                    </div>
                    <div class="cx-divider"></div>
                    <div class="cxa-detail-row">
                      <span class="cx-transfer-icon">
                        <svg width="22" height="18" viewBox="0 0 22 18" fill="none">
                          <path d="M3 5h14M14 2l3 3-3 3" stroke="rgba(0,0,0,0.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                          <path d="M19 13H5M8 16l-3-3 3-3" stroke="rgba(0,0,0,0.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </span>
                      <span class="cxa-detail-sub">还款不限额，实时到账</span>
                    </div>
                  </div>

                  <!-- CTA — centered directly below content (canonical form per PROFILE) -->
                  <div class="cx-cta">
                    <button class="wld-btn wld-btn-primary wld-btn-m">下一步</button>
                  </div>

                </div>
              </div>
            </div>
          </div>
          <div class="phone-caption">
            收银台 · 银行卡还款（选中态）
            <span class="phone-caption-sub">Comparison-first — radio marks the single choice; tapping the other card switches; the current bank card row leads to card change</span>
          </div>
        </div>

      </div>

    </div>
  </div>

  <style>
    /* ===== Amount hero (adapted from 本期应还 white summary + 收银台 centered layout) ===== */
    .cx-hero {
      background: var(--wld-surface);
      padding: 30px var(--wld-page-padding) 32px;
      margin-bottom: var(--wld-section-gap);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .cx-hero-label {
      font-size: var(--wld-text-body2);
      font-weight: var(--wld-font-weight-semibold);
      color: var(--wld-text-primary);
      line-height: 1.5;
    }
    .cx-hero-amount {
      font-family: var(--wld-font-number);
      font-size: var(--wld-text-numbers);
      font-weight: 500;
      color: var(--wld-text-primary);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    /* ===== Bank logo chip (from 更换还款卡) ===== */
    .cx-bank-chip {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 0.5px solid var(--wld-divider);
      background: var(--wld-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .cx-bank-chip img { width: 24px; height: 24px; }

    /* ===== Transfer icon (from 收银台) ===== */
    .cx-transfer-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--wld-theme-100);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ===== Divider, chevron, CTA ===== */
    .cx-divider {
      height: 0.5px;
      background: var(--wld-divider);
      margin-left: var(--wld-card-padding);
    }
    .cx-chevron { margin-left: auto; flex-shrink: 0; }
    .cx-cta {
      display: flex;
      justify-content: center;
      padding: 28px 30px 40px;
    }

    /* ===== Peer method cards ===== */
    .cxa-card {
      background: var(--wld-surface);
      border-radius: var(--wld-radius-card);
      margin: 0 var(--wld-page-padding) var(--wld-section-gap);
      overflow: hidden;
    }
    .cxa-method-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px var(--wld-card-padding) 12px;
    }
    .cxa-method-name {
      font-size: var(--wld-text-body1);
      font-weight: var(--wld-font-weight-semibold);
      color: var(--wld-text-primary);
    }
    .cxa-detail-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px var(--wld-card-padding);
      min-height: 56px;
    }
    .cxa-detail-label {
      font-size: var(--wld-text-body2);
      font-weight: var(--wld-font-weight-semibold);
      color: var(--wld-text-primary);
    }
    .cxa-detail-sub {
      font-size: var(--wld-text-body2);
      color: var(--wld-text-secondary);
    }
  </style>

</body>
</html>
