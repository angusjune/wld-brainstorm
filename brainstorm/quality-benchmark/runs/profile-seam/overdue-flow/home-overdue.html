<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/profile/tokens.css">
  <link rel="stylesheet" href="/profile/components.css">
  <link rel="stylesheet" href="/platform/chrome.css">
  <link rel="stylesheet" href="/assets/phone-mockup.css">
</head>
<body>
  <div class="frame-header">
    <h1>WLD Design</h1>
  </div>

  <div class="frame-main">
    <div id="frame-content">
      <h2 class="frame-title">首页 · 逾期提醒</h2>
      <p class="frame-subtitle">方案 A 第 1 屏 — 提醒条与借款卡片指向逾期详情，点击“已逾期”行进入处理流程</p>

      <div class="phone-gallery presentation--single">
        <div class="phone-slide">
          <div class="phone-mockup">
            <div class="phone-screen">
              <!-- Base: 个人中心-有借款.html — home screen, white bg override -->
              <div class="wld-page" style="background: var(--wld-surface);">

                <preview-chrome variant="home" title="微粒贷"></preview-chrome>

                <div class="wld-page-body" style="display: flex; flex-direction: column; padding-bottom: 0;">

                  <!-- Interest rate bar (required rate copy — kept from template) -->
                  <div class="wld-rate-bar">
                    年利率 (单利) 10.8%，1千元用1天只需0.3元
                  </div>

                  <!-- Overdue reminder bar — factual, no pressure language -->
                  <div class="wld-overdue-bar">
                    <span>1笔借款已逾期，请尽快还款</span>
                    <svg width="14" height="14" viewBox="0 0 18 18" fill="none">
                      <path d="M7 4.5L11.5 9L7 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </div>

                  <!-- Centered loan offer content (unchanged from template) -->
                  <div class="wld-home-content">
                    <span class="wld-home-label">预估可借</span>
                    <span class="wld-home-amount">&#165;55000</span>
                    <span class="wld-home-total">总额度 &#165;60000</span>
                    <button class="wld-btn-circle">借钱</button>
                  </div>

                  <!-- Loan details card — row 1 becomes the overdue entry -->
                  <div class="wld-loan-card">
                    <div class="wld-loan-row">
                      <span class="wld-loan-row-label wld-loan-overdue">已逾期 8 天</span>
                      <div class="wld-loan-row-right">
                        <span class="wld-loan-row-value wld-loan-overdue">&#165;542.57</span>
                        <svg class="wld-loan-chevron" width="18" height="18" viewBox="0 0 18 18" fill="none">
                          <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </div>
                    </div>
                    <div class="wld-loan-divider"></div>
                    <div class="wld-loan-row">
                      <span class="wld-loan-row-label">提前还清借款</span>
                      <div class="wld-loan-row-right">
                        <span class="wld-loan-row-value">1 笔</span>
                        <svg class="wld-loan-chevron" width="18" height="18" viewBox="0 0 18 18" fill="none">
                          <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </div>
                    </div>
                  </div>

                  <!-- Footer (unchanged from template) -->
                  <div class="wld-footer">
                    <div class="wld-footer-links">
                      <a href="#">借钱须知</a>
                    </div>
                    <div class="wld-footer-disclaimer">实际可借以当次借款审批为准</div>
                  </div>

                </div>

                <!-- Tab bar (unchanged from template; icons served from /profile/icons/) -->
                <div class="wld-tabbar">
                  <button class="wld-tabbar-item">
                    <div class="wld-tabbar-icon">
                      <img src="/profile/icons/tab-icon-home-filled.svg" alt="借钱" width="22" height="22">
                    </div>
                    <span class="wld-tabbar-label">借钱</span>
                  </button>
                  <button class="wld-tabbar-item wld-tabbar-item--inactive">
                    <div class="wld-tabbar-icon">
                      <img src="/profile/icons/tab-icon-me.svg" alt="我的" width="22" height="22">
                    </div>
                    <span class="wld-tabbar-label">我的</span>
                  </button>
                </div>

              </div>
            </div>
          </div>
          <div class="phone-caption">
            首页 · 逾期提醒
            <span class="phone-caption-sub">Screen 1 of 方案 A — the reminder bar and the overdue loan row both lead to the overdue detail screen</span>
          </div>
        </div>
      </div>
    </div>
  </div>

<style>
  /* ===== From 个人中心-有借款.html — interest rate info bar ===== */
  .wld-rate-bar {
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--wld-text-secondary);
    background: var(--wld-section);
    flex-shrink: 0;
  }

  /* Overdue reminder bar — same bar rhythm as the rate bar, danger tokens */
  .wld-overdue-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px var(--wld-page-padding);
    font-size: 12px;
    color: var(--wld-danger-700);
    background: var(--wld-danger-100);
    flex-shrink: 0;
    cursor: pointer;
  }
  .wld-overdue-bar svg {
    flex-shrink: 0;
  }

  /* ===== From 个人中心-有借款.html — centered loan offer area ===== */
  .wld-home-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px 0 24px;
  }
  .wld-home-label {
    font-size: 14px;
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
  }
  .wld-home-amount {
    font-family: var(--wld-font-number);
    font-size: var(--wld-text-numbers);
    font-weight: 500;
    color: var(--wld-text-primary);
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-top: -4px;
  }
  .wld-home-total {
    font-size: 14px;
    color: var(--wld-text-primary);
    margin-top: -8px;
  }

  /* ===== From 个人中心-有借款.html — loan details card ===== */
  .wld-loan-card {
    background: var(--wld-section);
    border-radius: 12px;
    margin: 0 30px;
    flex-shrink: 0;
  }
  .wld-loan-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 20px;
  }
  .wld-loan-row-label {
    font-size: 14px;
    color: var(--wld-text-primary);
  }
  .wld-loan-row-right {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .wld-loan-row-value {
    font-family: var(--wld-font-number);
    font-size: 14px;
    color: var(--wld-text-primary);
  }
  .wld-loan-chevron {
    flex-shrink: 0;
  }
  .wld-loan-divider {
    height: 0.5px;
    margin: 0 20px;
    background: var(--wld-black-200);
  }

  /* Overdue state on the loan row — danger token, semibold label */
  .wld-loan-overdue {
    color: var(--wld-text-error);
  }
  .wld-loan-row-label.wld-loan-overdue {
    font-weight: var(--wld-font-weight-semibold);
  }
</style>
</body>
</html>
