<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/components.css">
  <link rel="stylesheet" href="/platform/chrome.css">
  <link rel="stylesheet" href="/assets/phone-mockup.css">
  <style>
    .wld-home-hero { padding: var(--wld-page-padding); text-align: center; }
    .wld-home-amount {
      font-family: var(--wld-font-number);
      font-size: 44px;
      font-weight: 500;
      color: var(--wld-text-primary);
      letter-spacing: -0.5px;
    }
    .wld-home-label { font-size: var(--wld-text-body2); font-weight: var(--wld-font-weight-semibold); }
  </style>
</head>
<body>
  <div class="frame-header">
    <h1>WLD Design</h1>
    <div class="frame-status">Live</div>
  </div>

  <div class="frame-main">
    <div id="frame-content">
      <div class="phone-mockup">
        <div class="phone-screen">
          <div class="wld-page" style="background: var(--wld-surface);">
            <preview-chrome variant="home" title="微粒贷"></preview-chrome>
            <div class="wld-page-body">
              <div class="wld-home-hero">
                <div class="wld-home-label">预估可借</div>
                <div class="wld-home-amount">¥ 60000</div>
                <button class="wld-btn wld-btn-circle">借钱</button>
              </div>
            </div>
            <div class="wld-tabbar">
              <button class="wld-tabbar-item"><span class="wld-tabbar-label">借钱</span></button>
              <button class="wld-tabbar-item wld-tabbar-item--inactive"><span class="wld-tabbar-label">我的</span></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="frame-indicator">
    <span>Live preview — give feedback in terminal</span>
  </div>
</body>
</html>
