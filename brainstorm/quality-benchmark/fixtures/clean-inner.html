<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/tokens.css">

  <link rel="stylesheet" href="/platform/chrome.css">
  <link rel="stylesheet" href="/assets/phone-mockup.css">
</head>
<body>
  <div class="frame-header">
    <h1>WLD Design</h1>
    <div class="frame-status">Live</div>

  <div class="frame-main">

      <div class="phone-mockup">
        <div class="phone-screen">
          <div class="wld-page">
            <preview-chrome variant="inner" title="提前还清借款"></preview-chrome>
            <div class="wld-page-body">
              <div class="wld-select-item">
                <div class="wld-select-content">
                  <div class="wld-select-label">借款 ¥500.00</div>
                  <div class="wld-select-desc">2020/05/20</div>
                </div>
              </div>
              <button class="wld-btn wld-btn-l wld-btn-primary">还款</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="frame-indicator">
    <span>Live preview — give feedback in terminal</span>
  </div>
</body>
</html>
