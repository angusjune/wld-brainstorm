<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>界面战斗陀螺 · Screen Beyblade Battle</title>
<link rel="stylesheet" href="/arena.css">
</head>
<body>
<div class="bb-wrap">
  <header class="bb-top">
    <h1>界面战斗陀螺</h1>
    <span class="bb-sub">Screen Beyblade Battle — last screen spinning wins</span>
  </header>

  <div class="bb-stage">
    <aside class="bb-rail" id="bb-hud"></aside>

    <div class="bb-center">
      <div class="bb-arena-wrap">
        <canvas id="bb-arena" width="580" height="580"></canvas>
        <div class="bb-overlay" id="bb-overlay"></div>
      </div>
      <div class="bb-controls">
        <button class="bb-btn" id="bb-restart">重新开战</button>
      </div>
      <div class="bb-log" id="bb-log"></div>
    </div>
  </div>

  <div class="bb-loading" id="bb-loading">正在召唤界面陀螺…</div>
</div>

<script src="/engine.js"></script>
<script>
(async function () {
  const loading = document.getElementById('bb-loading');
  let config;
  try {
    const res = await fetch('/battle-config.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('no config');
    config = await res.json();
  } catch (e) {
    loading.textContent = '没有找到 battle-config.json — 请让 agent 先准备好界面。';
    return;
  }
  loading.style.display = 'none';
  await BeybladeBattle.start(config);
  document.getElementById('bb-restart').addEventListener('click', () => location.reload());
})();
</script>
</body>
</html>
