<style data-platform-chrome>
/* =============================================================================
   WeChat Mini Program — Presentation Chrome

   Part of the `wechat` platform pack. Belongs to the platform, not to any
   product: every WeChat Mini Program has this same status bar, 88px navbar and
   capsule, whatever the product's design system looks like.

   Presentation only — this reproduces WeChat's shell around a screen; it is
   never production code. Copy this file's style block once and its nav markup
   into each phone in the standalone brainstorm HTML.

   Self-contained by design: it borrows no token from the product profile, so
   swapping profile/ cannot break the chrome. A profile may optionally override
   --chrome-navbar-bg if its home screens are not white.
   ============================================================================= */

:root {
  --chrome-black: #000000;
  --chrome-capsule-border: rgba(0, 0, 0, 0.15);
  --chrome-capsule-bg: rgba(255, 255, 255, 0.6);
  --chrome-capsule-dot: rgba(0, 0, 0, 0.7);
}

/* --- Full Navbar (88px = status bar + title bar) --- */
.chrome-navbar {
  height: 88px;
  background: var(--chrome-navbar-bg, #FFFFFF);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  z-index: 10;
  flex-shrink: 0;
}

/* Status bar — fake iOS status indicators */
.chrome-statusbar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  font-family: "SF Pro Text", -apple-system, sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--chrome-black);
}
.chrome-statusbar-time {
  width: 54px;
  text-align: center;
}
.chrome-statusbar-icons {
  display: flex;
  align-items: center;
  gap: 5px;
}
.chrome-statusbar-icons svg {
  display: block;
}

/* Title bar — back button, title, WeChat capsule */
.chrome-titlebar {
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 0 0 6px;
  position: relative;
  color: var(--chrome-black);
}

/* Back button (hidden on home screens, visible on inner pages) */
.chrome-navbar-back {
  width: 32px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  font-size: 20px;
  color: var(--chrome-black);
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
}
.chrome-navbar-back svg {
  width: 12px;
  height: 20px;
}
.chrome-navbar--home .chrome-navbar-back {
  visibility: hidden;
}

/* Centered title */
.chrome-navbar-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 17px;
  font-weight: 600;
  color: var(--chrome-black);
  white-space: nowrap;
}

/* WeChat capsule button (···⊙) — always on the right */
.chrome-capsule {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  height: 32px;
  border: 0.5px solid var(--chrome-capsule-border);
  border-radius: 16px;
  padding: 0 2px;
  gap: 0;
  background: var(--chrome-capsule-bg);
  backdrop-filter: blur(4px);
}
.chrome-capsule-dots {
  width: 36px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.chrome-capsule-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--chrome-capsule-dot);
}
.chrome-capsule-divider {
  width: 0.5px;
  height: 18px;
  background: var(--chrome-capsule-border);
}
.chrome-capsule-close {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.chrome-capsule-close-ring {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--chrome-capsule-dot);
  display: flex;
  align-items: center;
  justify-content: center;
}
.chrome-capsule-close-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--chrome-capsule-dot);
}
</style>

<nav class="chrome-navbar {{variant_class}}">
  <div class="chrome-statusbar">
    <span class="chrome-statusbar-time">9:41</span>
    <div class="chrome-statusbar-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true">
        <rect x="0" y="3" width="3" height="9" rx="0.5" fill="currentColor"/>
        <rect x="4.5" y="2" width="3" height="10" rx="0.5" fill="currentColor"/>
        <rect x="9" y="0.5" width="3" height="11.5" rx="0.5" fill="currentColor"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true">
        <path d="M8 3.6C10.2 3.6 12.1 4.5 13.4 6L15 4.4C13.3 2.7 10.8 1.6 8 1.6S2.7 2.7 1 4.4L2.6 6C3.9 4.5 5.8 3.6 8 3.6Z" fill="currentColor"/>
        <path d="M8 7.2C9.3 7.2 10.5 7.7 11.4 8.6L8 12L4.6 8.6C5.5 7.7 6.7 7.2 8 7.2Z" fill="currentColor"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
        <rect x="0" y="0.5" width="22" height="11" rx="2" stroke="currentColor" stroke-width="1" fill="none"/>
        <rect x="23" y="3.5" width="1.5" height="5" rx="0.5" fill="currentColor"/>
        <rect x="2" y="2.5" width="18" height="7" rx="1" fill="currentColor"/>
      </svg>
    </div>
  </div>
  <div class="chrome-titlebar">
    <button class="chrome-navbar-back" aria-label="返回">
      <svg viewBox="0 0 12 20" fill="none" aria-hidden="true">
        <path d="M10 2L2 10L10 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="chrome-navbar-title">{{title}}</span>
    <div class="chrome-capsule" aria-hidden="true">
      <div class="chrome-capsule-dots">
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
      </div>
      <div class="chrome-capsule-divider"></div>
      <div class="chrome-capsule-close">
        <div class="chrome-capsule-close-ring">
          <div class="chrome-capsule-close-dot"></div>
        </div>
      </div>
    </div>
  </div>
</nav>
