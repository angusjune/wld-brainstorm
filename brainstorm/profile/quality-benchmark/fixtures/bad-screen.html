<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/profile/tokens.css">
  <link rel="stylesheet" href="/profile/components.css">
  <style>
    .promo-banner { font-family: sans-serif; border: 2px solid #123456; }
    .big-amount { font-size: 44px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="frame-header">
    <h1>WLD Design</h1>
    <div class="frame-status">Live</div>
  </div>

  <div class="frame-main">
    <div id="frame-content">
      <div class="phone-mockup">
        <div class="phone-screen">
          <div class="wld-page">
            <!-- Hand-built chrome instead of the <preview-chrome> placeholder -->
            <div class="chrome-navbar">
              <div class="chrome-navbar-title">微粒贷</div>
              <div class="chrome-capsule"></div>
            </div>
            <div class="wld-page-body">
              <div class="promo-banner" style="background: #FFD143;">立即领取 <span>🎁</span></div>
              <div class="big-amount">¥ 60000</div>
              <p>最高可借 ¥60,000</p>
              <p>倒计时 03:12:45</p>
              <button class="wld-btn wld-btn-m wld-btn-primary" style="border-radius: 8px;">借钱</button>
              <button class="wld-btn wld-btn-m wld-btn-primary" style="color: #fff;">马上抢</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="frame-indicator">
    <span>Live preview — give feedback in terminal</span>
  </div>
</body>
</html>
