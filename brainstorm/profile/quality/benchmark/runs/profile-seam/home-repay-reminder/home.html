<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/profile/design-system/tokens.css">
  <link rel="stylesheet" href="/profile/design-system/components.css">
  <link rel="stylesheet" href="/platform/chrome.css">
  <link rel="stylesheet" href="/assets/phone-mockup.css">
</head>
<body>
  <div class="frame-header">
    <h1>Design</h1>
  </div>

  <div class="frame-main">
    <div id="frame-content">

      <h2 class="frame-title">个人中心 — 还款卡片提醒</h2>
      <p class="frame-subtitle">方案 A · 最近7天内要还的钱在借款卡片内直接可见</p>

      <div class="phone-gallery presentation--single">

        <div class="phone-slide">
          <div class="phone-mockup">
            <div class="phone-screen">
              <div class="wld-page" style="background: var(--wld-surface);">

                <preview-chrome variant="home" title="微粒贷"></preview-chrome>

                <div class="wld-page-body" style="display: flex; flex-direction: column; padding-bottom: 0;">

                  <div class="wld-rate-bar">
                    年利率 (单利) 10.8%，1千元用1天只需0.3元
                  </div>

                  <div class="wld-home-content">
                    <span class="wld-home-label">预估可借</span>
                    <span class="wld-home-amount">&#165;55000</span>
                    <span class="wld-home-total">总额度 &#165;60000</span>
                    <button class="wld-btn-circle">借钱</button>
                  </div>

                  <!-- Loan details card — due row carries the 7-day reminder -->
                  <div class="wld-loan-card">
                    <div class="wld-loan-row">
                      <div class="wld-due-left">
                        <span class="wld-loan-row-label">7月20日应还</span>
                        <span class="wld-due-hint">3天后自动还款</span>
                      </div>
                      <div class="wld-loan-row-right">
                        <span class="wld-loan-row-value">&#165;537.20</span>
                        <svg class="wld-loan-chevron" width="18" height="18" viewBox="0 0 18 18" fill="none">
                          <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </div>
                    </div>
                    <div class="wld-loan-divider"></div>
                    <div class="wld-loan-row">
                      <span class="wld-loan-row-label">提前还清借款</span>
                      <div class="wld-loan-row-right">
                        <span class="wld-loan-row-value">1 笔</span>
                        <svg class="wld-loan-chevron" width="18" height="18" viewBox="0 0 18 18" fill="none">
                          <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </div>
                    </div>
                  </div>

                  <div class="wld-footer">
                    <div class="wld-footer-links">
                      <a href="#">借钱须知</a>
                    </div>
                    <div class="wld-footer-disclaimer">实际可借以当次借款审批为准</div>
                  </div>

                </div>

                <div class="wld-tabbar">
                  <button class="wld-tabbar-item">
                    <div class="wld-tabbar-icon">
                      <img src="/profile/design-system/assets/tab-icon-home-filled.svg" alt="借钱" width="22" height="22">
                    </div>
                    <span class="wld-tabbar-label">借钱</span>
                  </button>
                  <button class="wld-tabbar-item wld-tabbar-item--inactive">
                    <div class="wld-tabbar-icon">
                      <img src="/profile/design-system/assets/tab-icon-me.svg" alt="我的" width="22" height="22">
                    </div>
                    <span class="wld-tabbar-label">我的</span>
                  </button>
                </div>

              </div>
            </div>
          </div>
          <div class="phone-caption">
            个人中心 · 最近7天还款提醒
            <span class="phone-caption-sub">Repayment-aware home — the loan card shows the due date, countdown and amount; tap leads to 本期应还</span>
          </div>
        </div>

      </div>

    </div>
  </div>

  <style>
    /* ===== Copied from profile/screens/个人中心-有借款.html (template-local styles) ===== */

    /* Interest rate info bar */
    .wld-rate-bar {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--wld-text-caption);
      color: var(--wld-text-secondary);
      background: var(--wld-section);
      flex-shrink: 0;
    }

    /* Centered loan offer area */
    .wld-home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px 0 24px;
    }
    .wld-home-label {
      font-size: var(--wld-text-body2);
      font-weight: var(--wld-font-weight-semibold);
      color: var(--wld-text-primary);
    }
    .wld-home-amount {
      font-family: var(--wld-font-number);
      font-size: var(--wld-text-numbers);
      font-weight: 500;
      color: var(--wld-text-primary);
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-top: -4px;
    }
    .wld-home-total {
      font-size: var(--wld-text-body2);
      color: var(--wld-text-primary);
      margin-top: -8px;
    }

    /* Loan details card */
    .wld-loan-card {
      background: var(--wld-section);
      border-radius: var(--wld-radius-card);
      margin: 0 30px;
      flex-shrink: 0;
    }
    .wld-loan-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 20px;
    }
    .wld-loan-row-label {
      font-size: var(--wld-text-body2);
      color: var(--wld-text-primary);
    }
    .wld-loan-row-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .wld-loan-row-value {
      font-family: var(--wld-font-number);
      font-size: var(--wld-text-body2);
      color: var(--wld-text-primary);
    }
    .wld-loan-chevron {
      flex-shrink: 0;
    }
    .wld-loan-divider {
      height: 0.5px;
      margin: 0 20px;
      background: var(--wld-black-200);
    }

    /* ===== 7-day due reminder additions ===== */

    /* Stacked left column inside the due row (date + countdown hint) */
    .wld-due-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .wld-due-hint {
      font-size: var(--wld-text-caption);
      color: var(--wld-text-secondary);
      line-height: 1.5;
    }
  </style>
</body>
</html>
