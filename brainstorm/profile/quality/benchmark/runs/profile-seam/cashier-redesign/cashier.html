<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/profile/design-system/tokens.css">
  <link rel="stylesheet" href="/profile/design-system/components.css">
  <link rel="stylesheet" href="/platform/chrome.css">
  <link rel="stylesheet" href="/assets/phone-mockup.css">
</head>
<body>
  <div class="frame-header">
    <h1>收银台 — 方案 A 对等卡片</h1>
  </div>

  <div class="frame-main">
    <div id="frame-content">

      <h2 class="frame-title">收银台</h2>
      <p class="frame-subtitle">还款金额置顶聚焦；两种还款方式对等呈现，整卡可点、单选即切换</p>

      <div class="phone-gallery presentation--single">
        <div class="phone-slide">
          <div class="phone-mockup">
            <div class="phone-screen">
              <div class="wld-page">
                <preview-chrome variant="inner" title=""></preview-chrome>
                <div class="wld-page-body">

                  <!-- Amount summary — the one focal number -->
                  <div class="wld-cashier-summary">
                    <div class="wld-cashier-summary-label">还款金额</div>
                    <div class="wld-cashier-summary-amount">&#165;10006.00</div>
                  </div>

                  <!-- Method card: bank card (selected) -->
                  <div class="cmp-method-card cmp-method-card--selected">
                    <div class="cmp-method-head">
                      <div class="cmp-method-text">
                        <span class="cmp-method-name">银行卡还款</span>
                        <span class="cmp-method-desc">使用绑定的银行卡还款</span>
                      </div>
                      <div class="wld-radio is-checked"></div>
                    </div>
                    <div class="cmp-method-divider"></div>
                    <div class="cmp-method-detail">
                      <span class="cmp-bank-chip">
                        <img src="/profile/design-system/icons/logo-icbc.svg" alt="工商银行" width="24" height="24">
                      </span>
                      <span class="cmp-detail-label">工商银行 (2004)</span>
                      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" class="cmp-detail-arrow">
                        <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </div>
                  </div>

                  <!-- Method card: transfer (unselected) -->
                  <div class="cmp-method-card">
                    <div class="cmp-method-head">
                      <div class="cmp-method-text">
                        <span class="cmp-method-name">转账还款</span>
                        <span class="cmp-method-desc">还款不限额，实时到账</span>
                      </div>
                      <div class="wld-radio"></div>
                    </div>
                  </div>

                  <!-- CTA centered directly below content (product law) -->
                  <div class="cashier-cta">
                    <button class="wld-btn wld-btn-primary wld-btn-m">下一步</button>
                  </div>

                </div>
              </div>
            </div>
          </div>
          <div class="phone-caption">
            收银台 — 银行卡还款已选中
            <span class="phone-caption-sub">Cashier — bank card selected; tap the transfer card to switch (shown as a separate static state on request)</span>
          </div>
        </div>
      </div>

    </div>
  </div>

<style>
  /* ===== Amount summary (from 收银台.html) ===== */
  .wld-cashier-summary {
    padding: 15px var(--wld-page-padding) 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .wld-cashier-summary-label {
    font-size: var(--wld-text-body2);
    color: var(--wld-text-primary);
    font-weight: var(--wld-font-weight-semibold);
  }
  .wld-cashier-summary-amount {
    font-family: var(--wld-font-number);
    font-size: var(--wld-text-numbers);
    font-weight: 500;
    color: var(--wld-text-primary);
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  /* ===== Comparison method cards ===== */
  .cmp-method-card {
    background: var(--wld-surface);
    border-radius: var(--wld-radius-card);
    margin: 0 var(--wld-page-padding) var(--wld-section-gap);
    border: 1.5px solid var(--wld-transparent);
    overflow: hidden;
  }
  .cmp-method-card--selected {
    border-color: var(--wld-theme-500);
  }
  .cmp-method-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
  }
  .cmp-method-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cmp-method-name {
    font-size: var(--wld-text-body1);
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
  }
  .cmp-method-desc {
    font-size: var(--wld-text-caption);
    color: var(--wld-text-secondary);
  }
  .cmp-method-head .wld-radio {
    margin-left: auto;
  }
  .cmp-method-divider {
    height: 0.5px;
    background: var(--wld-divider);
    margin: 0 20px;
  }
  .cmp-method-detail {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    min-height: 52px;
  }
  .cmp-detail-label {
    font-size: var(--wld-text-body2);
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
  }
  .cmp-detail-arrow {
    margin-left: auto;
    flex-shrink: 0;
  }

  /* ===== Round bank chip (from 更换还款卡.html) ===== */
  .cmp-bank-chip {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 0.5px solid var(--wld-divider);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--wld-surface);
    overflow: hidden;
  }
  .cmp-bank-chip img {
    width: 24px;
    height: 24px;
  }

  /* ===== CTA centered directly below content (product law) ===== */
  .cashier-cta {
    padding: 28px 30px 40px;
    display: flex;
    justify-content: center;
  }
</style>
</body>
</html>
