# Bundled product knowledge snapshot @ 2026-05-07

header:
  spec_id: SPEC_WLD_WELCOME_20260329
  spec_name: 欢迎页规格文档
  component_id: COMP_WLD_WELCOME
  scene_ids:
    - SCENE_WLD_ONBOARDING
  owner_pm: ""
  scope_in: 欢迎页的静态展示和「查看额度」按钮交互
  scope_out: 不包含额度查询页及后续流程
  spec_version: "0.2.0"
  lifecycle_status: draft

state_machine:
  - state_id: STATE_WELCOME_DEFAULT
    state_name: 欢迎页默认态
    state_type: normal
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: system
    entry_conditions:
      - 用户首次进入微粒贷小程序
    risk_level: low
    notes: 静态展示页，无数据加载。展示产品特性卖点，引导用户进入额度查询流程。

  - state_id: STATE_WELCOME_EXITED
    state_name: 已离开欢迎页
    state_type: normal
    is_terminal: true
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 用户点击「查看额度」按钮
    risk_level: low
    notes: 终止态，用户已跳转离开欢迎页。

transitions:
  - from: STATE_WELCOME_DEFAULT
    to: STATE_WELCOME_EXITED
    event: tap_cta_check_quota
    transition_type: user_action
    conditions:
      - 用户点击「查看额度」按钮
    actions:
      - 跳转至额度查询页

rules: []

ui_contract:
  - state_id: STATE_WELCOME_DEFAULT
    primary_cta:
      text: 查看额度
      state: enabled
      action: navigate_to_quota
    secondary_ctas: []
    key_elements:
      - element_id: ELEM_WELCOME_NAVBAR
        element_type: navbar
        element_name: 导航栏
      - element_id: ELEM_WELCOME_TITLE
        element_type: text
        element_name: 主标题
      - element_id: ELEM_WELCOME_FEATURES
        element_type: list
        element_name: 产品特性列表
      - element_id: ELEM_WELCOME_FOOTER
        element_type: text
        element_name: 底部说明
      - element_id: ELEM_WELCOME_CTA
        element_type: button
        element_name: 查看额度按钮
    copy_manifest:
      - key: title.main
        value: 微信上可以借钱了
      - key: feature.speed
        value: 7 秒出额度
      - key: feature.borrow
        value: 1 分钟借钱
      - key: feature.arrival
        value: 3 分钟到账
      - key: cta.primary
        value: 查看额度
      - key: footer.disclaimer
        value: 本服务由微众银行提供
    figma_ref:
      node_id: "28934:18999"
      page: 欢迎页
      frame: 欢迎页

element_interactions:
  - interaction_id: INTER_WELCOME_CTA_CLICK
    triggered_by: ELEM_WELCOME_CTA
    action_type: click
    action_description: 用户点击「查看额度」按钮，触发页面跳转
    affects:
      - ELEM_WELCOME_CTA
    effect_detail:
      - element_id: ELEM_WELCOME_CTA
        update_type: navigate
        data_source: frontend_state
        new_state:
          state: STATE_WELCOME_EXITED
    applicable_states:
      - STATE_WELCOME_DEFAULT
    rule_ref: ""

page_elements:
  - element_id: ELEM_WELCOME_NAVBAR
    element_type: navbar
    element_name: 导航栏
    is_container: true
    parent_element_id: null
    default_visibility: true
    display_rules:
      - state_id: "*"
        visibility: true
        sub_elements:
          - element_id: ELEM_WELCOME_NAVBAR_TITLE
            element_type: text
            element_name: 页面标题
            display_text:
              type: constant
              value: "微粒贷"

  - element_id: ELEM_WELCOME_TITLE
    element_type: text
    element_name: 主标题
    is_container: false
    parent_element_id: null
    default_visibility: true
    display_rules:
      - state_id: STATE_WELCOME_DEFAULT
        visibility: true
        display_text:
          type: constant
          value: "微信上可以借钱了"
        figma_node_id: "28934:18999"

  - element_id: ELEM_WELCOME_FEATURES
    element_type: list
    element_name: 产品特性列表
    is_container: true
    parent_element_id: null
    default_visibility: true
    display_rules:
      - state_id: STATE_WELCOME_DEFAULT
        visibility: true
        sub_elements:
          - element_id: ELEM_WELCOME_FEATURE_SPEED
            element_type: text
            element_name: 速度特性
            display_text:
              type: constant
              value: "7 秒出额度"
          - element_id: ELEM_WELCOME_FEATURE_BORROW
            element_type: text
            element_name: 借款特性
            display_text:
              type: constant
              value: "1 分钟借钱"
          - element_id: ELEM_WELCOME_FEATURE_ARRIVAL
            element_type: text
            element_name: 到账特性
            display_text:
              type: constant
              value: "3 分钟到账"

  - element_id: ELEM_WELCOME_FOOTER
    element_type: text
    element_name: 底部说明
    is_container: false
    parent_element_id: null
    default_visibility: true
    display_rules:
      - state_id: STATE_WELCOME_DEFAULT
        visibility: true
        display_text:
          type: constant
          value: "本服务由微众银行提供"

  - element_id: ELEM_WELCOME_CTA
    element_type: button
    element_name: 查看额度按钮
    is_container: false
    parent_element_id: null
    default_visibility: true
    display_rules:
      - state_id: STATE_WELCOME_DEFAULT
        visibility: true
        display_text:
          type: constant
          value: "查看额度"
        click_action: navigate_to_quota
        click_target: STATE_WELCOME_EXITED
        figma_node_id: "28934:18999"

data_dictionary: []

