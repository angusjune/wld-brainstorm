<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人中心-双offer</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/chrome.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { margin: 0; background: #fff; }
</style>
</head>
<body>
<!-- ==========================================================================
     SCREEN: 个人中心-双offer (Personal Center — Dual Offer)
     New-user landing with estimated credit + two side-by-side promotional
     offer cards ("0 interest for 30 days" vs "discounted rate 7.2%").
     Layout: Preview chrome (home) → rate bar → credit display → offer header →
             two offer cards → footer + tab bar
     ========================================================================== -->

<div class="wld-page" id="screen-dual-offer" style="background: var(--wld-surface);">

  <!-- ===== WECHAT CHROME (Presentation-only) ===== -->
  <nav class="chrome-navbar chrome-navbar--home">
  <div class="chrome-statusbar">
    <span class="chrome-statusbar-time">9:41</span>
    <div class="chrome-statusbar-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" aria-hidden="true">

        </svg>

        <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
        <path d="M5.42676 8.40057C6.70234 7.32168 8.57111 7.32168 9.84669 8.40057C9.91071 8.45859 9.94746 8.54074 9.94923 8.62713C9.95095 8.71359 9.9172 8.79702 9.85548 8.8576L7.85841 10.8732C7.79988 10.9324 7.71998 10.966 7.63673 10.966C7.55347 10.966 7.47359 10.9324 7.41505 10.8732L5.417 8.8576C5.3554 8.797 5.32148 8.71351 5.32325 8.62713C5.32508 8.54068 5.36262 8.45855 5.42676 8.40057ZM2.76173 5.71111C5.50982 3.15507 9.76555 3.15512 12.5137 5.71111C12.5756 5.77097 12.6113 5.85351 12.6123 5.93963C12.6132 6.02581 12.5793 6.10892 12.5186 6.1701L11.3643 7.33709C11.2453 7.45619 11.0527 7.45884 10.9307 7.34295C10.0282 6.52576 8.85417 6.07337 7.63673 6.07342C6.42004 6.07392 5.24661 6.52628 4.34473 7.34295C4.22266 7.45877 4.03007 7.45617 3.91114 7.33709L2.75684 6.1701C2.69617 6.10903 2.66228 6.02572 2.66309 5.93963C2.66403 5.8535 2.69976 5.77095 2.76173 5.71111ZM0.0966866 3.02947C4.3118 -1.0097 10.9618 -1.00995 15.1768 3.02947C15.2377 3.08942 15.2719 3.17156 15.2725 3.25701C15.273 3.34257 15.239 3.42481 15.1787 3.48553L14.0225 4.65252C13.9033 4.77199 13.7107 4.77324 13.5899 4.65545C11.9839 3.12872 9.85255 2.27764 7.63673 2.27752C5.42063 2.27751 3.28877 3.12856 1.68262 4.65545C1.56183 4.77344 1.36905 4.77222 1.25001 4.65252L0.0937569 3.48553C0.0334926 3.42476 -0.000556156 3.34259 6.87362e-06 3.25701C0.000622824 3.1715 0.0356758 3.08939 0.0966866 3.02947Z" fill="currentColor"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
        <path opacity="0.35" d="M2.66699 0.5H19.333C20.5296 0.5 21.5 1.47037 21.5 2.66699V8.66699C21.4998 9.86346 20.5295 10.833 19.333 10.833H2.66699C1.47048 10.833 0.500176 9.86346 0.5 8.66699V2.66699C0.5 1.47038 1.47037 0.5 2.66699 0.5Z" stroke="currentColor"/>

        </svg>
    </div>
  </div>
  <div class="chrome-titlebar">
    <button class="chrome-navbar-back" aria-label="返回">
      <svg viewBox="0 0 12 20" fill="none" aria-hidden="true">
        <path d="M10 2L2 10L10 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="chrome-navbar-title">微粒贷</span>
    <div class="chrome-capsule" aria-hidden="true">
      <div class="chrome-capsule-dots">
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
      </div>
      <div class="chrome-capsule-divider"></div>
      <div class="chrome-capsule-close">
        <div class="chrome-capsule-close-ring">
          <div class="chrome-capsule-close-dot"></div>
        </div>
      </div>
    </div>
  </div>
</nav>

  <!-- ===== PAGE BODY ===== -->
  <div class="wld-page-body">

    <!-- Interest rate info bar -->
    <div class="wld-rate-bar">年利率 (单利) 10.8%，1千元用1天只需0.3元</div>

    <div class="wld-home-content">

    <!-- Credit display -->
    <div class="wld-home-credit">
        <span class="wld-home-label">预估可借</span>
        <span class="wld-home-amount">&#165;60000</span>
    </div>

    <!-- "新用户优惠 2 选 1" decorative header -->
    <div class="wld-dual-heading">
      <div class="wld-dual-heading-line wld-dual-heading-line--left"></div>
      <span class="wld-dual-heading-label">新用户优惠 2 选 1</span>
      <div class="wld-dual-heading-line wld-dual-heading-line--right"></div>
    </div>

    <!-- Two side-by-side offer cards -->
    <div class="wld-dual-offers">

      <!-- Card 1: 0 interest for 30 days -->
      <div class="wld-dual-offer-card">
        <div class="wld-dual-offer-kicker">前 30 天</div>
        <div class="wld-dual-offer-value">
          <span class="wld-dual-offer-number">0</span>
          <span class="wld-dual-offer-suffix">利息</span>
        </div>
        <button class="wld-btn wld-btn-primary wld-btn-s">借钱</button>
      </div>

      <!-- Card 2: Discounted annual rate -->
      <div class="wld-dual-offer-card">
        <div class="wld-dual-offer-kicker">优惠年利率</div>
        <div class="wld-dual-offer-value">
          <span class="wld-dual-offer-number">7.2%</span>
        </div>
        <button class="wld-btn wld-btn-primary wld-btn-s">借钱</button>
      </div>

    </div>

    </div>

    <!-- Footer -->
    <div class="wld-footer">
      <div class="wld-footer-links">
        <a href="#">借钱须知</a>
      </div>
      <div class="wld-footer-disclaimer">实际可借以当次借款审批为准</div>
    </div>

  </div>

  <!-- ===== TAB BAR ===== -->
  <div class="wld-tabbar">
    <button class="wld-tabbar-item">
      <div class="wld-tabbar-icon">
        <img src="assets/icons/tab-icon-home-filled.svg" alt="借钱" width="22" height="22">
      </div>
      <span class="wld-tabbar-label">借钱</span>
    </button>
    <button class="wld-tabbar-item wld-tabbar-item--inactive">
      <div class="wld-tabbar-icon">
        <img src="assets/icons/tab-icon-me.svg" alt="我的" width="22" height="22">
      </div>
      <span class="wld-tabbar-label">我的</span>
    </button>
  </div>

</div>

<style>
  .wld-dual-rate-bar {
    background: var(--wld-section);
    padding: 10px var(--wld-page-padding);
    font-size: var(--wld-text-caption);
    color: var(--wld-text-secondary);
    text-align: center;
  }
  .wld-dual-credit {
    background: var(--wld-surface);
    padding: 32px var(--wld-page-padding) 24px;
    text-align: center;
  }
  .wld-dual-credit-label {
    font-size: var(--wld-text-body2);
    color: var(--wld-text-secondary);
    margin-bottom: 8px;
  }
  .wld-dual-credit-amount {
    font-family: var(--wld-font-number);
    font-size: 44px;
    font-weight: 500;
    color: var(--wld-text-primary);
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .wld-dual-credit-symbol {
    font-size: 20px;
    margin-right: 2px;
  }
  .wld-dual-heading {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 5px 0 0;
  }
  .wld-dual-heading-line {
    flex: 1;
    height: 1px;
  }
  .wld-dual-heading-line--left {
    background: linear-gradient(to right, transparent, var(--wld-promo-500));
  }
  .wld-dual-heading-line--right {
    background: linear-gradient(to left, transparent, var(--wld-promo-500));
  }
  .wld-dual-heading-label {
    font-size: 18px;
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-promo-500);
    white-space: nowrap;
  }
  .wld-dual-offers {
      width: 100%;
    display: flex;
    gap: 10px;
    padding: 0 30px;
  }
  .wld-dual-offer-card {
    flex: 1;
    background: var(--wld-surface);
    border-radius: 16px;
    box-shadow: 0px 12px 24px var(--wld-black-100), inset 0 0 1px rgba(0,0,0,0.25);
    padding: 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .wld-dual-offer-kicker {
    font-size: var(--wld-text-body2);
  }
  .wld-dual-offer-value {
    line-height: 1.2;
  }
  .wld-dual-offer-number {
    font-family: var(--wld-font-number);
    font-size: 26px;
    font-weight: 600;
    color: var(--wld-text-primary);
  }
  .wld-dual-offer-suffix {
    font-size: 24px;
    font-weight: 600;
    color: var(--wld-text-primary);
    margin-left: 2px;
  }
  .wld-dual-footer {
    margin-top: 32px;
  }
  .wld-dual-tabbar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: var(--wld-page-width);
  }
</style>

</body>
</html>
