<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人中心-双offer</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/chrome.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { margin: 0; background: #fff; }
</style>
</head>
<body>
<!-- ==========================================================================
     SCREEN: 个人中心-双offer (Personal Center — Dual Offer)
     New-user landing with estimated credit + two side-by-side promotional
     offer cards ("0 interest for 30 days" vs "discounted rate 7.2%").
     Layout: Preview chrome (home) → rate bar → credit display → offer header →
             two offer cards → footer + tab bar
     ========================================================================== -->

<div class="wld-page" id="screen-dual-offer">

  <!-- ===== WECHAT CHROME (Presentation-only) ===== -->
  <nav class="chrome-navbar chrome-navbar--home">
  <div class="chrome-statusbar">
    <span class="chrome-statusbar-time">9:41</span>
    <div class="chrome-statusbar-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true">
        <rect x="0" y="3" width="3" height="9" rx="0.5" fill="currentColor"/>
        <rect x="4.5" y="2" width="3" height="10" rx="0.5" fill="currentColor"/>
        <rect x="9" y="0.5" width="3" height="11.5" rx="0.5" fill="currentColor"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true">
        <path d="M8 3.6C10.2 3.6 12.1 4.5 13.4 6L15 4.4C13.3 2.7 10.8 1.6 8 1.6S2.7 2.7 1 4.4L2.6 6C3.9 4.5 5.8 3.6 8 3.6Z" fill="currentColor"/>
        <path d="M8 7.2C9.3 7.2 10.5 7.7 11.4 8.6L8 12L4.6 8.6C5.5 7.7 6.7 7.2 8 7.2Z" fill="currentColor"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
        <rect x="0" y="0.5" width="22" height="11" rx="2" stroke="currentColor" stroke-width="1" fill="none"/>
        <rect x="23" y="3.5" width="1.5" height="5" rx="0.5" fill="currentColor"/>
        <rect x="2" y="2.5" width="18" height="7" rx="1" fill="currentColor"/>
      </svg>
    </div>
  </div>
  <div class="chrome-titlebar">
    <button class="chrome-navbar-back" aria-label="返回">
      <svg viewBox="0 0 12 20" fill="none" aria-hidden="true">
        <path d="M10 2L2 10L10 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="chrome-navbar-title">微粒贷</span>
    <div class="chrome-capsule" aria-hidden="true">
      <div class="chrome-capsule-dots">
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
      </div>
      <div class="chrome-capsule-divider"></div>
      <div class="chrome-capsule-close">
        <div class="chrome-capsule-close-ring">
          <div class="chrome-capsule-close-dot"></div>
        </div>
      </div>
    </div>
  </div>
</nav>

  <!-- ===== PAGE BODY ===== -->
  <div class="wld-page-body">

    <!-- Interest rate info bar -->
    <div style="
      background: var(--wld-section);
      padding: 10px var(--wld-page-padding);
      font-size: var(--wld-text-caption);
      color: var(--wld-text-secondary);
      text-align: center;
    ">年利率 (单利) 10.8%，1千元用1天只需0.3元</div>

    <!-- Credit display -->
    <div style="
      background: var(--wld-surface);
      padding: 32px var(--wld-page-padding) 24px;
      text-align: center;
    ">
      <div style="
        font-size: var(--wld-text-body2);
        color: var(--wld-text-secondary);
        margin-bottom: 8px;
      ">预估可借</div>
      <div style="
        font-family: var(--wld-font-number);
        font-size: 44px;
        font-weight: 500;
        color: var(--wld-text-primary);
        letter-spacing: -0.5px;
        line-height: 1.2;
      "><span style="font-size: 20px; margin-right: 2px;">¥</span>60000</div>
    </div>

    <!-- "新用户优惠 2 选 1" decorative header -->
    <div style="
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 24px 30px 16px;
    ">
      <div style="flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--wld-promo-500));"></div>
      <span style="
        font-size: 18px;
        font-weight: var(--wld-font-weight-semibold);
        color: var(--wld-promo-500);
        white-space: nowrap;
      ">新用户优惠 2 选 1</span>
      <div style="flex: 1; height: 1px; background: linear-gradient(to left, transparent, var(--wld-promo-500));"></div>
    </div>

    <!-- Two side-by-side offer cards -->
    <div style="display: flex; gap: 10px; padding: 0 30px;">

      <!-- Card 1: 0 interest for 30 days -->
      <div style="
        flex: 1;
        background: var(--wld-surface);
        border-radius: 16px;
        box-shadow: 0px 12px 24px var(--wld-black-100), inset 0 0 1px rgba(0,0,0,0.25);
        padding: 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      ">
        <div style="font-size: var(--wld-text-body2); color: var(--wld-text-secondary);">前 30 天</div>
        <div style="line-height: 1.2;">
          <span style="font-family: var(--wld-font-number); font-size: 26px; font-weight: 600; color: var(--wld-text-primary);">0</span>
          <span style="font-size: 24px; font-weight: 600; color: var(--wld-text-primary); margin-left: 2px;">利息</span>
        </div>
        <button class="wld-btn wld-btn-primary wld-btn-s">借钱</button>
      </div>

      <!-- Card 2: Discounted annual rate -->
      <div style="
        flex: 1;
        background: var(--wld-surface);
        border-radius: 16px;
        box-shadow: 0px 12px 24px var(--wld-black-100), inset 0 0 1px rgba(0,0,0,0.25);
        padding: 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      ">
        <div style="font-size: var(--wld-text-body2); color: var(--wld-text-secondary);">优惠年利率</div>
        <div style="line-height: 1.2;">
          <span style="font-family: var(--wld-font-number); font-size: 26px; font-weight: 600; color: var(--wld-text-primary);">7.2%</span>
        </div>
        <button class="wld-btn wld-btn-primary wld-btn-s">借钱</button>
      </div>

    </div>

    <!-- Footer -->
    <div class="wld-footer" style="margin-top: 32px;">
      <div class="wld-footer-links">
        <a href="#">借钱须知</a>
      </div>
      <div class="wld-footer-disclaimer">实际可借以当次借款审批为准</div>
    </div>

  </div>

  <!-- ===== TAB BAR ===== -->
  <div class="wld-tabbar" style="position: absolute; bottom: 0; left: 0; width: var(--wld-page-width);">
    <button class="wld-tabbar-item">
      <div class="wld-tabbar-icon">
        <img src="assets/icons/tab-icon-home-filled.svg" alt="借钱" width="22" height="22">
      </div>
      <span class="wld-tabbar-label">借钱</span>
    </button>
    <button class="wld-tabbar-item wld-tabbar-item--inactive">
      <div class="wld-tabbar-icon">
        <img src="assets/icons/tab-icon-me.svg" alt="我的" width="22" height="22">
      </div>
      <span class="wld-tabbar-label">我的</span>
    </button>
  </div>

</div>

</body>
</html>
