<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提前还清</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/chrome.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { margin: 0; background: #fff; }
</style>
</head>
<body>
<!--
  WLD Screen: 提前还清 (Early Repayment)
  Select outstanding loans and repay them early.
  Layout: Preview chrome (back) → white card with loan receipt rows → action bar at card bottom
  Background: #F5F5F5
-->

<div class="wld-page">

  <!-- ===== WECHAT CHROME (Presentation-only) ===== -->
  <nav class="chrome-navbar chrome-navbar--inner">
  <div class="chrome-statusbar">
    <span class="chrome-statusbar-time">9:41</span>
    <div class="chrome-statusbar-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true">
        <rect x="0" y="3" width="3" height="9" rx="0.5" fill="currentColor"/>
        <rect x="4.5" y="2" width="3" height="10" rx="0.5" fill="currentColor"/>
        <rect x="9" y="0.5" width="3" height="11.5" rx="0.5" fill="currentColor"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true">
        <path d="M8 3.6C10.2 3.6 12.1 4.5 13.4 6L15 4.4C13.3 2.7 10.8 1.6 8 1.6S2.7 2.7 1 4.4L2.6 6C3.9 4.5 5.8 3.6 8 3.6Z" fill="currentColor"/>
        <path d="M8 7.2C9.3 7.2 10.5 7.7 11.4 8.6L8 12L4.6 8.6C5.5 7.7 6.7 7.2 8 7.2Z" fill="currentColor"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
        <rect x="0" y="0.5" width="22" height="11" rx="2" stroke="currentColor" stroke-width="1" fill="none"/>
        <rect x="23" y="3.5" width="1.5" height="5" rx="0.5" fill="currentColor"/>
        <rect x="2" y="2.5" width="18" height="7" rx="1" fill="currentColor"/>
      </svg>
    </div>
  </div>
  <div class="chrome-titlebar">
    <button class="chrome-navbar-back" aria-label="返回">
      <svg viewBox="0 0 12 20" fill="none" aria-hidden="true">
        <path d="M10 2L2 10L10 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="chrome-navbar-title">提前还清借款</span>
    <div class="chrome-capsule" aria-hidden="true">
      <div class="chrome-capsule-dots">
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
      </div>
      <div class="chrome-capsule-divider"></div>
      <div class="chrome-capsule-close">
        <div class="chrome-capsule-close-ring">
          <div class="chrome-capsule-close-dot"></div>
        </div>
      </div>
    </div>
  </div>
</nav>

  <!-- ===== PAGE BODY ===== -->
  <div class="wld-page-body">

    <!-- White card containing all receipt rows -->
    <div class="wld-repay-card">

      <!-- Section title -->
      <div class="wld-repay-section-title">借款</div>

      <!-- ===== ROW 1: Disabled (cannot repay yet) ===== -->
      <div class="wld-repay-row is-disabled">
        <div class="wld-repay-row-left">
          <div class="wld-checkbox is-disabled">
            <!-- empty — unchecked disabled -->
          </div>
        </div>
        <div class="wld-repay-row-content">
          <div class="wld-repay-row-main">
            <div class="wld-repay-row-info">
              <span class="wld-repay-row-title">借款 ¥500</span>
              <span class="wld-repay-row-date">2020/05/21</span>
            </div>
            <div class="wld-repay-row-right">
              <span class="wld-repay-row-amount">明日起可还</span>
              <!-- Info icon -->
              <svg class="wld-repay-info-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="9" r="8" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
                <text x="9" y="13" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(0,0,0,0.35)" font-family="-apple-system, sans-serif">i</text>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== ROW 2: Enabled, unchecked ===== -->
      <div class="wld-repay-row">
        <div class="wld-repay-row-left">
          <div class="wld-checkbox">
            <!-- empty — unchecked -->
          </div>
        </div>
        <div class="wld-repay-row-content">
          <div class="wld-repay-row-main">
            <div class="wld-repay-row-info">
              <span class="wld-repay-row-title">借款 ¥500.00</span>
              <span class="wld-repay-row-date">2020/05/20</span>
            </div>
            <div class="wld-repay-row-right">
              <span class="wld-repay-row-amount">应还¥500.50</span>
              <!-- Info icon -->
              <svg class="wld-repay-info-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="9" r="8" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
                <text x="9" y="13" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(0,0,0,0.35)" font-family="-apple-system, sans-serif">i</text>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== ROW 3: Enabled, checked ===== -->
      <div class="wld-repay-row">
        <div class="wld-repay-row-left">
          <div class="wld-checkbox is-checked">
            <svg viewBox="0 0 16 16" fill="none">
              <path d="M4 8.5l2.5 2.5L12 5" stroke="rgba(0,0,0,0.9)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="wld-repay-row-content wld-repay-row-content--last">
          <div class="wld-repay-row-main">
            <div class="wld-repay-row-info">
              <span class="wld-repay-row-title">借款 ¥500.00</span>
              <span class="wld-repay-row-date">2020/05/01</span>
            </div>
            <div class="wld-repay-row-right">
              <div class="wld-repay-row-amount-group">
                <span class="wld-repay-row-amount">应还¥504.00</span>
                <span class="wld-repay-row-discount">已抵扣¥50</span>
              </div>
              <!-- Info icon -->
              <svg class="wld-repay-info-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="9" r="8" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
                <text x="9" y="13" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(0,0,0,0.35)" font-family="-apple-system, sans-serif">i</text>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== ACTION BAR (bottom of card) ===== -->
      <div class="wld-repay-action-bar">
        <div class="wld-repay-action-left">
          <div class="wld-checkbox">
            <!-- empty — unchecked "select all" -->
          </div>
          <span class="wld-repay-action-label">全选</span>
        </div>
        <div class="wld-repay-action-right">
          <div class="wld-repay-action-total">
            <span class="wld-repay-total-label">总计</span>
            <span class="wld-repay-total-amount">¥504.00</span>
          </div>
          <button class="wld-btn wld-btn-primary wld-btn-s">还款</button>
        </div>
      </div>

    </div>

  </div>

</div>

<style>
  /* ===== Repayment Card ===== */
  .wld-repay-card {
    background: var(--wld-surface);
    border-radius: 12px;
    margin: 15px;
    padding-top: 20px;
    overflow: hidden;
  }

  /* Section title */
  .wld-repay-section-title {
    font-size: 18px;
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
    padding: 0 20px 4px;
  }

  /* ===== Receipt Row ===== */
  .wld-repay-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 20px;
  }

  .wld-repay-row-left {
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }

  .wld-repay-row-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px 0;
    border-bottom: 0.5px solid var(--wld-divider);
  }
  .wld-repay-row-content--last {
    border-bottom: none;
  }

  .wld-repay-row-main {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-right: 20px;
  }

  .wld-repay-row-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .wld-repay-row-title {
    font-size: 14px;
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
    line-height: 1.4;
  }

  .wld-repay-row-date {
    font-size: 12px;
    color: var(--wld-text-secondary);
    line-height: 1.4;
  }

  .wld-repay-row-right {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .wld-repay-row-amount-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
  }

  .wld-repay-row-amount {
    font-size: 14px;
    color: var(--wld-text-primary);
    line-height: 1.4;
  }

  .wld-repay-row-discount {
    font-size: 12px;
    color: var(--wld-text-secondary);
    line-height: 1.4;
  }

  .wld-repay-info-icon {
    flex-shrink: 0;
  }

  /* ===== Disabled Row ===== */
  .wld-repay-row.is-disabled .wld-repay-row-title,
  .wld-repay-row.is-disabled .wld-repay-row-date,
  .wld-repay-row.is-disabled .wld-repay-row-amount {
    color: var(--wld-text-tertiary);
  }

  /* Disabled checkbox override: greyed border at rgba(0,0,0,0.16) */
  .wld-repay-row.is-disabled .wld-checkbox {
    border-color: var(--wld-black-300);
  }

  /* ===== Action Bar ===== */
  .wld-repay-action-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 20px;
    border-top: 0.5px solid var(--wld-divider);
  }

  .wld-repay-action-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .wld-repay-action-label {
    font-size: 14px;
    color: var(--wld-text-primary);
  }

  .wld-repay-action-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .wld-repay-action-total {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .wld-repay-total-label {
    font-size: 14px;
    color: var(--wld-text-secondary);
  }

  .wld-repay-total-amount {
    font-family: var(--wld-font-number);
    font-size: 18px;
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
  }
</style>

</body>
</html>
