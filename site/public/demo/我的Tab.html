<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的Tab</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/chrome.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { margin: 0; background: #fff; }
</style>
</head>
<body>
<!--
  WLD Screen: 我的Tab (My / Account Tab)
  Account tab from the home shell — avatar header, supplemental info CTA, 6-item feature grid,
  exclusive-welfare row, and the bottom tab bar with "我的" active.
  Layout: Preview chrome (no back) → user header → info card → feature grid card → welfare card → tab bar
  Background: #F5F5F5
-->

<div class="wld-page">

  <!-- ===== WECHAT CHROME (Presentation-only) ===== -->
  <nav class="chrome-navbar chrome-navbar--home">
  <div class="chrome-statusbar">
    <span class="chrome-statusbar-time">9:41</span>
    <div class="chrome-statusbar-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" aria-hidden="true">
        <path d="M2 6.66699C2.55228 6.66699 3 7.11471 3 7.66699V9.66699C2.99982 10.2191 2.55218 10.667 2 10.667H1C0.447824 10.667 0.000175969 10.2191 0 9.66699V7.66699C0 7.11471 0.447715 6.66699 1 6.66699H2ZM6.66699 4.66699C7.21913 4.66717 7.66699 5.11482 7.66699 5.66699V9.66699C7.66682 10.219 7.21902 10.6668 6.66699 10.667H5.66699C5.11482 10.667 4.66717 10.2191 4.66699 9.66699V5.66699C4.66699 5.11471 5.11471 4.66699 5.66699 4.66699H6.66699ZM11.333 2.33301C11.8852 2.33301 12.3328 2.78087 12.333 3.33301V9.66699C12.3328 10.2191 11.8852 10.667 11.333 10.667H10.333C9.78098 10.6668 9.33318 10.219 9.33301 9.66699V3.33301C9.33318 2.78098 9.78098 2.33318 10.333 2.33301H11.333ZM16 0C16.5523 0 17 0.447715 17 1V9.66699C16.9998 10.2191 16.5522 10.667 16 10.667H15C14.4478 10.667 14.0002 10.2191 14 9.66699V1C14 0.447715 14.4477 0 15 0H16Z" fill="currentColor" />
        </svg>

        <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
        <path d="M5.42676 8.40057C6.70234 7.32168 8.57111 7.32168 9.84669 8.40057C9.91071 8.45859 9.94746 8.54074 9.94923 8.62713C9.95095 8.71359 9.9172 8.79702 9.85548 8.8576L7.85841 10.8732C7.79988 10.9324 7.71998 10.966 7.63673 10.966C7.55347 10.966 7.47359 10.9324 7.41505 10.8732L5.417 8.8576C5.3554 8.797 5.32148 8.71351 5.32325 8.62713C5.32508 8.54068 5.36262 8.45855 5.42676 8.40057ZM2.76173 5.71111C5.50982 3.15507 9.76555 3.15512 12.5137 5.71111C12.5756 5.77097 12.6113 5.85351 12.6123 5.93963C12.6132 6.02581 12.5793 6.10892 12.5186 6.1701L11.3643 7.33709C11.2453 7.45619 11.0527 7.45884 10.9307 7.34295C10.0282 6.52576 8.85417 6.07337 7.63673 6.07342C6.42004 6.07392 5.24661 6.52628 4.34473 7.34295C4.22266 7.45877 4.03007 7.45617 3.91114 7.33709L2.75684 6.1701C2.69617 6.10903 2.66228 6.02572 2.66309 5.93963C2.66403 5.8535 2.69976 5.77095 2.76173 5.71111ZM0.0966866 3.02947C4.3118 -1.0097 10.9618 -1.00995 15.1768 3.02947C15.2377 3.08942 15.2719 3.17156 15.2725 3.25701C15.273 3.34257 15.239 3.42481 15.1787 3.48553L14.0225 4.65252C13.9033 4.77199 13.7107 4.77324 13.5899 4.65545C11.9839 3.12872 9.85255 2.27764 7.63673 2.27752C5.42063 2.27751 3.28877 3.12856 1.68262 4.65545C1.56183 4.77344 1.36905 4.77222 1.25001 4.65252L0.0937569 3.48553C0.0334926 3.42476 -0.000556156 3.34259 6.87362e-06 3.25701C0.000622824 3.1715 0.0356758 3.08939 0.0966866 3.02947Z" fill="currentColor"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
        <path opacity="0.35" d="M2.66699 0.5H19.333C20.5296 0.5 21.5 1.47037 21.5 2.66699V8.66699C21.4998 9.86346 20.5295 10.833 19.333 10.833H2.66699C1.47048 10.833 0.500176 9.86346 0.5 8.66699V2.66699C0.5 1.47038 1.47037 0.5 2.66699 0.5Z" stroke="currentColor"/>
        <path opacity="0.4" d="M23 3.6665V7.6665C23.8047 7.32773 24.328 6.53964 24.328 5.6665C24.328 4.79337 23.8047 4.00528 23 3.6665" fill="currentColor"/>

        </svg>
    </div>
  </div>
  <div class="chrome-titlebar">
    <button class="chrome-navbar-back" aria-label="返回">
      <svg viewBox="0 0 12 20" fill="none" aria-hidden="true">
        <path d="M10 2L2 10L10 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="chrome-navbar-title"></span>
    <div class="chrome-capsule" aria-hidden="true">
      <div class="chrome-capsule-dots">
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
      </div>
      <div class="chrome-capsule-divider"></div>
      <div class="chrome-capsule-close">
        <div class="chrome-capsule-close-ring">
          <div class="chrome-capsule-close-dot"></div>
        </div>
      </div>
    </div>
  </div>
</nav>

  <!-- ===== PAGE BODY ===== -->
  <div class="wld-page-body">

    <!-- User header row -->
    <div class="wld-me-header">
      <!-- Avatar -->
      <div class="wld-me-avatar">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="16" r="7" stroke="rgba(0,0,0,0.35)" stroke-width="1.6" fill="none"/>
          <path d="M8 33c0-6.6 5.4-12 12-12s12 5.4 12 12" stroke="rgba(0,0,0,0.35)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="wld-me-header-text">
        <span class="wld-me-name">道明</span>
        <span class="wld-me-tag">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="7" cy="7" r="6" stroke="rgba(0,0,0,0.45)" stroke-width="1" fill="none"/>
            <path d="M4.2 7.2l2 2 3.6-3.6" stroke="rgba(0,0,0,0.45)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          已实名
        </span>
      </div>
    </div>

    <!-- Supplemental info card -->
    <div class="wld-me-card">
      <div class="wld-me-row">
        <span class="wld-me-row-icon wld-me-row-icon--gold">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 12V4M8 4L4.5 7.5M8 4l3.5 3.5" stroke="rgba(0,0,0,0.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div class="wld-me-row-stack">
          <span class="wld-me-row-title">补充信息</span>
          <span class="wld-me-row-sub">有助于提升信用</span>
        </div>
        <img src="assets/icons/chevron-right.svg" alt="" width="18" height="18" style="margin-left:auto;">
      </div>
    </div>

    <!-- Feature grid card (3 cols × 2 rows) -->
    <div class="wld-me-card wld-me-grid">
      <button class="wld-me-grid-item">
        <span class="wld-me-grid-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="6" y="4" width="16" height="20" rx="2" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
            <path d="M10 10h8M10 14h8M10 18h5" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="wld-me-grid-label">借还记录</span>
      </button>
      <button class="wld-me-grid-item">
        <span class="wld-me-grid-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M5 9a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H7a2 2 0 01-2-2v-2a2 2 0 000-4V9z" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
            <path d="M14 9v10" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" stroke-dasharray="2 2"/>
          </svg>
        </span>
        <span class="wld-me-grid-label">优惠券</span>
      </button>
      <button class="wld-me-grid-item">
        <span class="wld-me-grid-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="4" y="7" width="14" height="14" rx="2" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
            <rect x="10" y="3" width="14" height="14" rx="2" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
            <path d="M14 10l3 3 5-5" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="wld-me-grid-label">更换还款卡</span>
      </button>
      <button class="wld-me-grid-item">
        <span class="wld-me-grid-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="3" y="7" width="22" height="14" rx="2" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
            <path d="M3 11h22" stroke="rgba(0,0,0,0.85)" stroke-width="1.5"/>
            <rect x="7" y="15" width="5" height="2.5" rx="0.5" fill="rgba(0,0,0,0.85)"/>
          </svg>
        </span>
        <span class="wld-me-grid-label">微卡</span>
      </button>
      <button class="wld-me-grid-item">
        <span class="wld-me-grid-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="6" y="4" width="16" height="20" rx="2" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
            <path d="M10 10h8M10 14h8" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="19" cy="20" r="3" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
            <path d="M17 20l1.5 1.5L21 19" stroke="rgba(0,0,0,0.85)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="wld-me-grid-label">开具证明</span>
      </button>
      <button class="wld-me-grid-item">
        <span class="wld-me-grid-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 4a8 8 0 00-8 8v3a3 3 0 003 3h1v-7H9v-1a5 5 0 0110 0v1h-1v7h2a3 3 0 003-3v-3a8 8 0 00-8-8z" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
            <path d="M19 18v1a3 3 0 01-3 3h-2" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          </svg>
        </span>
        <span class="wld-me-grid-label">帮助中心</span>
      </button>
    </div>

    <!-- Exclusive welfare section -->
    <div class="wld-me-section-title">专属福利</div>
    <div class="wld-me-card">
      <div class="wld-me-row">
        <span class="wld-me-row-icon">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <rect x="3" y="8" width="16" height="11" rx="1.5" stroke="rgba(0,0,0,0.85)" stroke-width="1.4" fill="none"/>
            <path d="M11 8v11M3 12h16" stroke="rgba(0,0,0,0.85)" stroke-width="1.4"/>
            <path d="M11 8s-3-3-4-3.5C5.7 4 5.7 5.5 7 6.5c1 .9 4 1.5 4 1.5z" stroke="rgba(0,0,0,0.85)" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
            <path d="M11 8s3-3 4-3.5C16.3 4 16.3 5.5 15 6.5c-1 .9-4 1.5-4 1.5z" stroke="rgba(0,0,0,0.85)" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="wld-me-row-title">添加福利小助手</span>
        <div class="wld-me-row-link">
          <span>领 15 天免息券</span>
          <img src="assets/icons/chevron-right.svg" alt="" width="18" height="18">
        </div>
      </div>
    </div>

  </div>

  <!-- ===== TAB BAR ===== -->
  <div class="wld-tabbar">
    <!-- Inactive tab: 借钱 -->
    <button class="wld-tabbar-item wld-tabbar-item--inactive">
      <div class="wld-tabbar-icon">
        <img src="assets/icons/tab-icon-home.svg" alt="借钱" width="22" height="22">
      </div>
      <span class="wld-tabbar-label">借钱</span>
    </button>
    <!-- Active tab: 我的 -->
    <button class="wld-tabbar-item">
      <div class="wld-tabbar-icon">
        <img src="assets/icons/tab-icon-me-filled.svg" alt="我的" width="22" height="22">
      </div>
      <span class="wld-tabbar-label">我的</span>
    </button>
  </div>

</div>

<style>
  /* User header row */
  .wld-me-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 12px var(--wld-page-padding) 0;
    padding: 12px;
    background: var(--wld-surface);
    border-radius: 12px;
  }
  .wld-me-avatar {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: var(--wld-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .wld-me-header-text {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .wld-me-name {
    font-size: var(--wld-text-h2);
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
    line-height: 1.2;
  }
  .wld-me-tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: var(--wld-text-caption);
    color: var(--wld-text-secondary);
  }

  /* Generic me card */
  .wld-me-card {
    background: var(--wld-surface);
    border-radius: 12px;
    margin: 12px var(--wld-page-padding) 0;
    overflow: hidden;
  }

  /* Row inside me card */
  .wld-me-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    min-height: 52px;
  }
  .wld-me-row-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .wld-me-row-icon--gold {
    background: var(--wld-theme-500);
    border-radius: 50%;
  }
  .wld-me-row-stack {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .wld-me-row-title {
    font-size: var(--wld-text-body1);
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
  }
  .wld-me-row-sub {
    font-size: var(--wld-text-caption);
    color: var(--wld-text-secondary);
  }
  .wld-me-row-link {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: var(--wld-text-body2);
    color: var(--wld-text-secondary);
  }

  /* Feature grid: 3 cols × 2 rows */
  .wld-me-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 18px 0;
    gap: 16px 0;
  }
  .wld-me-grid-item {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-family: var(--wld-font-family);
  }
  .wld-me-grid-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wld-me-grid-label {
    font-size: var(--wld-text-body2);
    color: var(--wld-text-primary);
  }

  /* Section title */
  .wld-me-section-title {
    font-size: var(--wld-text-body1);
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
    margin: 22px var(--wld-page-padding) 0;
  }
</style>

</body>
</html>
