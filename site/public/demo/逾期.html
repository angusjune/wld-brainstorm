<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>逾期</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/chrome.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { margin: 0; background: #fff; }
</style>
</head>
<body>
<!--
  WLD Screen: 逾期 (Overdue — D+7 以内)
  Home screen in the overdue state: the loan offer is replaced by a single card
  carrying the credit-reporting warning, the overdue amount, and two repayment
  actions (部分还款 secondary / 全部还款 primary — still one gold action).
  Layout: Preview chrome (home, grey navbar) → overdue card (red indicator +
  warning → amount → actions → 应还详情) → footer → tab bar
  Background: #F5F5F5 (page default — the navbar matches it, not white)
-->

<div class="wld-page">

  <!-- ===== WECHAT CHROME (Presentation-only) ===== -->
  <nav class="chrome-navbar chrome-navbar--home">
  <div class="chrome-statusbar">
    <span class="chrome-statusbar-time">9:41</span>
    <div class="chrome-statusbar-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" aria-hidden="true">

        <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">

        </svg>

        </svg>
    </div>
  </div>
  <div class="chrome-titlebar">
    <button class="chrome-navbar-back" aria-label="返回">
      <svg viewBox="0 0 12 20" fill="none" aria-hidden="true">
        <path d="M10 2L2 10L10 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="chrome-navbar-title">微粒贷</span>
    <div class="chrome-capsule" aria-hidden="true">
      <div class="chrome-capsule-dots">
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
      </div>
      <div class="chrome-capsule-divider"></div>
      <div class="chrome-capsule-close">
        <div class="chrome-capsule-close-ring">
          <div class="chrome-capsule-close-dot"></div>
        </div>
      </div>
    </div>
  </div>
</nav>

  <!-- ===== PAGE BODY ===== -->
  <div class="wld-page-body" style="display: flex; flex-direction: column; padding-bottom: 0;">

    <!-- Overdue card -->
    <div class="wld-card wld-overdue-card">

      <!-- Header: red top indicator + credit-reporting warning -->
      <div class="wld-overdue-header">
        <div class="wld-overdue-indicator"></div>
        <div class="wld-overdue-warning">
          <span class="wld-overdue-warning-text">逾期9天，逾期信息已上报人行征信，请立即还款以弥补不良征信记录</span>
          <!-- Info icon (circle with i) -->
          <svg class="wld-overdue-info" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="8" stroke="var(--wld-danger-500)" stroke-width="1"/>
            <text x="9" y="13" text-anchor="middle" font-size="11" font-weight="600" font-family="-apple-system, sans-serif" fill="var(--wld-danger-500)">i</text>
          </svg>
        </div>
        <div class="wld-hr"></div>
      </div>

      <!-- Main: overdue amount + repayment actions -->
      <div class="wld-overdue-main">
        <div class="wld-home-credit">
          <span class="wld-home-label">逾期金额</span>
          <span class="wld-home-amount">&#165;1725.29</span>
        </div>
        <div class="wld-overdue-actions">
          <button class="wld-btn wld-btn-m wld-btn-secondary">部分还款</button>
          <button class="wld-btn wld-btn-m wld-btn-primary">全部还款</button>
        </div>
      </div>

      <div class="wld-hr"></div>

      <!-- Repayment breakdown entry -->
      <div class="wld-overdue-details">
        <div class="wld-overdue-row">
          <span class="wld-overdue-row-label">应还详情</span>
          <!-- Chevron right -->
          <img class="wld-overdue-chevron" src="assets/icons/chevron-right.svg" alt="" width="18" height="18">
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="wld-footer wld-overdue-footer">
      <div class="wld-footer-disclaimer">本服务由微众银行提供</div>
    </div>

  </div>

  <!-- ===== TAB BAR ===== -->
  <div class="wld-tabbar">
    <!-- Active tab: 借钱 -->
    <button class="wld-tabbar-item">
      <div class="wld-tabbar-icon">
        <img src="assets/icons/tab-icon-home-filled.svg" alt="借钱" width="22" height="22">
      </div>
      <span class="wld-tabbar-label">借钱</span>
    </button>
    <!-- Inactive tab: 我的 -->
    <button class="wld-tabbar-item wld-tabbar-item--inactive">
      <div class="wld-tabbar-icon">
        <img src="assets/icons/tab-icon-me.svg" alt="我的" width="22" height="22">
      </div>
      <span class="wld-tabbar-label">我的</span>
    </button>
  </div>

</div>

<style>
  /* Overdue card — sits alone on the grey page, no shadow needed */
  .wld-overdue-card {
    margin: 15px var(--wld-page-padding);
    box-shadow: none;
    flex-shrink: 0;
  }

  /* Header — red indicator, warning copy, closing rule */
  .wld-overdue-header {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .wld-overdue-indicator {
    height: 4px;
    background: var(--wld-danger-500);
  }
  .wld-overdue-warning {
    display: flex;
    align-items: flex-start;
    gap: 5px;
    padding: 0 var(--wld-card-padding);
  }
  .wld-overdue-warning-text {
    flex: 1;
    font-size: 14px;
    color: var(--wld-text-error);
    line-height: 1.5;
  }
  .wld-overdue-info {
    flex-shrink: 0;
    margin-top: 1px;
    cursor: pointer;
  }

  /* Main — amount above the two repayment actions */
  .wld-overdue-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 30px 0;
  }
  .wld-overdue-actions {
    display: flex;
    justify-content: center;
    gap: 20px;
  }
  /* Paired actions sit tighter than a lone M button (25px, per the design) */
  .wld-overdue-actions .wld-btn-m {
    padding: 0 25px;
  }

  /* Repayment breakdown row */
  .wld-overdue-details {
    padding: 10px 0;
  }
  .wld-overdue-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 40px;
    padding: 0 15px 0 var(--wld-card-padding);
  }
  .wld-overdue-row-label {
    font-size: 14px;
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
  }
  .wld-overdue-chevron {
    flex-shrink: 0;
  }

  /* Footer sits at the bottom of the screen, above the tab bar */
  .wld-overdue-footer {
    margin-top: auto;
  }
  .wld-overdue-footer .wld-footer-disclaimer {
    color: var(--wld-text-tertiary);
  }
</style>

</body>
</html>
