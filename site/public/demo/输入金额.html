<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>输入金额</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/chrome.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { margin: 0; background: #fff; }
</style>
</head>
<body>
<!--
  WLD Screen: 输入金额 (Loan Amount Input)
  The loan configuration screen where users enter an amount and review terms.
  Layout: Preview chrome (back) → amount input (white) → promotion row → loan options card → bottom CTA
  Background: #F5F5F5
-->

<div class="wld-page">

  <!-- ===== WECHAT CHROME (Presentation-only) ===== -->
  <nav class="chrome-navbar chrome-navbar--inner">
  <div class="chrome-statusbar">
    <span class="chrome-statusbar-time">9:41</span>
    <div class="chrome-statusbar-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" aria-hidden="true">

        <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">

        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
        <path opacity="0.35" d="M2.66699 0.5H19.333C20.5296 0.5 21.5 1.47037 21.5 2.66699V8.66699C21.4998 9.86346 20.5295 10.833 19.333 10.833H2.66699C1.47048 10.833 0.500176 9.86346 0.5 8.66699V2.66699C0.5 1.47038 1.47037 0.5 2.66699 0.5Z" stroke="currentColor"/>

        </svg>
    </div>
  </div>
  <div class="chrome-titlebar">
    <button class="chrome-navbar-back" aria-label="返回">
      <svg viewBox="0 0 12 20" fill="none" aria-hidden="true">
        <path d="M10 2L2 10L10 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="chrome-navbar-title">微粒贷</span>
    <div class="chrome-capsule" aria-hidden="true">
      <div class="chrome-capsule-dots">
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
      </div>
      <div class="chrome-capsule-divider"></div>
      <div class="chrome-capsule-close">
        <div class="chrome-capsule-close-ring">
          <div class="chrome-capsule-close-dot"></div>
        </div>
      </div>
    </div>
  </div>
</nav>

  <!-- ===== PAGE BODY ===== -->
  <div class="wld-page-body">

    <!-- Amount input section (white bg, full bleed) -->
    <div class="wld-loan-amount">
      <div class="wld-loan-amount-row">
        <div class="wld-loan-amount-value">
          <span class="wld-loan-amount-prefix">&#165;</span>
          <span class="wld-loan-amount-number">10000</span>
        </div>
        <!-- Clear (x) button -->
        <button class="wld-loan-amount-clear">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="11" fill="rgba(0,0,0,0.1)"/>
            <path d="M8.5 8.5L15.5 15.5M15.5 8.5L8.5 15.5" stroke="rgba(0,0,0,0.4)" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="wld-loan-amount-underline"></div>
      <!-- Quick amount pills -->
      <div class="wld-loan-amount-pills">
        <span class="wld-loan-amount-pill">借 1 万</span>
        <span class="wld-loan-amount-pill">借 2 万</span>
        <span class="wld-loan-amount-pill">借全部</span>
      </div>
    </div>

    <!-- Promotion row -->
    <div class="wld-promo-row">
      <div class="wld-promo-row-left">
        <span class="wld-promo-row-icon"><img src="assets/icons/icn-coupon.svg" alt="" width="24" height="24"></span>
        <span class="wld-promo-row-label">前30天0利息</span>
      </div>
      <div class="wld-promo-row-right">
        <span class="wld-promo-row-savings">省利息&#165;150.00</span>
        <!-- Chevron arrow -->
        <img src="assets/icons/chevron-right.svg" alt="" width="18" height="18">
      </div>
    </div>

    <!-- Loan options card -->
    <div class="wld-loan-options">

      <!-- Row: 借款期数 -->
      <div class="wld-loan-options-row">
        <div class="wld-loan-options-row-content">
          <span class="wld-loan-options-label">借款期数</span>
          <div class="wld-loan-options-value-group">
            <span class="wld-loan-options-value">24 个月</span>
            <img src="assets/icons/chevron-right.svg" alt="" width="18" height="18">
          </div>
        </div>
      </div>

      <!-- Row: 还款计划 -->
      <div class="wld-loan-options-row">
        <div class="wld-loan-options-row-content">
          <span class="wld-loan-options-label">还款计划</span>
          <div class="wld-loan-options-value-group">
            <span class="wld-loan-options-value">首次6月16日，应还 &#165;683.00</span>
            <img src="assets/icons/chevron-right.svg" alt="" width="18" height="18">
          </div>
        </div>
      </div>

      <!-- Row: 收款账户 -->
      <div class="wld-loan-options-row">
        <div class="wld-loan-options-row-content">
          <span class="wld-loan-options-label">收款账户</span>
          <div class="wld-loan-options-value-group">
            <!-- Bank icon -->
            <img src="assets/icons/logo-icbc.svg" alt="工商银行" width="24" height="24">
            <span class="wld-loan-options-value">工商银行 (2004)</span>
            <img src="assets/icons/chevron-right.svg" alt="" width="18" height="18">
          </div>
        </div>
      </div>

      <!-- Row: 借款用途 -->
      <div class="wld-loan-options-row">
        <div class="wld-loan-options-row-content">
          <span class="wld-loan-options-label">借款用途</span>
          <div class="wld-loan-options-value-group">
            <span class="wld-loan-options-value">个人日常消费</span>
            <img src="assets/icons/chevron-right.svg" alt="" width="18" height="18">
          </div>
        </div>
      </div>

      <!-- Row: 协议相关 -->
      <div class="wld-loan-options-row">
        <div class="wld-loan-options-row-content">
          <span class="wld-loan-options-label">协议相关</span>
          <div class="wld-loan-options-value-group">
            <span class="wld-loan-options-value">年利率 (单利) 10.8%</span>
            <img src="assets/icons/chevron-right.svg" alt="" width="18" height="18">
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- ===== BOTTOM ACTION AREA ===== -->
  <div class="wld-loan-bottom">
    <button class="wld-btn wld-btn-primary wld-btn-m">下一步</button>
    <div class="wld-loan-bottom-disclaimer">按日计息，次日起可提前还，免违约金</div>
  </div>

</div>

<style>
  /* Amount input section — white bg, full bleed */
  .wld-loan-amount {
    background: var(--wld-surface);
    padding: 35px var(--wld-page-padding);
  }
  .wld-loan-amount-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .wld-loan-amount-value {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .wld-loan-amount-prefix {
    font-family: var(--wld-font-number);
    font-size: var(--wld-text-numbers);
    font-weight: 500;
    color: var(--wld-text-primary);
    line-height: 1.2;
  }
  .wld-loan-amount-number {
    font-family: var(--wld-font-number);
    font-size: var(--wld-text-numbers);
    font-weight: 500;
    color: var(--wld-text-primary);
    line-height: 1.2;
  }
  .wld-loan-amount-clear {
    width: 24px;
    height: 24px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .wld-loan-amount-clear svg {
    display: block;
  }
  .wld-loan-amount-underline {
    height: 1px;
    background: var(--wld-theme-500);
    margin-top: 8px;
  }
  .wld-loan-amount-hint {
    font-size: var(--wld-text-caption);
    color: var(--wld-text-secondary);
    margin-top: 10px;
  }
  .wld-loan-amount-pills {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .wld-loan-amount-pill {
    background: var(--wld-black-200);
    border-radius: 4px;
    padding: 5px 10px;
    font-size: var(--wld-text-body2);
    color: var(--wld-text-primary);
    cursor: pointer;
  }

  /* Promotion row */
  .wld-promo-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--wld-surface);
    border-radius: 12px;
    margin: 15px var(--wld-page-padding);
    padding: 12px 15px;
  }
  .wld-promo-row-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .wld-promo-row-icon {
    font-size: 18px;
    line-height: 1;
  }
  .wld-promo-row-label {
    font-size: var(--wld-text-body2);
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
  }
  .wld-promo-row-right {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .wld-promo-row-savings {
    font-size: var(--wld-text-body2);
    color: var(--wld-promo-500);
    font-weight: var(--wld-font-weight-semibold);
  }

  /* Loan options card */
  .wld-loan-options {
    background: var(--wld-surface);
    border-radius: 12px;
    margin: 0 var(--wld-page-padding);
    overflow: hidden;
  }
  .wld-loan-options-row {
    position: relative;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .wld-loan-options-row-content {
    display: flex;
    align-items: center;
    gap: 30px;
    padding: 5px 15px 5px 20px;
  }
  .wld-loan-options-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--wld-black-800);
    white-space: nowrap;
  }
  .wld-loan-options-value-group {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 5px;
  }
  .wld-loan-options-value {
    font-size: 14px;
    color: var(--wld-black-800);
    text-align: right;
  }
  .wld-loan-options-divider {
    height: 0.5px;
    background: var(--wld-divider);
    margin-left: 20px;
  }

  /* Bottom action area */
  .wld-loan-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: var(--wld-page-width);
    padding: 16px 30px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to bottom, rgba(245,245,245,0), var(--wld-bg) 24px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .wld-loan-bottom-disclaimer {
    font-size: var(--wld-text-caption);
    color: var(--wld-text-secondary);
    text-align: center;
    padding-bottom: 20px;
  }
</style>

</body>
</html>
