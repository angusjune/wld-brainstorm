<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>借款详情</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/chrome.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { margin: 0; background: #fff; }
</style>
</head>
<body>
<!--
  WLD Screen: 借款详情 (Loan Details)
  Detail screen for a single outstanding loan — header with principal & status,
  collapsible "paid" section, expanded "remaining" installments list.
  Layout: Preview chrome (back, title) → header card → installments card → no bottom bar
  Background: #F5F5F5
-->

<div class="wld-page">

  <!-- ===== WECHAT CHROME (Presentation-only) ===== -->
  <nav class="chrome-navbar chrome-navbar--inner">
  <div class="chrome-statusbar">
    <span class="chrome-statusbar-time">9:41</span>
    <div class="chrome-statusbar-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true">
        <rect x="0" y="3" width="3" height="9" rx="0.5" fill="currentColor"/>
        <rect x="4.5" y="2" width="3" height="10" rx="0.5" fill="currentColor"/>
        <rect x="9" y="0.5" width="3" height="11.5" rx="0.5" fill="currentColor"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true">
        <path d="M8 3.6C10.2 3.6 12.1 4.5 13.4 6L15 4.4C13.3 2.7 10.8 1.6 8 1.6S2.7 2.7 1 4.4L2.6 6C3.9 4.5 5.8 3.6 8 3.6Z" fill="currentColor"/>
        <path d="M8 7.2C9.3 7.2 10.5 7.7 11.4 8.6L8 12L4.6 8.6C5.5 7.7 6.7 7.2 8 7.2Z" fill="currentColor"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
        <rect x="0" y="0.5" width="22" height="11" rx="2" stroke="currentColor" stroke-width="1" fill="none"/>
        <rect x="23" y="3.5" width="1.5" height="5" rx="0.5" fill="currentColor"/>
        <rect x="2" y="2.5" width="18" height="7" rx="1" fill="currentColor"/>
      </svg>
    </div>
  </div>
  <div class="chrome-titlebar">
    <button class="chrome-navbar-back" aria-label="返回">
      <svg viewBox="0 0 12 20" fill="none" aria-hidden="true">
        <path d="M10 2L2 10L10 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="chrome-navbar-title">借款详情</span>
    <div class="chrome-capsule" aria-hidden="true">
      <div class="chrome-capsule-dots">
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
        <span class="chrome-capsule-dot"></span>
      </div>
      <div class="chrome-capsule-divider"></div>
      <div class="chrome-capsule-close">
        <div class="chrome-capsule-close-ring">
          <div class="chrome-capsule-close-dot"></div>
        </div>
      </div>
    </div>
  </div>
</nav>

  <!-- ===== PAGE BODY ===== -->
  <div class="wld-page-body">

    <!-- Loan header card -->
    <div class="wld-loan-header">
      <div class="wld-loan-header-main">
        <div class="wld-loan-header-amount">借款 &#165;6000</div>
        <div class="wld-loan-header-date">2023/12/03</div>
      </div>
      <div class="wld-loan-header-status">
        <span class="wld-loan-header-status-dot"></span>
        <span>还款中</span>
      </div>
    </div>

    <!-- Installments card -->
    <div class="wld-loan-installments">

      <!-- Section: 已还 (collapsed) -->
      <div class="wld-installments-section">
        <div class="wld-installments-header">
          <span class="wld-installments-title">已还 5 期</span>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="wld-installments-divider"></div>
      </div>

      <!-- Section: 剩余 (expanded) -->
      <div class="wld-installments-section">
        <div class="wld-installments-header">
          <span class="wld-installments-title">剩余 5 期</span>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M4.5 7L9 11.5L13.5 7" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="wld-installment-row">
          <span class="wld-installment-label">2024/06/16  第 06 期</span>
          <span class="wld-installment-amount">应还 &#165;710.95</span>
        </div>
        <div class="wld-installment-row">
          <span class="wld-installment-label">2024/07/16  第 07 期</span>
          <span class="wld-installment-amount">应还 &#165;670.65</span>
        </div>
        <div class="wld-installment-row">
          <span class="wld-installment-label">2024/08/16  第 08 期</span>
          <span class="wld-installment-amount">应还 &#165;625.11</span>
        </div>
        <div class="wld-installment-row">
          <span class="wld-installment-label">2024/09/16  第 09 期</span>
          <span class="wld-installment-amount">应还 &#165;616.74</span>
        </div>
        <div class="wld-installment-row">
          <span class="wld-installment-label">2024/10/16  第 10 期</span>
          <span class="wld-installment-amount">应还 &#165;607.56</span>
        </div>
      </div>

    </div>

  </div>

</div>

<style>
  /* Loan header card */
  .wld-loan-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    background: var(--wld-surface);
    border-radius: 12px;
    margin: 12px var(--wld-page-padding) 0;
    padding: 20px;
  }
  .wld-loan-header-main {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .wld-loan-header-amount {
    font-size: 22px;
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
    line-height: 1.2;
  }
  .wld-loan-header-date {
    font-size: var(--wld-text-body2);
    color: var(--wld-text-secondary);
  }
  .wld-loan-header-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: var(--wld-text-body2);
    color: var(--wld-emphasis-500);
    font-weight: var(--wld-font-weight-semibold);
    padding-top: 4px;
  }
  .wld-loan-header-status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--wld-emphasis-500);
  }

  /* Installments card */
  .wld-loan-installments {
    background: var(--wld-surface);
    border-radius: 12px;
    margin: 12px var(--wld-page-padding) 0;
    padding: 4px 0;
  }
  .wld-installments-section {
    padding: 0;
  }
  .wld-installments-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
  }
  .wld-installments-title {
    font-size: var(--wld-text-body1);
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
  }
  .wld-installments-divider {
    height: 0.5px;
    background: var(--wld-divider);
    margin: 0 20px;
  }

  /* Installment row */
  .wld-installment-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    font-size: var(--wld-text-body2);
    color: var(--wld-text-primary);
  }
  .wld-installment-row:last-child {
    padding-bottom: 16px;
  }
  .wld-installment-label {
    color: var(--wld-text-primary);
  }
  .wld-installment-amount {
    color: var(--wld-text-primary);
  }
</style>

</body>
</html>
