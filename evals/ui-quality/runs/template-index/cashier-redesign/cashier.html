<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/components.css">
  <link rel="stylesheet" href="/assets/mockup-chrome.css">
  <link rel="stylesheet" href="/assets/phone-mockup.css">
</head>
<body>
  <div class="frame-header">
    <h1>WLD Design</h1>
    <div class="frame-status">Live</div>
  </div>

  <div class="frame-main">
    <div id="frame-content">

      <h2 class="frame-title">收银台 — 方案 A 并列单选</h2>
      <p class="frame-subtitle">Bank card selected — tap the other row to switch</p>

      <div class="phone-gallery">

        <!-- ============================================================
             收银台 — 方案 A（并列单选），银行卡还款已选
             Base: 收银台.html · bank chip from 更换还款卡.html
             ============================================================ -->
        <div class="phone-slide">
          <div class="phone-mockup">
            <div class="phone-screen">
              <div class="wld-page">

                <wld-wechat-chrome variant="inner" title=""></wld-wechat-chrome>

                <div class="wld-page-body">

                  <!-- Amount summary (production 收银台, taller breathing room) -->
                  <div class="wld-cashier-summary">
                    <div class="wld-cashier-summary-label">还款金额</div>
                    <div class="wld-cashier-summary-amount">&#165;10006.00</div>
                  </div>

                  <!-- One card, two peer method rows, single-choice radios -->
                  <div class="wld-cashier-card">

                    <div class="wld-cashier-row">
                      <span class="wld-card-bank">
                        <img src="/assets/icons/logo-icbc.svg" alt="工商银行" width="24" height="24">
                      </span>
                      <div class="wld-cashier-row-stack">
                        <span class="wld-cashier-row-label">银行卡还款</span>
                        <span class="wld-cashier-row-sub">工商银行 (2004)</span>
                      </div>
                      <div class="wld-radio is-checked" style="margin-left:auto;"></div>
                    </div>

                    <div class="wld-cashier-divider"></div>

                    <div class="wld-cashier-row wld-cashier-row--secondary">
                      <span class="wld-cashier-row-sub" style="margin-left:44px; font-size:var(--wld-text-body2);">其他银行卡</span>
                      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="margin-left:auto;">
                        <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </div>

                    <div class="wld-cashier-divider"></div>

                    <div class="wld-cashier-row">
                      <span class="wld-cashier-transfer-icon">
                        <svg width="22" height="18" viewBox="0 0 22 18" fill="none">
                          <path d="M3 5h14M14 2l3 3-3 3" stroke="rgba(0,0,0,0.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                          <path d="M19 13H5M8 16l-3-3 3-3" stroke="rgba(0,0,0,0.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </span>
                      <div class="wld-cashier-row-stack">
                        <span class="wld-cashier-row-label">转账还款</span>
                        <span class="wld-cashier-row-sub">还款不限额，实时到账</span>
                      </div>
                      <div class="wld-radio" style="margin-left:auto;"></div>
                    </div>

                  </div>

                </div>

                <div class="wld-cashier-bottom">
                  <button class="wld-btn wld-btn-primary wld-btn-m">下一步</button>
                </div>

              </div>
            </div>
          </div>
          <div class="phone-caption">
            收银台 · 并列单选
            <span class="phone-caption-sub">Cashier — one-list method selection, bank card selected</span>
          </div>
        </div>

      </div>

    </div>
  </div>

  <div class="frame-indicator">
    <span>Live preview — give feedback in terminal</span>
  </div>

  <style>
    /* ==========================================================
       Screen-local styles — adapted from production templates:
       收银台.html (summary, card, rows, divider, transfer icon, bottom)
       更换还款卡.html (.wld-card-bank logo chip)
       ========================================================== */

    /* Amount summary — production 收银台, vertical padding increased */
    .wld-cashier-summary {
      padding: 24px var(--wld-page-padding) 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .wld-cashier-summary-label {
      font-size: var(--wld-text-body2);
      color: var(--wld-text-primary);
      font-weight: var(--wld-font-weight-semibold);
    }
    .wld-cashier-summary-amount {
      font-family: var(--wld-font-number);
      font-size: var(--wld-text-numbers);
      font-weight: 500;
      color: var(--wld-text-primary);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    /* Method card (production 收银台) */
    .wld-cashier-card {
      background: var(--wld-surface);
      border-radius: 12px;
      margin: 0 var(--wld-page-padding) 12px;
      overflow: hidden;
    }

    /* Row inside method card (production 收银台, icon enlarged to 32px chip) */
    .wld-cashier-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      min-height: 56px;
    }
    .wld-cashier-row--secondary {
      min-height: 48px;
    }
    .wld-cashier-row-label {
      font-size: var(--wld-text-body1);
      font-weight: var(--wld-font-weight-semibold);
      color: var(--wld-text-primary);
    }
    .wld-cashier-row-stack {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .wld-cashier-row-sub {
      font-size: var(--wld-text-caption);
      color: var(--wld-text-secondary);
    }
    .wld-cashier-divider {
      height: 0.5px;
      background: var(--wld-divider);
      margin-left: 64px;
    }

    /* Bank logo chip (from 更换还款卡) */
    .wld-card-bank {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 0.5px solid var(--wld-divider);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--wld-surface);
      overflow: hidden;
    }
    .wld-card-bank img {
      width: 24px;
      height: 24px;
    }

    /* Transfer icon — light yellow rounded square (production 收银台, 32px to match chip) */
    .wld-cashier-transfer-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--wld-theme-100);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Bottom action — small centered button (production 收银台) */
    .wld-cashier-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: var(--wld-page-width);
      padding: 16px 30px;
      padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: center;
    }
  </style>
</body>
</html>
