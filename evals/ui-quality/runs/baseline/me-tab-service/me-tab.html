<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/components.css">
  <link rel="stylesheet" href="/assets/mockup-chrome.css">
  <link rel="stylesheet" href="/assets/phone-mockup.css">
</head>
<body>
  <div class="frame-header">
    <h1>WLD Design</h1>
    <div class="frame-status">Live</div>
  </div>

  <div class="frame-main">
    <div id="frame-content">

      <div class="phone-gallery presentation--single">
        <div class="phone-slide">
          <div class="phone-mockup">
            <div class="phone-screen">
              <div class="wld-page">

                <!-- ===== WECHAT CHROME (Presentation-only) ===== -->
                <wld-wechat-chrome variant="home" title=""></wld-wechat-chrome>

                <!-- ===== PAGE BODY ===== -->
                <div class="wld-page-body">

                  <!-- User header row -->
                  <div class="wld-me-header">
                    <div class="wld-me-avatar">
                      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="16" r="7" stroke="rgba(0,0,0,0.35)" stroke-width="1.6" fill="none"/>
                        <path d="M8 33c0-6.6 5.4-12 12-12s12 5.4 12 12" stroke="rgba(0,0,0,0.35)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                      </svg>
                    </div>
                    <div class="wld-me-header-text">
                      <span class="wld-me-name">道明</span>
                      <span class="wld-me-tag">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                          <circle cx="7" cy="7" r="6" stroke="rgba(0,0,0,0.45)" stroke-width="1" fill="none"/>
                          <path d="M4.2 7.2l2 2 3.6-3.6" stroke="rgba(0,0,0,0.45)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        已实名
                      </span>
                    </div>
                  </div>

                  <!-- Supplemental info card -->
                  <div class="wld-me-card">
                    <div class="wld-me-row">
                      <span class="wld-me-row-icon wld-me-row-icon--gold">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                          <path d="M8 12V4M8 4L4.5 7.5M8 4l3.5 3.5" stroke="rgba(0,0,0,0.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </span>
                      <div class="wld-me-row-stack">
                        <span class="wld-me-row-title">补充信息</span>
                        <span class="wld-me-row-sub">有助于提升信用</span>
                      </div>
                      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="margin-left:auto;">
                        <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </div>
                  </div>

                  <!-- Service + help card (new: 在线客服 entry, 帮助中心 grouped in) -->
                  <div class="wld-me-card">
                    <div class="wld-me-row">
                      <span class="wld-me-row-icon">
                        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                          <path d="M11 3.5c-4.7 0-8.5 3.1-8.5 7 0 2.2 1.2 4.1 3.1 5.4L5 19l3.6-1.4c.8.2 1.6.3 2.4.3 4.7 0 8.5-3.1 8.5-7s-3.8-7-8.5-7z" stroke="rgba(0,0,0,0.85)" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
                          <circle cx="7.5" cy="10.5" r="1" fill="rgba(0,0,0,0.85)"/>
                          <circle cx="11" cy="10.5" r="1" fill="rgba(0,0,0,0.85)"/>
                          <circle cx="14.5" cy="10.5" r="1" fill="rgba(0,0,0,0.85)"/>
                        </svg>
                      </span>
                      <span class="wld-me-row-title">在线客服</span>
                      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="margin-left:auto;">
                        <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </div>
                    <div class="wld-me-divider"></div>
                    <div class="wld-me-row">
                      <span class="wld-me-row-icon">
                        <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
                          <path d="M14 4a8 8 0 00-8 8v3a3 3 0 003 3h1v-7H9v-1a5 5 0 0110 0v1h-1v7h2a3 3 0 003-3v-3a8 8 0 00-8-8z" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
                          <path d="M19 18v1a3 3 0 01-3 3h-2" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                        </svg>
                      </span>
                      <span class="wld-me-row-title">帮助中心</span>
                      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="margin-left:auto;">
                        <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </div>
                  </div>

                  <!-- Feature grid card (3 cols, 5 items — 帮助中心 moved to service card) -->
                  <div class="wld-me-card wld-me-grid">
                    <button class="wld-me-grid-item">
                      <span class="wld-me-grid-icon">
                        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                          <rect x="6" y="4" width="16" height="20" rx="2" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
                          <path d="M10 10h8M10 14h8M10 18h5" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                      </span>
                      <span class="wld-me-grid-label">借还记录</span>
                    </button>
                    <button class="wld-me-grid-item">
                      <span class="wld-me-grid-icon">
                        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                          <path d="M5 9a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H7a2 2 0 01-2-2v-2a2 2 0 000-4V9z" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
                          <path d="M14 9v10" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" stroke-dasharray="2 2"/>
                        </svg>
                      </span>
                      <span class="wld-me-grid-label">优惠券</span>
                    </button>
                    <button class="wld-me-grid-item">
                      <span class="wld-me-grid-icon">
                        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                          <rect x="4" y="7" width="14" height="14" rx="2" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
                          <rect x="10" y="3" width="14" height="14" rx="2" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
                          <path d="M14 10l3 3 5-5" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </span>
                      <span class="wld-me-grid-label">更换还款卡</span>
                    </button>
                    <button class="wld-me-grid-item">
                      <span class="wld-me-grid-icon">
                        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                          <rect x="3" y="7" width="22" height="14" rx="2" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
                          <path d="M3 11h22" stroke="rgba(0,0,0,0.85)" stroke-width="1.5"/>
                          <rect x="7" y="15" width="5" height="2.5" rx="0.5" fill="rgba(0,0,0,0.85)"/>
                        </svg>
                      </span>
                      <span class="wld-me-grid-label">微卡</span>
                    </button>
                    <button class="wld-me-grid-item">
                      <span class="wld-me-grid-icon">
                        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                          <rect x="6" y="4" width="16" height="20" rx="2" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
                          <path d="M10 10h8M10 14h8" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" stroke-linecap="round"/>
                          <circle cx="19" cy="20" r="3" stroke="rgba(0,0,0,0.85)" stroke-width="1.5" fill="none"/>
                          <path d="M17 20l1.5 1.5L21 19" stroke="rgba(0,0,0,0.85)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </span>
                      <span class="wld-me-grid-label">开具证明</span>
                    </button>
                  </div>

                  <!-- Welfare row (section title merged away) -->
                  <div class="wld-me-card">
                    <div class="wld-me-row">
                      <span class="wld-me-row-icon">
                        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                          <rect x="3" y="8" width="16" height="11" rx="1.5" stroke="rgba(0,0,0,0.85)" stroke-width="1.4" fill="none"/>
                          <path d="M11 8v11M3 12h16" stroke="rgba(0,0,0,0.85)" stroke-width="1.4"/>
                          <path d="M11 8s-3-3-4-3.5C5.7 4 5.7 5.5 7 6.5c1 .9 4 1.5 4 1.5z" stroke="rgba(0,0,0,0.85)" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
                          <path d="M11 8s3-3 4-3.5C16.3 4 16.3 5.5 15 6.5c-1 .9-4 1.5-4 1.5z" stroke="rgba(0,0,0,0.85)" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
                        </svg>
                      </span>
                      <span class="wld-me-row-title">添加福利小助手</span>
                      <div class="wld-me-row-link">
                        <span>领 15 天免息券</span>
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                          <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </div>
                    </div>
                  </div>

                </div>

                <!-- ===== TAB BAR ===== -->
                <div class="wld-tabbar">
                  <button class="wld-tabbar-item wld-tabbar-item--inactive">
                    <div class="wld-tabbar-icon">
                      <img src="/assets/icons/tab-icon-home.svg" alt="借钱" width="22" height="22">
                    </div>
                    <span class="wld-tabbar-label">借钱</span>
                  </button>
                  <button class="wld-tabbar-item">
                    <div class="wld-tabbar-icon">
                      <img src="/assets/icons/tab-icon-me-filled.svg" alt="我的" width="22" height="22">
                    </div>
                    <span class="wld-tabbar-label">我的</span>
                  </button>
                </div>

              </div>
            </div>
          </div>
          <div class="phone-caption">
            我的 — 服务直达
            <span class="phone-caption-sub">Me tab with online customer service entry · direction A</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="frame-indicator">
    <span>Live preview — give feedback in terminal</span>
  </div>

  <style>
    /* Local styles copied from assets/screens/我的Tab.html */
    .wld-me-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px var(--wld-page-padding) 0;
      padding: 12px;
      background: var(--wld-surface);
      border-radius: 12px;
    }
    .wld-me-avatar {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: var(--wld-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .wld-me-header-text {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .wld-me-name {
      font-size: var(--wld-text-h2);
      font-weight: var(--wld-font-weight-semibold);
      color: var(--wld-text-primary);
      line-height: 1.2;
    }
    .wld-me-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: var(--wld-text-caption);
      color: var(--wld-text-secondary);
    }
    .wld-me-card {
      background: var(--wld-surface);
      border-radius: 12px;
      margin: 12px var(--wld-page-padding) 0;
      overflow: hidden;
    }
    .wld-me-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      min-height: 52px;
    }
    .wld-me-row-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .wld-me-row-icon--gold {
      background: var(--wld-theme-500);
      border-radius: 50%;
    }
    .wld-me-row-stack {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .wld-me-row-title {
      font-size: var(--wld-text-body1);
      font-weight: var(--wld-font-weight-semibold);
      color: var(--wld-text-primary);
    }
    .wld-me-row-sub {
      font-size: var(--wld-text-caption);
      color: var(--wld-text-secondary);
    }
    .wld-me-row-link {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: var(--wld-text-body2);
      color: var(--wld-text-secondary);
    }
    .wld-me-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 18px 0;
      gap: 16px 0;
    }
    .wld-me-grid-item {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-family: var(--wld-font-family);
    }
    .wld-me-grid-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wld-me-grid-label {
      font-size: var(--wld-text-body2);
      color: var(--wld-text-primary);
    }

    /* Additions for this brainstorm */
    .wld-me-divider {
      height: 0.5px;
      background: var(--wld-divider);
      margin: 0 18px;
    }
  </style>
</body>
</html>
