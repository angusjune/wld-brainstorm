<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/components.css">
  <link rel="stylesheet" href="/assets/mockup-chrome.css">
  <link rel="stylesheet" href="/assets/phone-mockup.css">
</head>
<body>
  <div class="frame-header">
    <h1>WLD Design</h1>
    <div class="frame-status">Live</div>
  </div>

  <div class="frame-main">
    <div id="frame-content">

      <!-- ============================================================
           个人中心 — 7日内还款提醒 (方案 B: 还款任务置顶 / Task-first)
           Base: assets/screens/个人中心-有借款.html
           Reminder card adapted from assets/screens/本期应还.html summary
           ============================================================ -->
      <div class="phone-gallery presentation--single">
        <div class="phone-slide">
          <div class="phone-mockup">
            <div class="phone-screen">
              <div class="wld-page" style="background: var(--wld-surface);">

                <!-- ===== WECHAT CHROME (Presentation-only) ===== -->
                <wld-wechat-chrome variant="home" title="微粒贷"></wld-wechat-chrome>

                <!-- ===== PAGE BODY ===== -->
                <div class="wld-page-body" style="display: flex; flex-direction: column; padding-bottom: 0;">

                  <!-- Interest rate bar -->
                  <div class="wld-rate-bar">
                    年利率 (单利) 10.8%，1千元用1天只需0.3元
                  </div>

                  <!-- 7-day repayment reminder card -->
                  <div class="wld-remind-card">
                    <div class="wld-remind-info">
                      <div class="wld-remind-main">
                        <span class="wld-remind-label">7日内应还</span>
                        <span class="wld-remind-amount">&#165;1001.00</span>
                      </div>
                      <span class="wld-remind-date">最近还款日 7月6日</span>
                    </div>
                    <button class="wld-btn wld-btn-xs wld-btn-secondary">去还款</button>
                  </div>

                  <!-- Centered loan offer content -->
                  <div class="wld-home-content">
                    <span class="wld-home-label">预估可借</span>
                    <span class="wld-home-amount">&#165;55000</span>
                    <span class="wld-home-total">总额度 &#165;60000</span>
                    <button class="wld-btn-circle">借钱</button>
                  </div>

                  <!-- Loan details card -->
                  <div class="wld-loan-card">
                    <div class="wld-loan-row">
                      <span class="wld-loan-row-label">提前还清借款</span>
                      <div class="wld-loan-row-right">
                        <span class="wld-loan-row-value">2 笔</span>
                        <svg class="wld-loan-chevron" width="18" height="18" viewBox="0 0 18 18" fill="none">
                          <path d="M7 4.5L11.5 9L7 13.5" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </div>
                    </div>
                  </div>

                  <!-- Footer -->
                  <div class="wld-footer">
                    <div class="wld-footer-links">
                      <a href="#">借钱须知</a>
                    </div>
                    <div class="wld-footer-disclaimer">实际可借以当次借款审批为准</div>
                  </div>

                </div>

                <!-- ===== TAB BAR ===== -->
                <div class="wld-tabbar">
                  <button class="wld-tabbar-item">
                    <div class="wld-tabbar-icon">
                      <img src="/assets/icons/tab-icon-home-filled.svg" alt="借钱" width="22" height="22">
                    </div>
                    <span class="wld-tabbar-label">借钱</span>
                  </button>
                  <button class="wld-tabbar-item wld-tabbar-item--inactive">
                    <div class="wld-tabbar-icon">
                      <img src="/assets/icons/tab-icon-me.svg" alt="我的" width="22" height="22">
                    </div>
                    <span class="wld-tabbar-label">我的</span>
                  </button>
                </div>

              </div>
            </div>
          </div>
          <div class="phone-caption">
            个人中心 — 7日内还款提醒
            <span class="phone-caption-sub">Home · task-first reminder card, due within 7 days</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="frame-indicator">
    <span>Live preview — give feedback in terminal</span>
  </div>

  <style>
    /* ===== Screen-local styles copied from assets/screens/个人中心-有借款.html ===== */

    /* Interest rate info bar */
    .wld-rate-bar {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--wld-text-secondary);
      background: var(--wld-section);
      flex-shrink: 0;
    }

    /* Centered loan offer area */
    .wld-home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px 0 24px;
    }
    .wld-home-label {
      font-size: 14px;
      font-weight: var(--wld-font-weight-semibold);
      color: var(--wld-text-primary);
    }
    .wld-home-amount {
      font-family: var(--wld-font-number);
      font-size: var(--wld-text-numbers);
      font-weight: 500;
      color: var(--wld-text-primary);
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-top: -4px;
    }
    .wld-home-total {
      font-size: 14px;
      color: var(--wld-text-primary);
      margin-top: -8px;
    }

    /* Loan details card */
    .wld-loan-card {
      background: var(--wld-section);
      border-radius: 12px;
      margin: 0 30px;
      flex-shrink: 0;
    }
    .wld-loan-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 20px;
    }
    .wld-loan-row-label {
      font-size: 14px;
      color: var(--wld-text-primary);
    }
    .wld-loan-row-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .wld-loan-row-value {
      font-family: var(--wld-font-number);
      font-size: 14px;
      color: var(--wld-text-primary);
    }
    .wld-loan-chevron {
      flex-shrink: 0;
    }

    /* ===== 7-day repayment reminder card (adapted from 本期应还.html summary) ===== */
    .wld-remind-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--wld-section);
      border-radius: var(--wld-radius-card);
      margin: 12px 20px 0;
      padding: 14px 16px 14px 20px;
      flex-shrink: 0;
    }
    .wld-remind-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .wld-remind-main {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .wld-remind-label {
      font-size: 14px;
      font-weight: var(--wld-font-weight-semibold);
      color: var(--wld-text-primary);
      white-space: nowrap;
    }
    .wld-remind-amount {
      font-family: var(--wld-font-number);
      font-size: 20px;
      font-weight: 500;
      color: var(--wld-text-primary);
      line-height: 1.2;
    }
    .wld-remind-date {
      font-size: 12px;
      color: var(--wld-text-secondary);
      line-height: 1.5;
    }
    .wld-remind-card .wld-btn {
      flex-shrink: 0;
    }
  </style>
</body>
</html>
