<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/components.css">
  <link rel="stylesheet" href="/assets/mockup-chrome.css">
  <link rel="stylesheet" href="/assets/phone-mockup.css">
</head>
<body>
  <div class="frame-header">
    <h1>WLD Design</h1>
    <div class="frame-status">Live</div>
  </div>

  <div class="frame-main">
    <div id="frame-content">
      <div class="phone-gallery">
        <div class="phone-slide">
          <div class="phone-mockup">
            <div class="phone-screen">
              <!-- Home screen missing the white background override -->
              <div class="wld-page">
                <wld-wechat-chrome variant="home" title="微粒贷"></wld-wechat-chrome>
                <div class="wld-page-body">
                  <button class="wld-btn wld-btn-circle">借钱</button>
                </div>
                <div class="wld-tabbar">
                  <button class="wld-tabbar-item"><span class="wld-tabbar-label">借钱</span></button>
                  <button class="wld-tabbar-item wld-tabbar-item--inactive"><span class="wld-tabbar-label">我的</span></button>
                </div>
              </div>
            </div>
          </div>
          <div class="phone-caption">方案 A</div>
        </div>
        <div class="phone-slide">
          <div class="phone-mockup">
            <div class="phone-screen">
              <!-- Inner screen wrongly forced to white -->
              <div class="wld-page" style="background: var(--wld-surface);">
                <wld-wechat-chrome variant="inner" title="借款详情"></wld-wechat-chrome>
                <div class="wld-page-body">
                  <button class="wld-btn wld-btn-l wld-btn-primary">下一步</button>
                </div>
              </div>
            </div>
          </div>
          <div class="phone-caption">方案 B</div>
        </div>
      </div>
    </div>
  </div>

  <div class="frame-indicator">
    <span>Live preview — give feedback in terminal</span>
  </div>
</body>
</html>
