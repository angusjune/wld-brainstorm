<!--
  WLD Screen: 收银台 (Cashier / Repayment Method Selection)
  User picks a repayment method (bank card or transfer) for an outstanding amount.
  Layout: Preview chrome (back, no title) → amount summary → method cards (bank / transfer) → centered CTA
  Background: #F5F5F5
-->

<div class="wld-page">

  <!-- ===== WECHAT CHROME (Presentation-only) ===== -->
  <preview-chrome variant="inner" title="" nav-bg="var(--wld-bg)"></preview-chrome>

  <!-- ===== PAGE BODY ===== -->
  <div class="wld-page-body">

    <!-- Amount summary -->
    <div class="wld-cashier-summary">
      <div class="wld-cashier-summary-label">还款金额</div>
      <div class="wld-cashier-summary-amount">&#165;10006.00</div>
    </div>

    <!-- Bank card method card -->
    <div class="wld-cashier-card">
      <div class="wld-cashier-card-title">银行卡还款</div>

      <div class="wld-cashier-row">
        <!-- ICBC bank circular icon -->
        <span class="wld-bank-icon wld-bank-icon--icbc">
            <img src="/profile/design-system/assets/logo-icbc.svg" alt="工商银行" width="24" height="24">
        </span>
        <span class="wld-cashier-row-label">工商银行 (2004)</span>
        <!-- Checked round checkbox -->
        <div class="wld-checkbox is-checked">
          <svg viewBox="0 0 20 20" fill="none">
            <path d="M6 10.5l2.8 2.8L14.5 7.5" stroke="rgba(0,0,0,0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="wld-cashier-divider"></div>

      <div class="wld-cashier-row">
        <span class="wld-cashier-row-label" style="margin-left: 36px;">其他银行卡</span>
        <img src="/profile/design-system/assets/chevron-right.svg" alt="" width="18" height="18" style="margin-left:auto;">
      </div>
    </div>

    <!-- Transfer method card -->
    <div class="wld-cashier-card">
      <div class="wld-cashier-row" style="padding-top: 14px; padding-bottom: 14px;">
        <!-- Transfer icon (light yellow square) -->
        <span class="wld-cashier-transfer-icon">
            <img src="/profile/design-system/assets/icn-transfer.svg" alt="转账" width="24" height="24">
        </span>
        <div class="wld-cashier-row-stack">
          <span class="wld-cashier-row-label">转账还款</span>
          <span class="wld-cashier-row-sub">还款不限额，实时到账</span>
        </div>
        <!-- Unchecked round checkbox -->
        <div class="wld-checkbox" style="margin-left:auto;"></div>
      </div>
    </div>

  </div>

  <!-- ===== BOTTOM ACTION ===== -->
  <div class="wld-cashier-bottom">
    <button class="wld-btn wld-btn-primary wld-btn-m">下一步</button>
  </div>

</div>

<style>

    padding: 15px var(--wld-page-padding) 20px;

    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .wld-cashier-summary-label {
    font-size: var(--wld-text-body2);
    color: var(--wld-text-primary);
    font-weight: var(--wld-font-weight-semibold);
  }

    letter-spacing: -0.5px;
    line-height: 1.2;

  }
