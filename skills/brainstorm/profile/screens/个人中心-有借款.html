<!--
  WLD Screen: 个人中心-有借款 (Personal Center / Home — Active Loan)
  Same as 个人中心 but with an active loan:
  - Reduced available amount (55000 of 60000 total)
  - "总额度 ¥60000" subtitle below the amount
  - Loan details card below the circle button (repayment schedule + early payoff)
  Layout: Preview chrome (home) → interest rate bar → centered loan offer → loan card → footer → tab bar
  Background: White (home screen override)
-->

<div class="wld-page" style="background: var(--wld-surface);">

  <!-- ===== WECHAT CHROME (Presentation-only) ===== -->
  <preview-chrome variant="home" title="微粒贷"></preview-chrome>

  <!-- ===== PAGE BODY ===== -->
  <div class="wld-page-body" style="display: flex; flex-direction: column; padding-bottom: 0;">

    <!-- Interest rate bar -->
    <div class="wld-rate-bar">
      年利率 (单利) 10.8%，1千元用1天只需0.3元
    </div>

    <!-- Centered loan offer content -->
    <div class="wld-home-content">
        <div class="wld-home-credit">
            <span class="wld-home-label">预估可借</span>
            <span class="wld-home-amount">&#165;55000</span>
            <span class="wld-home-total">总额度 &#165;60000</span>
        </div>
      <button class="wld-btn-circle">借钱</button>

      <!-- Loan details card -->
      <div class="wld-loan-card">
        <!-- Row 1: Next repayment due -->
        <div class="wld-loan-row">
          <span class="wld-loan-row-label">9月16日应还</span>
          <div class="wld-loan-row-right">
            <span class="wld-loan-row-value">&#165;537.20</span>
            <!-- Chevron right -->
            <img class="wld-loan-chevron" src="/profile/design-system/assets/chevron-right.svg" alt="" width="18" height="18">
          </div>
        </div>
        <!-- Divider -->
        <div class="wld-loan-divider"></div>
        <!-- Row 2: Early payoff -->
        <div class="wld-loan-row">
          <span class="wld-loan-row-label">提前还清借款</span>
          <div class="wld-loan-row-right">
            <span class="wld-loan-row-value">1 笔</span>
            <!-- Chevron right -->
            <img class="wld-loan-chevron" src="/profile/design-system/assets/chevron-right.svg" alt="" width="18" height="18">
          </div>
        </div>
      </div>
    </div>



    <!-- Footer -->
    <div class="wld-footer">
      <div class="wld-footer-links">
        <a href="#">借钱须知</a>
      </div>
      <div class="wld-footer-disclaimer">实际可借以当次借款审批为准</div>
    </div>

  </div>

  <!-- ===== TAB BAR ===== -->
  <div class="wld-tabbar">
    <!-- Active tab: 借钱 -->
    <button class="wld-tabbar-item">
      <div class="wld-tabbar-icon">
        <img src="/profile/design-system/assets/tab-icon-home-filled.svg" alt="借钱" width="22" height="22">
      </div>
      <span class="wld-tabbar-label">借钱</span>
    </button>
    <!-- Inactive tab: 我的 -->
    <button class="wld-tabbar-item wld-tabbar-item--inactive">
      <div class="wld-tabbar-icon">
        <img src="/profile/design-system/assets/tab-icon-me.svg" alt="我的" width="22" height="22">
      </div>
      <span class="wld-tabbar-label">我的</span>
    </button>
  </div>

</div>

<style>
  /* Active-loan variant of the shared home offer area */
  .wld-home-content {
    padding: 40px 0 24px;
  }
  .wld-home-amount {
    margin-top: -4px;
  }
  .wld-home-total {
    font-size: 14px;
    color: var(--wld-text-primary);
    margin-top: -8px;
  }

  /* Loan details card */
  .wld-loan-card {
    background: var(--wld-section);
    border-radius: 12px;
    width: calc(100% - 60px);
    flex-shrink: 0;
  }
  .wld-loan-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 20px;
  }
  .wld-loan-row-label {
    font-size: 14px;
    color: var(--wld-text-primary);
  }
  .wld-loan-row-right {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .wld-loan-row-value {
    font-family: var(--wld-font-number);
    font-size: 14px;
    color: var(--wld-text-primary);
  }
  .wld-loan-chevron {
    flex-shrink: 0;
  }
  .wld-loan-divider {
    height: 0.5px;
    margin: 0 20px;
    background: var(--wld-black-200);
  }
