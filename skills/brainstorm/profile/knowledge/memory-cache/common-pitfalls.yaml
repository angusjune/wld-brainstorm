# Bundled product knowledge snapshot @ 2026-05-07

# 常见错误记忆
# 记录 Agent 曾经犯过的错误和纠正方式，防止重复
# 由 PM 纠正行为自动触发写入，或 Evaluator 连续失败触发

- pitfall_id: PIT-001
  applicable_agents:
    - kb_generation
  stage: state_machine_confirm
  description: >
    在未输入金额的空状态下，底部 CTA「下一步」按钮默认为禁用状态（浅黄色），
    不能假设为可点击，也不应将空状态连接到 SUBMITTING 状态。
  detection: >
    观察 Figma 截图中按钮颜色：
    · 亮黄色 = 启用（enabled）
    · 浅黄色/灰黄色 = 禁用（disabled）
    空状态的正确处理：下一步按钮 disabled，不可触发提交流程。
  correction: >
    空状态（EMPTY_HIGH / EMPTY_LOW）不应有指向 SUBMITTING 的 transition。
    只有已填入金额的状态（AUTOFILLED / EDITING）才能进入 SUBMITTING。
  source: COMP_WLD_LOAN_AMOUNT，PM 在线纠正
  added_by: pm_correction
  added_at: "2026-04-04"

- pitfall_id: PIT-002
  applicable_agents:
    - kb_generation
  stage: state_machine_identification
  description: >
    底部浮层（Sheet/Overlay）容易被漏识别为独立状态，
    只关注主页面截图而忽略浮层状态。
  detection: >
    检查每一张 Figma 截图是否有底部弹出层（半透明遮罩 + 白色卡片）。
    如有，该浮层是独立状态，必须为其建立对应状态及 transitions（弹出/关闭）。
  correction: >
    对每个浮层建立：
    · 至少一个浮层状态（如 TENOR_SHEET_STANDARD）
    · 弹出 transition（主页面 → 浮层状态）
    · 关闭 transition（浮层状态 → 主页面）
    · 如浮层有异步加载，还需建立 LOADING / LOADED / ERROR 三态
  source: COMP_WLD_LOAN_AMOUNT，Figma 分析实践
  added_by: agent_auto
  added_at: "2026-04-04"

- pitfall_id: PIT-003
  applicable_agents:
    - kb_generation
  stage: state_machine_confirm
  description: >
    首借和非首借的键盘 CTA 行为差异容易被忽略，
    误将两者合并为同一种「输入中」状态，或误认为 CTA 行为相同。
  detection: >
    分析 Figma 截图时，仔细检查数字键盘右下角的按钮文案：
    · 「确定」= 首借路径，点击只收起键盘
    · 「下一步」= 非首借路径，点击直接提交
    两者必须是独立状态。
  correction: >
    建立独立的 EDITING_FIRST 和 EDITING_RELOAN 两个状态，
    并在 rules 中记录各自的键盘 CTA 行为和提交流程差异。
  source: COMP_WLD_LOAN_AMOUNT，PM 在线确认
  added_by: pm_correction
  added_at: "2026-04-04"

- pitfall_id: PIT-004
  applicable_agents:
    - req_doc
  stage: impact_analysis
  description: >
    分析存量场景改动时，容易只关注 PM 直接描述的组件（tier-1），
    忽略通过 header.depends_on 关联的间接影响组件（tier-2），
    导致 PRD 遗漏联动变更说明。
  detection: >
    Planner 阶段必须读取所有 tier-1 组件的 header.depends_on，
    逐级追踪影响链，不能只看 PM 描述的直接对象。
  correction: >
    影响地图分两层输出：
    · tier-1：PM 描述明确涉及的组件（直接影响）
    · tier-2：通过 depends_on 关联的组件（间接影响，需确认是否受影响）
    在停顿点1一并给 PM 确认，PM 一次确认改动范围 + 关联影响。
  source: 模块05设计讨论，基于架构分析预防
  added_by: agent_auto
  added_at: "2026-04-05"
