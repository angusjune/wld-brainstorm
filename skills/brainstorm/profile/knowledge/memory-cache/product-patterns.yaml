# Bundled product knowledge snapshot @ 2026-05-07

# 产品规律记忆
# 由 Agent 自动写入 + PM 明确触发，Planner 阶段强制加载
# 不要手动随意编辑，如需修正请在对话中明确告知 Agent

- pattern_id: PAT-WLD-001
  product: WLD
  applicable_agents:
    - kb_generation
    - req_doc
    - test_case
  pattern: >
    输入金额页（COMP_WLD_LOAN_AMOUNT）存在首借/非首借两条独立路径，必须拆分为独立状态，不能合并。
    关键区别：
    · 首借用户：进入页面自动带入可借额度，键盘 CTA 为「确定」（仅收起键盘），用户需再次点击页面「下一步」才能提交
    · 非首借用户：键盘 CTA 为「下一步」，点击直接触发提交，无需二次确认
    · 首借用户：键盘激活时顶部显示利息气泡
    · 非首借用户：无利息气泡
  confidence: high
  source: COMP_WLD_LOAN_AMOUNT 生成任务，PM 在线确认
  added_by: pm_correction
  added_at: "2026-04-04"

- pattern_id: PAT-WLD-002
  product: WLD
  applicable_agents:
    - kb_generation
  pattern: >
    借款期数浮层有两种变体，需建立独立状态：
    · 标准版（TENOR_STANDARD）：选项为 6/12/24 个月
    · 含1期版（TENOR_WITH_1M）：选项为 1/6/12/24 个月
    用户是否有1期选项由后台资格判断，前端无法提前知晓，
    因此两种浮层是独立状态，不能合并为一个状态用条件渲染来表达。
  confidence: high
  source: COMP_WLD_LOAN_AMOUNT loan.md + Figma 分析
  added_by: agent_auto
  added_at: "2026-04-04"

- pattern_id: PAT-WLD-003
  product: WLD
  applicable_agents:
    - kb_generation
    - test_case
  pattern: >
    借款期数默认选中规则（三条分支，需全部覆盖）：
    · 首借 + 有1期选项 → 默认选中1个月
    · 首借 + 无1期选项 → 默认选中12个月
    · 非首借 → 默认选中上一笔借款的期数
    这三个分支在测试用例中必须独立覆盖。
  confidence: high
  source: loan.md 第3.1节
  added_by: agent_auto
  added_at: "2026-04-04"
