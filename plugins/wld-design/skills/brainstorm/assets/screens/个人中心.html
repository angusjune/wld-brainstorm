<!--
  WLD Screen: 个人中心 (Personal Center / Home)
  The primary home screen of 微粒贷 (WeBank Micro-Loan).
  Layout: Preview chrome (home) → interest rate bar → centered loan offer → footer → tab bar
  Background: White (home screen override)
-->

<div class="wld-page" style="background: var(--wld-surface);">

  <!-- ===== WECHAT CHROME (Presentation-only) ===== -->
  <wld-wechat-chrome variant="home" title="微粒贷"></wld-wechat-chrome>

  <!-- ===== PAGE BODY ===== -->
  <div class="wld-page-body" style="display: flex; flex-direction: column; padding-bottom: 0;">

    <!-- Interest rate bar -->
    <div class="wld-rate-bar">
      年利率 (单利) 10.8%，1千元用1天只需0.3元
    </div>

    <!-- Centered loan offer content -->
    <div class="wld-home-content">
      <span class="wld-home-label">预估可借</span>
      <span class="wld-home-amount">&#165;60000</span>
      <button class="wld-btn-circle">借钱</button>
    </div>

    <!-- Footer -->
    <div class="wld-footer">
      <div class="wld-footer-links">
        <a href="#">借钱须知</a>
      </div>
      <div class="wld-footer-disclaimer">实际可借以当次借款审批为准</div>
    </div>

  </div>

  <!-- ===== TAB BAR ===== -->
  <div class="wld-tabbar">
    <!-- Active tab: 借钱 -->
    <button class="wld-tabbar-item">
      <div class="wld-tabbar-icon">
        <img src="/assets/icons/tab-icon-home-filled.svg" alt="借钱" width="22" height="22">
      </div>
      <span class="wld-tabbar-label">借钱</span>
    </button>
    <!-- Inactive tab: 我的 -->
    <button class="wld-tabbar-item wld-tabbar-item--inactive">
      <div class="wld-tabbar-icon">
        <img src="/assets/icons/tab-icon-me.svg" alt="我的" width="22" height="22">
      </div>
      <span class="wld-tabbar-label">我的</span>
    </button>
  </div>

</div>

<style>
  /* Interest rate info bar */
  .wld-rate-bar {
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--wld-text-secondary);
    background: var(--wld-section);
    flex-shrink: 0;
  }

  /* Centered loan offer area */
  .wld-home-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px 0;
  }
  .wld-home-label {
    font-size: 14px;
    font-weight: var(--wld-font-weight-semibold);
    color: var(--wld-text-primary);
  }
  .wld-home-amount {
    font-family: var(--wld-font-number);
    font-size: var(--wld-text-numbers);
    font-weight: 500;
    color: var(--wld-text-primary);
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
</style>
