  - field_name: bank_card.wechat_pay_first_card
    field_type: object
    field_source: backend_api
    api_endpoint: ""
    field_desc: 微信支付卡列表的第一张卡，首借用户收款账户默认选择此卡
    allowed_values: null
    enum_desc: null

  - field_name: bank_card.is_short_maintenance
    field_type: boolean
    field_source: backend_api
    api_endpoint: ""
    field_desc: 该银行卡是否处于短暂维护状态（维护时间 ≤ 30 分钟），短暂维护时卡不灰卡可正常选中，但显示预计到账时间提示
    allowed_values: [true, false]
