# 表 6：Element Interactions（元素交互表）🆕 v2.1 新增
# 核心目标：明确每个元素的操作触发了哪些其他元素的变化

element_interactions:
  # 金额输入相关交互
  - interaction_id: INTER_AMOUNT_INPUT_CLICK
    triggered_by: ELEM_AMOUNT_INPUT
    action_type: click
    action_description: 点击金额输入框
    affects:
      - ELEM_DIGITAL_KEYBOARD
    effect_detail:
      - element_id: ELEM_DIGITAL_KEYBOARD
        update_type: show
        new_state:
          state: visible
        rule_ref: RULE_005
    applicable_states:
      - STATE_LOAN_AMOUNT_AUTOFILLED
      - STATE_LOAN_AMOUNT_EMPTY_HIGH
      - STATE_LOAN_AMOUNT_EMPTY_LOW
    rule_ref: RULE_005

  - interaction_id: INTER_AMOUNT_INPUT_VALUE_CHANGE
    triggered_by: ELEM_AMOUNT_INPUT
    action_type: value_change
    action_description: 用户修改借款金额
    affects:
      - ELEM_COUPON_CELL
      - ELEM_DAILY_INTEREST_BUBBLE
      - ELEM_CTA_NEXT
      - ELEM_REPAYMENT_PLAN
      - ELEM_TENOR_CELL
    effect_detail:
      - element_id: ELEM_COUPON_CELL
        update_type: update
        data_source: backend_api
        api_endpoint: /api/coupon/check
        display_changes:
          - old_value: "借满¥xxx可用"
            new_value: "免3天利息"
        rule_ref: RULE_033
      - element_id: ELEM_DAILY_INTEREST_BUBBLE
        update_type: update
        data_source: frontend_state
        display_changes:
          - old_value: "按天算利息，提前还无手续费"
            new_value: "用1天利息约¥x.xx，提前还无手续费"
        rule_ref: RULE_007
      - element_id: ELEM_CTA_NEXT
        update_type: enable
        data_source: frontend_state
        new_state:
          state: enabled
        rule_ref: RULE_023
      - element_id: ELEM_REPAYMENT_PLAN
        update_type: update
        data_source: backend_api
        api_endpoint: /api/repayment/calculate
        rule_ref: RULE_007
      - element_id: ELEM_TENOR_CELL
        update_type: update
        data_source: backend_api
        api_endpoint: /api/repayment/calculate
        rule_ref: RULE_007
    applicable_states:
      - STATE_LOAN_AMOUNT_EDITING_FIRST
      - STATE_LOAN_AMOUNT_EDITING_RELOAN
