    api_endpoint: ""
    field_desc: 当前用户选择的还款方式，影响期数浮层可选项和还款计划展示结构
    allowed_values: ["等额本息", "标准先息后本", "灵活先息后本", "等额本金"]
    enum_desc: "等额本息=每期还相同金额；标准先息后本=前期只还利息最后一期还本金；灵活先息后本=灵活版先息后本；等额本金=每期本金相同"

changelog:
  - version: "2.3.0"
    date: "2026-04-23"
    author: bundled-snapshot
    changes:
      - 新增 STATE_LOAN_AMOUNT_AMOUNT_INADEQUATE（金额校验-可借额度不足上笔金额）⭐
        - 触发条件和 UI 展示尚无交互图，已记录至 known_gaps 待后续补充
        - Figma ref 33090:55166 对应「输入金额-可借额度不足上笔金额」
      - 补充 STATE_LOAN_AMOUNT_REPAYMENT_ERROR 状态说明 ⭐
        - 补充主页面还款计划 Cell 加载失败时的显示规则：文字变为灰色刷新 icon 和"加载失败"文字
        - 补充超时时长说明：10 秒未返回结果则认为超时
        - 主页面 Cell 显示样式已记录至 known_gaps，待后续交互图补充
      - 更新 RULE_036 小于等于券规则 ⭐
        - 补充输入金额超出条件时的 cell 展示规则：「优惠暂不可用」
        - 浮层具体文案已记录至 known_gaps，待后续交互图补充
      - 来源：基于 2026-04-23 用户关于 30 个疑问点的审查回复

  - version: "2.1.2"
    date: "2026-04-22"
    author: bundled-snapshot
    changes:
      - 新增 RULE_044：折扣券/利率券与限时降价的互斥规则 ⭐
        - 折扣券、利率券、限时降价都是对借款利率进行优惠，用户不能同时享受
        - 根据优惠力度对比，只展示优惠力度更大的一方
        - 计算公式：折扣券优惠后利率 = loan.base_rate × coupon.discount_ratio；利率券年利率 = coupon.offer_rate
        - 情况一：限时降价更优（券利率 ≥ 限时利率）：券不展示，仅展示纯限时降价
        - 情况二：券更优（券利率 < 限时利率）：限时降价不出现，券正常展示
        - 情况三：混合场景（有天数券 + 折扣券/利率券）：天数券 + 限时叠加，列表中过滤掉折扣券/利率券
        - 优惠券列表根据优惠力度动态过滤，只展示优惠最优的选项

      - 更新 RULE_042：限时降价与优惠券同时存在 ⭐
        - 明确说明未输入金额时（COUPON_NO_AMOUNT）也展示限时降价内容
        - 添加星标说明：限时文案与券文案同时/叠加显示
        - 重新组织规则结构，按券类型详细分类

      - 更新数据字典字段说明 ⭐
        - coupon.offer_rate：补充与限时降价的互斥规则引用
        - coupon.flash_rate：补充与折扣券/利率券的互斥规则说明
        - coupon.base_rate：补充优惠券过滤隐藏逻辑
        - coupon.benefit_type：补充根据优惠力度对比动态决定展示类型的说明

  - version: "2.1.1"
    date: "2026-04-22"
    author: bundled-snapshot
    changes:
      - 新增 coupon.type 细分：折扣券 vs 利率券 ⭐ 区分两种利率优惠券类型
        - 折扣券 (discount_coupon) 和利率券 (rate_coupon) 前端展示完全相同
        - 折扣券：{优惠年利率}=原利率×折扣比例（动态计算，如14.4%×0.5=7.2%）
        - 利率券：{优惠年利率}=直接指定固定利率（固定值，如7.2%）
        - 通过 coupon.type 字段区分，更新 RULE_033、RULE_034 规则说明
        - 新增字段 coupon.discount_ratio（折扣比例）和 loan.base_rate（用户原利率）

  - version: "2.1.0"
    date: "2026-04-22"
    author: bundled-snapshot
    changes:
      - v2.1 标准升级：按照 WYD-Spec 标准 v2.1.0 重构整个 Spec 文档
      - 优惠券 Cell 展示逻辑模板化：基于 Figma JSON 分析，将优惠券文案改造为变量模板格式，支持多场景复用
      - 新增优惠券模板变量：在 data_dictionary 中新增 12 个优惠券相关变量定义
        - coupon.free_days（免息天数）用于 {免息天数}
        - coupon.offer_rate（优惠年利率）用于 年利率{优惠年利率}
        - coupon.flash_rate（限时年利率）用于 限时年利率{限时年利率}
        - coupon.base_rate（原年利率）用于划线 {原年利率}
        - coupon.subsequent_rate（后续年利率）用于 {后续年利率}
        - coupon.compare_rate（对比年利率）用于 {对比年利率}
        - coupon.condition_amount（满额券要求金额）用于 借满{满额券要求金额}
        - coupon.max_amount（金额上限）用于 借{金额上限}
        - coupon.offer_periods（优惠期数）用于 前{优惠限定期数}期
        - coupon.required_tenor（要求借款期数）用于 借{借款期数}个月
        - coupon.benefit_type（展示类型）"券"/"限时降价"/"券叠加限时降价"
      - 更新优惠券规则（RULE_033~RULE_042）：所有券类型的展示规则改用模板变量格式，新增具体模板定义
        - 天数券：前{免息天数}天0利息 / 借满{满额券要求金额}前{免息天数}天0利息 / 借{金额上限}及以下{免息天数}天0利息
        - 利率折扣券：年利率{优惠年利率} / 借满{满额券要求金额}年利率{优惠年利率}
        - 组合券：多行模板，包含前{免息天数}天0利息 + {免息天数}天后年利率{后续年利率} {对比年利率}
        - 限定期数：借{借款期数}个月年利率{优惠年利率} / 前{优惠限定期数}期年利率{优惠年利率}
        - 限时降价：限时年利率{限时年利率}，类型=限时降价/券叠加限时降价
      - 新增 coupon.type 类型区分：折扣券 vs 利率券 ⭐
        - 折扣券 (discount_coupon) 和利率券 (rate_coupon) 前端展示完全相同
        - 折扣券：{优惠年利率}=原利率×折扣比例（动态计算，如14.4%×0.5=7.2%）
        - 利率券：{优惠年利率}=直接指定固定利率（固定值，如7.2%）
        - 通过 coupon.type 字段在代码层面区分
        - 新增字段 coupon.discount_ratio（折扣券：折扣比例）和 loan.base_rate（用户原利率）
      - 标准化限时文案和划线逻辑：统一限时文案格式为「限时年利率{限时年利率}」，划线逻辑为 {原年利率}，不同场景取值不同
      - 新增 表6 - Element Interactions（元素交互表）：定义所有元素操作触发的影响关系
      - 新增 表7 - Page Elements（页面元素表）：定义页面上所有元素的完整清单及各状态显示规则
      - 升级 ui_contract.key_elements 结构：从字符串数组升级为结构化对象数组（向后兼容但需迁移）
      - 升级 header 格式：从 v0.5.0 component 格式升级为 v2.1.0 spec 格式
      - 补充内容：整合所有 v0.5.0 修正内容（占位字规则、气泡规则、校验优先级、期数切换影响等）
      - 增加变量引用：所有 notes 增加 ${variable} 格式引用，提高机器可读性
      - 来源：基于审查报告和审查回复补充修正 + WYD-Spec v2.1.0 标准

  - version: "0.5.0"
    date: "2026-04-22"
    author: bundled-snapshot
    changes:
      - 补充占位字显示规则：万元单位仅用于显示，整万时显示万单位，否则显示具体金额数字
      - 补充首借用户气泡显示规则：有优惠券时固定显示产品特性气泡，无优惠券时输入合法金额后显示试算利息气泡
      - 补充非首借用户试算文案规则：无限时降价时不展示气泡；有限时降价时输入合法金额后显示试算文案，计算公式为借款金额乘以日利率
      - 补充还款计划加载异常处理：点击"重新加载"按钮后重新加载数据并显示骨架屏
      - 补充银行卡维护说明：区分系统维护（显示灰卡）和短暂维护（可选中，显示到账提示）；预计到账时间文案规则：灰卡时间不跨日且维护时间<30分钟时显示"预计半小时到账"，超过30分钟显示具体"预计HH:MM到账"
      - 补充协议展开说明：展开协议相关后不影响其他cell的点击和输入框操作
