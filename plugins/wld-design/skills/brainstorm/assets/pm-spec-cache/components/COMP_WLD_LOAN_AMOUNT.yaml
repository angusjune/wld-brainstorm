# 表 7：Page Elements（页面元素表）🆕 v2.1 新增
# 核心目标：定义页面上所有元素的完整清单，以及各元素在各状态下的详细展示规则

page_elements:
  # 导航栏元素
  - element_id: ELEM_NAVBAR
    element_type: navbar
    element_name: 导航栏
    is_container: true
    parent_element_id: null
    default_visibility: true
    display_rules:
      - state_id: "*"
        visibility: true
        sub_elements:
          - element_id: ELEM_NAVBAR_BACK_BTN
            element_type: button
            element_name: 返回按钮
            display_text:
              type: icon
              value: "<"
            click_action: go_back
            figma_node_id: "29292:23781"
          - element_id: ELEM_NAVBAR_TITLE
            element_type: text
            element_name: 页面标题
            display_text:
              type: constant
              value: "微粒贷"
            text_style:
              font_size: 18
              font_weight: 500
              color: "#000000"
            figma_node_id: "29292:23781"
          - element_id: ELEM_NAVBAR_MORE_BTN
            element_type: button
            element_name: 更多按钮
            display_text:
              type: constant
              value: "..."
            click_action: open_more_menu
            figma_node_id: "29292:23781"

  # 金额输入区元素
  - element_id: ELEM_DAILY_INTEREST_BUBBLE
    element_type: bubble
    element_name: 利息气泡
    is_container: false
    parent_element_id: null
    default_visibility: false
    display_rules:
      - state_id: STATE_LOAN_AMOUNT_AUTOFILLED
        visibility: "${user.has_coupon == false}"
        display_text:
          type: constant
          value: "按天算利息，提前还无手续费"
        text_style:
          font_size: 12
          color: "#666666"
          background_color: "#FFF8E1"
        figma_node_id: "24176:9184"
      - state_id: STATE_LOAN_AMOUNT_EDITING_FIRST
        visibility: "${user.has_coupon == false && loan.amount >= 100}"
        display_text:
          type: variable
          value: "用1天利息约¥${loan.daily_interest_approx}，提前还无手续费"
        text_style:
          font_size: 12
          color: "#666666"
          background_color: "#FFF8E1"
        rule_ref: RULE_007
        figma_node_id: "28101:51769"
      - state_id: STATE_LOAN_AMOUNT_AUTOFILLED
        visibility: "${user.has_coupon == true}"
        display_text:
          type: constant
          value: "按天算利息，提前还无手续费"
        text_style:
          font_size: 12
          color: "#666666"
          background_color: "#FFF8E1"
        rule_ref: RULE_021

  - element_id: ELEM_AMOUNT_INPUT
    element_type: input
    element_name: 金额输入框
    is_container: false
    parent_element_id: null
    default_visibility: true
    display_rules:
      - state_id: STATE_LOAN_AMOUNT_EMPTY_HIGH
        visibility: true
        display_text:
          type: variable
          value: "最高可借${user.credit_limit/10000}万"
        placeholder_style:
          color: "#999999"
        click_action: show_keyboard
        click_target: STATE_LOAN_AMOUNT_EDITING_RELOAN
        rule_ref: RULE_001
        figma_node_id: "29292:23781"
      - state_id: STATE_LOAN_AMOUNT_EMPTY_LOW
        visibility: true
        display_text:
          type: constant
          value: "输入金额"
        placeholder_style:
          color: "#999999"
        click_action: show_keyboard
        click_target: STATE_LOAN_AMOUNT_EDITING_RELOAN
        rule_ref: RULE_002
        figma_node_id: "32910:34002"
      - state_id: STATE_LOAN_AMOUNT_AUTOFILLED
        visibility: true
        display_text:
          type: variable
          value: "${loan.amount}"
          format: "¥{value}"
        text_style:
          font_size: 48
          font_weight: 500
          color: "#000000"
        active_style: underline_yellow
        sub_elements:
          - element_id: ELEM_AMOUNT_CLEAR_BTN
            element_type: button
            element_name: 清空按钮
            display_text:
              type: constant
              value: "⊗"
            text_style:
              color: "#CCCCCC"
            click_action: clear_amount
        rule_ref: RULE_003
        figma_node_id: "24066:12100"
      - state_id: STATE_LOAN_AMOUNT_EDITING_FIRST
        visibility: true
        display_text:
          type: variable
          value: "${loan.amount}"
          format: "¥{value}"
        text_style:
          font_size: 48
          font_weight: 500
          color: "#000000"
        active_style: underline_yellow
        validation_error: ""
        rule_ref: RULE_005
        figma_node_id: "28101:51769"
      - state_id: STATE_LOAN_AMOUNT_EDITING_RELOAN
        visibility: true
        display_text:
          type: variable
          value: "${loan.amount}"
          format: "¥{value}"
        text_style:
          font_size: 48
          font_weight: 500
          color: "#000000"
        active_style: underline_yellow
        validation_error: ""
        rule_ref: RULE_006
        figma_node_id: "22415:48485"
      - state_id: STATE_LOAN_AMOUNT_AMOUNT_TOO_LOW
        visibility: true
        display_text:
          type: variable
          value: "${loan.amount}"
          format: "¥{value}"
        text_style:
          font_size: 48
          font_weight: 500
          color: "#000000"
        active_style: underline_yellow
        validation_error: "单笔借款金额最低 ¥100"
        rule_ref: RULE_023
        figma_node_id: "21071:54930"
      - state_id: STATE_LOAN_AMOUNT_AMOUNT_EXCEEDED
        visibility: true
        display_text:
          type: variable
          value: "${loan.amount}"
          format: "¥{value}"
        text_style:
          font_size: 48
          font_weight: 500
          color: "#000000"
        active_style: underline_yellow
        validation_error: "当前最多借 ¥${user.credit_limit}"
        rule_ref: RULE_024
        figma_node_id: "33018:12072"
      - state_id: STATE_LOAN_AMOUNT_AMOUNT_BUSINESS_LIMIT
        visibility: true
        display_text:
          type: variable
          value: "${loan.amount}"
          format: "¥{value}"
