data_dictionary:
  - field_name: user.credit_limit
    field_type: number
    field_source: backend_api
    api_endpoint: ""
    field_desc: 用户当前可借额度（单位：元），影响占位字文案和自动带入金额
    allowed_values: null
    enum_desc: null

  - field_name: user.is_first_loan
    field_type: boolean
    field_source: backend_api
    api_endpoint: ""
    field_desc: 用户是否为首借用户（历史无成功借款记录），影响自动带入逻辑、键盘CTA文案、气泡展示
    allowed_values: null
    enum_desc: null

  - field_name: user.available_tenors
    field_type: array
    field_source: backend_api
    api_endpoint: ""
    field_desc: 用户可用的借款期数选项列表（单位：月），通常为[6,12,24]，部分用户包含1
    allowed_values: null
    enum_desc: null

  - field_name: user.last_loan_tenor
    field_type: number
    field_source: backend_api
    api_endpoint: ""
    field_desc: 非首借用户上一笔借款的期数（月），用于默认选中期数
    allowed_values: null
    enum_desc: null

  - field_name: loan.amount
    field_type: number
    field_source: user_input
    api_endpoint: ""
    field_desc: 用户输入的借款金额（单位：元）
    allowed_values: null
    enum_desc: null

  - field_name: loan.tenor_months
    field_type: number
    field_source: user_input
    api_endpoint: ""
    field_desc: 用户选择的借款期数（单位：月）
    allowed_values: "[1, 6, 12, 24]"
    enum_desc: "1=1个月，6=6个月，12=12个月，24=24个月"

  - field_name: loan.monthly_payment
    field_type: number
    field_source: backend_api
    api_endpoint: ""
    field_desc: 每期应还金额（元），由后台根据借款金额和期数计算返回
    allowed_values: null
    enum_desc: null

  - field_name: loan.first_payment_date
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 首次还款日期，格式如「10月16日」
    allowed_values: null
    enum_desc: null

  - field_name: loan.daily_interest_approx
    field_type: number
    field_source: backend_api
    api_endpoint: ""
    field_desc: 当前借款金额（loan.amount）对应的1天利息估算值（元），用于首借气泡展示；计算公式为输入的借款金额（loan.amount）乘以日利率（有优惠券时为限时降价后的日利率）
    allowed_values: null
    enum_desc: null

  - field_name: loan.total_interest
    field_type: number
    field_source: backend_api
    api_endpoint: ""
    field_desc: 借满N个月的总利息（元），在还款计划浮层顶部展示
    allowed_values: null
    enum_desc: null

  - field_name: loan.annual_rate
    field_type: number
    field_source: backend_api
    api_endpoint: ""
    field_desc: 借款年利率（单利），如10.8%，在还款详情「协议相关」行展示
    allowed_values: null
    enum_desc: null

  - field_name: loan.purpose
    field_type: string
    field_source: user_input
    api_endpoint: ""
    field_desc: 借款用途，如「个人日常消费」，在还款详情「借款用途」行展示
    allowed_values: null
    enum_desc: null

  - field_name: bank_account.display_name
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 收款账户展示名称，格式如「工商银行(2004)」，包含银行名和账户后四位
    allowed_values: null
    enum_desc: null

  - field_name: repayment_plan.list
    field_type: array
    field_source: backend_api
    api_endpoint: ""
    field_desc: 逐期还款计划列表，每项包含期数序号、还款日期、应还金额，在还款计划浮层中展示
    allowed_values: null
    enum_desc: null

  - field_name: bank_card.wechat_pay_supported_cards
    field_type: array
    field_source: backend_api
    api_endpoint: ""
    field_desc: 用户微信支付卡列表中WLD支持银行的储蓄卡列表（信用卡已过滤），为空时收款账户cell为空
    allowed_values: null
    enum_desc: null

  - field_name: bank_card.auto_debit_card
    field_type: object
    field_source: backend_api
    api_endpoint: ""
    field_desc: 复借用户的批扣卡（上一次借款卡），若该卡已从微信支付解绑则不在卡列表中，收款账户cell为空
    allowed_values: null
    enum_desc: null

  - field_name: bank_card.is_maintenance
    field_type: boolean
    field_source: backend_api
    api_endpoint: ""
    field_desc: 该银行卡所在银行是否处于系统维护状态（维护时间较长时显示灰卡，维护时间较短即短暂维护时正常显示可选中，显示到账提示）
    allowed_values: null
    enum_desc: null

  - field_name: bank_card.maintenance_end_time
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 银行卡维护结束时间，用于灰卡下方提示文案，日期和时间格式均由后台返回；预计到账时间文案规则：灰卡时间不跨日（维护结束时间不会跨过当天的 24 点）时维护时间＜30 分钟，文案展示为"预计半小时到账"，维护时间超过 30 分钟，文案展示具体的"预计HH:MM到账"
    allowed_values: null
    enum_desc: null

  - field_name: bank_card.estimated_arrival_text
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 短暂维护（维护时间较短，在 30 分钟以内）时的预计到账时间文案，如「预计30分钟内到账」或「预计10:30到账」，由后台决定文案格式；切换到短暂维护的银行卡后，收款账户cell上显示此提示
    allowed_values: null
    enum_desc: null

  - field_name: user.is_business_loan
    field_type: boolean
    field_source: backend_api
    api_endpoint: ""
    field_desc: 用户是否为经营贷类型，影响借款用途的默认值和可选项列表
    allowed_values: null
    enum_desc: null

  - field_name: loan.purpose_list
    field_type: array
    field_source: backend_api
    api_endpoint: ""
    field_desc: 后台返回的可用借款用途列表，普通用户和经营贷用户的列表不同
    allowed_values: null
    enum_desc: null

  - field_name: loan.last_purpose
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 复借用户上一笔借款的用途，若不在当前purpose_list中则回退使用默认值
    allowed_values: null
    enum_desc: null

  - field_name: agreement.providers_list
    field_type: array
    field_source: backend_api
    api_endpoint: ""
    field_desc: 贷款提供方列表，至少1个最多2个，展示在协议相关展开区域中
    allowed_values: null
    enum_desc: null

  - field_name: loan.has_flash_price
    field_type: boolean
    field_source: backend_api
    api_endpoint: ""
    field_desc: 当前是否有限时降价活动，影响非首借用户输入框下方试算文案的展示
    allowed_values: null
    enum_desc: null

  - field_name: loan.flash_price_text
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 限时降价活动的展示文案，用于输入框下方提示区域
    allowed_values: null
    enum_desc: null

  - field_name: user.available_repay_methods
    field_type: array
    field_source: backend_api
    api_endpoint: ""
    field_desc: 用户可用的还款方式列表，如 [等额本息, 标准先息后本]；仅有一种时不展示还款方式 cell
    allowed_values: null
    enum_desc: null

  - field_name: user.last_repay_method
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 复借用户上一笔借款的还款方式，用于默认选中
    allowed_values: null
    enum_desc: null

  - field_name: user.repay_method
    field_type: string
    field_source: user_input
    api_endpoint: ""
    field_desc: 用户当前选择的还款方式，影响期数选项和还款计划展示
    allowed_values: "[等额本息, 标准先息后本, 灵活先息后本, 等额本金]"
    enum_desc: null

  - field_name: user.is_first_time_interest_only
    field_type: boolean
    field_source: backend_api
    api_endpoint: ""
    field_desc: 用户是否首次获得先息后本还款方式资格，为 true 时还款方式 cell 显示「限时」气泡
    allowed_values: null
    enum_desc: null

  - field_name: user.has_one_month_feature
    field_type: boolean
    field_source: backend_api
    api_endpoint: ""
    field_desc: 用户是否有「信贷1期万x」功能权益，影响借款期数 cell 和期数浮层的气泡展示
    allowed_values: null
    enum_desc: null

  - field_name: loan.annual_rate_one_month
    field_type: number
    field_source: backend_api
    api_endpoint: ""
    field_desc: 1期专享年利率（百分比），有「信贷1期万x」功能时展示
    allowed_values: null
    enum_desc: null

  - field_name: loan.first_period_days
    field_type: number
    field_source: backend_api
    api_endpoint: ""
    field_desc: 首期天数，判断标准为：首期还款日 - 借款当天日期 ＜ 15 天时，认为不足 15 天；不足15天时先息后本首期利息合并至第二期
    allowed_values: null
    enum_desc: null

  - field_name: coupon.default_coupon_id
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 进入输入金额页时默认展示的优惠券 ID，由个人中心引导时传入
    allowed_values: null
    enum_desc: null

  - field_name: coupon.display_text_no_amount
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 优惠券在未填写金额时的展示文案（不含金额条件部分）
    allowed_values: null
    enum_desc: null

  - field_name: coupon.benefit_text
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 优惠券核心权益文案，如「免息3天」「年利率优惠至X%」
    allowed_values: null
    enum_desc: null

  - field_name: coupon.condition_hint
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 优惠券使用条件提示文案，如「需借满5000元」
    allowed_values: null
    enum_desc: null

  - field_name: coupon.condition_type
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 优惠券使用条件类型
    allowed_values: "[无条件, 满额, 大于等于, 小于等于, 前{优惠限定期数}期, 限定期数]"
    enum_desc: "无条件=任意金额可用；满额=金额≥指定值；大于等于=金额≥指定值；小于等于=金额≤指定值；前{优惠限定期数}期=前n期利率打折；限定期数=须选指定期数"

  - field_name: coupon.condition_amount
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 有条件券的金额门槛，用于模板借满{满额券要求金额}或借{金额上限}
    allowed_values: ["6万", "1万", ...]
    enum_desc: "满额券为可借额度，大于等于/小于等于券为指定金额上限，格式如'6万'或'1万'，用于券文案模板"

  - field_name: coupon.free_days
    field_type: integer
    field_source: backend_api
    api_endpoint: ""
    field_desc: 免息天数，用于券文案模板 {免息天数}
    allowed_values: [30, 15, ...]
    enum_desc: "天数券、满额天数券、组合券使用，模板格式：前{免息天数}天0利息"

  - field_name: coupon.type
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 优惠券类型，决定券文案模板选择
    allowed_values: "[天数券, 折扣券, 利率券, 满额券, 满额天数券, 满额利率券, 小于等于券, 组合券, 条件组合券, 前{优惠限定期数}期利率券, 限定期数利率券]"
    enum_desc: "天数券=限时免息；折扣券=年利率按比例打折（动态计算）；利率券=指定固定利率（固定值）；满额券=需借满指定金额；组合券=多种优惠组合；前{优惠限定期数}期=前n期利率打折；限定期数=须选指定期数"

  - field_name: coupon.offer_rate
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 享受优惠的年利率，用于券文案模板。注意：折扣券和利率券在前端展示相同，但含义不同
    allowed_values: ["7.2%", "10.8%", "14.4%", ...]
    enum_desc: "折扣券：{优惠年利率}=原利率×折扣比例（动态计算，如14.4%×0.5=7.2%）；利率券：{优惠年利率}=直接指定的固定利率（如7.2%）；模板格式：年利率{优惠年利率}；与限时降价的互斥规则参考 RULE_044：折扣券/利率券优惠后 ≥ 限时利率时，券不展示，仅展示限时降价"

  - field_name: coupon.discount_ratio
    field_type: number
    field_source: backend_api
    api_endpoint: ""
    field_desc: 折扣比例，仅折扣券使用。{优惠年利率}=原利率×折扣比例
    allowed_values: [0.5, 0.7, 0.9, ...]
    enum_desc: "折扣比例，如0.5表示5折，0.7表示7折；仅coupon.type=discount_coupon时有效；利率券此字段为null"

  - field_name: loan.base_rate
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 用户原利率（未用券时的年利率），用于折扣券计算折后利率
    allowed_values: ["10.8%", "14.4%", "18%", ...]
    enum_desc: "用户原利率，是用户的基础年利率；折扣券使用此值计算{优惠年利率}=loan.base_rate×coupon.discount_ratio；利率券不使用此值"

  - field_name: coupon.flash_rate
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 限时年利率是指限时降价后的实际利率 ⭐
    allowed_values: ["10.8%", "7.2%", "3.6%", ...]
    enum_desc: "限时降价后的实际利率；在优惠 Cell 中正常显示此值；与划线显示的 coupon.base_rate（原年利率）对比显示优惠幅度；通常 coupon.base_rate > coupon.flash_rate；格式：限时年利率{限时年利率}；与折扣券/利率券的互斥规则参考 RULE_044：限时降价优惠力度 ≥ 券时，仅展示限时降价，券不展示"

  - field_name: coupon.base_rate
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 用户原年利率（未使用限时降价/券时的年利率），用于划线对比 ⭐
    allowed_values: ["10.8%", "14.4%", "18%", ...]
    enum_desc: "用户未使用限时降价或优惠券时的基础年利率；在优惠 Cell 划线显示此值，与优惠年利率对比显示优惠幅度；通常为10.8%或14.4%（未输入）、18%（已输入）；用途：（1）限时降价时划线原年利率；（2）折扣券/利率券未输入金额时划线原年利率；（3）组合券用于计算对比年利率；与折扣券/利率券的互斥规则参考 RULE_044：当折扣券/利率券优惠后 ≥ 限时利率时，限时降价优先展示，券被过滤隐藏"

  - field_name: coupon.subsequent_rate
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 优惠期后的年利率，用于组合券模板 {后续年利率}
    allowed_values: ["10.8%", "12.6%", ...]
    enum_desc: "组合券（天数+后续利率）优惠期后的利率，模板格式：{后续年利率}"

  - field_name: coupon.compare_rate
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 对比年利率，用于组合券模板 {对比年利率}
    allowed_values: ["12.6%", "14.4%", ...]
    enum_desc: "组合券展示的对比利率，通常在右侧显示（灰色划线）；组合券（天数+后续利率）未输入金额时显示：N天后年利率{后续年利率} {对比年利率}"

  - field_name: coupon.saved_interest
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 省利息金额，用于优惠 Cell 右侧展示 "省利息¥x.xx" ⭐
    allowed_values: ["省利息¥xx.xx", ...]
    enum_desc: "用户已输入合法金额时，在优惠 Cell 右侧显示的节省利息金额；展示规则：（1）未输入金额时不显示；（2）天数券不显示（因为本来是0利息）；（3）其他券类型已输入合法金额时显示；格式：省利息¥x.xx（橙色高亮）"

  - field_name: coupon.max_amount
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 金额上限，用于模板借{金额上限}
    allowed_values: ["1万", ...]
    enum_desc: "小于等于券的金额上限，模板格式：借{金额上限}及以下"

  - field_name: coupon.offer_periods
    field_type: integer
    field_source: backend_api
    api_endpoint: ""
    field_desc: 优惠期数，用于模板 前{优惠限定期数}期
    allowed_values: [1, 3, ...]
    enum_desc: "前{优惠限定期数}期利率券、限定期数券使用，模板格式：前{优惠限定期数}期年利率{优惠年利率}"

  - field_name: coupon.required_tenor
    field_type: integer
    field_source: backend_api
    api_endpoint: ""
    field_desc: 限定期数券要求的借款期数（月），用于模板 借{借款期数}个月
    allowed_values: [1, 3, 6, 12, ...]
    enum_desc: "限定期数利率券限定的借款期数，模板格式：借{借款期数}个月年利率{优惠年利率}"

  - field_name: coupon.n_periods
    field_type: integer
    field_source: backend_api
    api_endpoint: ""
    field_desc: 前N期利率券的生效期数，目前仅保留 1 期
    allowed_values: [1]
    enum_desc: "前N期利率券的优惠期数，与 offer_periods 相同"

  - field_name: coupon.coupon_count
    field_type: number
    field_source: backend_api
    api_endpoint: ""
    field_desc: 当前可用优惠券数量（不含限时降价），为 0 时限时降价单独展示
    allowed_values: null
    enum_desc: null

  - field_name: coupon.benefit_type
    field_type: string
    field_source: backend_api
    api_endpoint: ""
    field_desc: 优惠券 cell 展示类型，决定视觉样式
    allowed_values: ["券", "限时降价", "券叠加限时降价"]
    enum_desc: "券=单券类型；限时降价=仅限时无券，当折扣券/利率券优惠后 ≥ 限时利率时展示；券叠加限时降价=券+限时叠加，双优惠样式；与折扣券/利率券的互斥规则参考 RULE_044：根据优惠力度对比动态决定展示类型"

  - field_name: coupon.entry_source
    field_type: string
    field_source: frontend_context
    api_endpoint: ""
    field_desc: 进入输入金额页时优惠券的来源选择，决定默认展示哪张券
    allowed_values: "[single_offer, double_offer_first, double_offer_second]"
    enum_desc: "single_offer=个人中心单 offer 展示；double_offer_first/second=双 offer 用户点击的第一或第二张券"

  # 以下字段为 P0-3 引用修复补充（RULE_010/011/013/014/031 中引用但原 data_dictionary 缺少定义）

  - field_name: bank_card.debit_card_list
    field_type: array
    field_source: backend_api
