  # 优惠券基础分类与来源
  - rule_id: RULE_032
    rule_name: 优惠券默认展示逻辑
    rule_category: init
    applies_state_ids:
      - STATE_LOAN_AMOUNT_COUPON_NO_AMOUNT
      - STATE_LOAN_AMOUNT_COUPON_ELIGIBLE
      - STATE_LOAN_AMOUNT_COUPON_INELIGIBLE
    applies_scene_ids: []
    predicate:
      description: 用户进入输入金额页时有可用优惠券
    action:
      description: |
        优惠券 cell 默认展示哪张券取决于来源：
        1）个人中心只展示一张券时，默认展示该券；
        2）个人中心展示双 offer 样式（两张券）时，默认展示用户点击进入时选择的那张券；
        3）个人中心-我的 tab-优惠券-优惠券列表页面：点击某个优惠券的使用按钮进入，默认展示该优惠券
    var_refs:
      - coupon.default_coupon_id
      - coupon.entry_source
    source: loan-3.md 第2节 + 审查补充
    test_tags:
      - critical

  - rule_id: RULE_033
    rule_name: 无条件券cell显示规则（天数券/折扣券/利率券）
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_COUPON_NO_AMOUNT
      - STATE_LOAN_AMOUNT_COUPON_ELIGIBLE
      - STATE_LOAN_AMOUNT_COUPON_DESELECTED
    applies_scene_ids: []
    predicate:
      description: 当前选择的优惠券为无条件天数券、折扣券或利率券
    action:
      description: |
        券文案使用模板变量，具体规则如下：⭐ 注意：折扣券和利率券前端展示相同，但{优惠年利率}含义不同【天数券】
        - 未输入金额时：券文案 = "前{免息天数}天0利息"
        - 输入金额且满足时：券文案 = "前{免息天数}天0利息"
        - 划线利率：无（天数券不展示划线利率）
        - 右侧省利息：无（天数券不展示省利息）
        - 不使用时：显示「不使用优惠券」【折扣券】⭐
        - 未输入金额时：券文案 = "年利率{优惠年利率}"，划线"{原年利率}"，右侧无省利息
        - 输入金额时：券文案 = "年利率{优惠年利率}"，无划线，右侧"省利息¥x.xx"
        - 说明：{优惠年利率}=loan.base_rate×coupon.discount_ratio（动态计算）
        - 例如：用户原利率14.4%，5折优惠券→{优惠年利率}=14.4%×0.5=7.2%
        - 不使用时：显示「不使用优惠券」【利率券】⭐
        - 未输入金额时：券文案 = "年利率{优惠年利率}"，划线"{原年利率}"，右侧无省利息
        - 输入金额时：券文案 = "年利率{优惠年利率}"，无划线，右侧"省利息¥x.xx"
        - 说明：{优惠年利率}=直接指定的固定利率（不依赖用户原利率）
        - 例如：固定指定7.2%（与用户原利率无关）
        - 不使用时：显示「不使用优惠券」
        Figma ref：天数券 13286-44124（未输）、36717-20907（输入）；利率折扣券 25497-19714（未输）、36717-21079（输入）
    var_refs:
      - coupon.type                  # ⭐ 必须区分：days_coupon / discount_coupon / rate_coupon
      - coupon.condition_type
      - coupon.free_days
      - coupon.offer_rate
      - coupon.discount_ratio         # ⭐ 折扣券：折扣比例，如0.5表示5折
      - loan.base_rate               # ⭐ 折扣券：用户原利率
      - loan.amount
    source: loan-3.md 第2.1节 + Figma JSON 分析
    test_tags:
      - critical

  - rule_id: RULE_034
    rule_name: 满额券cell显示规则（满额天数券/满额利率券）
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_COUPON_NO_AMOUNT
      - STATE_LOAN_AMOUNT_COUPON_ELIGIBLE
      - STATE_LOAN_AMOUNT_COUPON_INELIGIBLE
      - STATE_LOAN_AMOUNT_COUPON_DESELECTED
    applies_scene_ids: []
    predicate:
      description: 当前选择的优惠券为满额券（需借满指定金额才可使用）
    action:
      description: |
        券文案使用模板变量，具体规则如下：【满额天数券】
        - 未输入金额时：券文案 = "借满{满额券要求金额}前{免息天数}天0利息"
        - 输入金额满足时：券文案 = "借满{满额券要求金额}前{免息天数}天0利息"
        - 输入金额不满足时：券文案 = "年利率{优惠年利率}"
        - 划线利率：无（天数券不展示划线利率）
        - 右侧省利息：无（天数券不展示省利息）【满额折扣券】⭐
        - 未输入金额时：券文案 = "借满{满额券要求金额}年利率{优惠年利率}"，划线"{原年利率}"，右侧无省利息
        - 输入金额满足时：券文案 = "借满{满额券要求金额}年利率{优惠年利率}"，无划线，右侧"省利息¥x.xx"
        - 说明：{优惠年利率}=loan.base_rate×coupon.discount_ratio（动态计算）
        - 输入金额不满足时：券文案 = "年利率{优惠年利率}"【满额利率券】⭐
        - 未输入金额时：券文案 = "借满{满额券要求金额}年利率{优惠年利率}"，划线"{原年利率}"，右侧无省利息
        - 输入金额满足时：券文案 = "借满{满额券要求金额}年利率{优惠年利率}"，无划线，右侧"省利息¥x.xx"
        - 说明：{优惠年利率}=直接指定的固定利率（不依赖用户原利率）
        - 输入金额不满足时：券文案 = "年利率{优惠年利率}"
        满额时推荐金额「借全部」按钮显示「优惠」角标
        Figma ref：满额天数 30415-24851（未输）、36717-21251（输入/满足）、36717-21423（未满足）；满额利率 36717-21601（满足）
    var_refs:
      - coupon.type                  # ⭐ 必须区分：days_coupon / discount_coupon / rate_coupon
      - coupon.condition_type
      - coupon.condition_amount
      - coupon.free_days
      - coupon.offer_rate
      - coupon.discount_ratio         # ⭐ 折扣券：折扣比例
      - coupon.flash_rate
      - coupon.base_rate              # ⭐ 折扣券：用户原利率
      - user.credit_limit
      - loan.amount
      - loan.monthly_payment
    source: loan-3.md 第2.2节 + Figma JSON 分析
    test_tags:
      - critical

