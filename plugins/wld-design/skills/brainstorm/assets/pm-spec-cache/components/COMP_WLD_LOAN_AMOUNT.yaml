  - rule_id: RULE_042
    rule_name: 限时降价与优惠券同时存在的显示规则
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_COUPON_NO_AMOUNT
      - STATE_LOAN_AMOUNT_COUPON_ELIGIBLE
      - STATE_LOAN_AMOUNT_COUPON_INELIGIBLE
      - STATE_LOAN_AMOUNT_COUPON_DESELECTED
    applies_scene_ids: []
    predicate:
      description: 有限时降价活动（loan.has_flash_price = true）且同时有优惠券
    action:
      description: |
        券类型=券叠加限时降价。所有券类型与限时降价的组合。

        ⭐ **重要：未输入金额时（COUPON_NO_AMOUNT）也展示限时降价内容**，限时文案与券文案同时/叠加显示

        【通用规则】
        - 券文案：展示所选优惠券的文案（遵循对应券类型的模板规则）
        - 限时文案：
          - 未输入金额时：限时年利率{限时年利率}（橙色）+ 划线{原年利率}（灰色）+ 右侧无省利息
          - 已输入合法金额：限时年利率{限时年利率}（橙色）+ 无划线 + 右侧"省利息¥x.xx"（橙色高亮）
        - 类型值：券叠加限时降价

        【天数券+限时】无条件天数券+限时
        - 券文案：前{免息天数}天0利息
        - 限时文案：限时年利率{限时年利率}（按通用规则）

        【满额天数券+限时】需借满指定金额才可用的天数券
        - 满足时：券文案 = "借满{满额券要求金额}前{免息天数}天0利息" + 限时文案（按通用规则）
        - 不满足时：券文案 = "年利率{优惠年利率}" + 限时文案（按通用规则）

        【满额折扣券+限时】需借满指定金额才可用的折扣券
        - 满足时：券文案 = "借满{满额券要求金额}年利率{优惠年利率}" + 限时文案（按通用规则）
        - 不满足时：券文案 = "年利率{优惠年利率}" + 限时文案（按通用规则）
        - 说明：{优惠年利率}=loan.base_rate×coupon.discount_ratio（动态计算）

        【前{优惠限定期数}期利率券+限时】前N期利率券+限时
        - 券文案 = "借满{满额券要求金额}前{免息天数}天0利息"（使用天数券模板）+ 限时文案（按通用规则）

        【组合券+限时】天数券+后续利率券+限时
        - 未输入金额时：券文案 = 前N天0利息 + N天后年利率{后续年利率} {对比年利率} + 限时文案（按通用规则）
        - 已输入金额时：券文案 = 前N天0利息 + N天后年利率{后续年利率} + 限时文案（按通用规则）
        - 叠加限时降价时，{对比年利率}取限时降价后的利率

        Figma ref：36641-18929（未输满额天数+限时）、36717:22757（满额券+限时）、30429-29245（限时任选天数+限时）
    var_refs:
      - loan.has_flash_price
      - coupon.type
      - coupon.condition_type
      - coupon.condition_amount
      - coupon.free_days
      - coupon.offer_rate
      - coupon.offer_periods
      - coupon.flash_rate
      - coupon.base_rate
      - coupon.subsequent_rate
      - coupon.compare_rate
      - loan.amount
      - loan.tenor_months
    source: loan-3.md 第2.5节 + loan-2.md 第2.5节 + Figma JSON 分析
    test_tags:
      - critical

  - rule_id: RULE_044
    rule_name: 折扣券/利率券与限时降价的互斥规则
    rule_category: validation
    applies_state_ids:
      - STATE_LOAN_AMOUNT_COUPON_NO_AMOUNT
      - STATE_LOAN_AMOUNT_COUPON_ELIGIBLE
      - STATE_LOAN_AMOUNT_COUPON_INELIGIBLE
      - STATE_LOAN_AMOUNT_COUPON_DESELECTED
      - STATE_LOAN_AMOUNT_FLASH_PRICE_ONLY
      - STATE_LOAN_AMOUNT_COUPON_SHEET
    applies_scene_ids: []
    predicate:
      description: 用户同时持有折扣券/利率券和限时降价活动，且优惠券列表和限时降价信息需要展示
    action:
      description: |
        折扣券、利率券、限时降价都是对借款利率进行优惠，用户不能同时享受。
        根据优惠力度对比，只展示优惠力度更大的一方。

        【计算公式】
        折扣券优惠后利率 = loan.base_rate × coupon.discount_ratio（动态计算）
        利率券年利率 = coupon.offer_rate（固定值）
        限时降价利率 = coupon.flash_rate

        【情况一：限时降价更优】
        条件：折扣券优惠后利率 ≥ 限时降价利率 或 利率券年利率 ≥ 限时降价利率
        结果：
        - 折扣券/利率券：不展示，优惠券 cell 中看不到，点开券列表中也找不到
        - 限时降价：展示为纯限时降价类型
        - 展示类型：coupon.benefit_type = "限时降价"
        - 关联状态：STATE_LOAN_AMOUNT_FLASH_PRICE_ONLY

        【情况二：券更优】
        条件：折扣券优惠后利率 < 限时降价利率 或 利率券年利率 < 限时降价利率
        结果：
        - 限时降价：不出现
        - 折扣券/利率券：正常展示
        - 展示类型：coupon.benefit_type = "券"
        - 关联状态：STATE_LOAN_AMOUNT_COUPON_NO_AMOUNT 等正常券状态

        【情况三：混合场景 —— 有天数券 + 折扣券/利率券】
        条件：
        - 用户有折扣券/利率券（优惠后 ≥ 限时利率）
        - 用户同时有天数券（可以与限时叠加）
        结果：
        - 折扣券/利率券：不展示（因为优惠后 ≥ 限时利率）
        - 天数券：与限时降价叠加展示
        - 展示类型：coupon.benefit_type = "券叠加限时降价"
        - ⭐ 重要：点开优惠券 cell 时，列表中不包含折扣券和利率券
        - 列表中只展示：天数券（单选）、不使用优惠券（单选）

        【优惠券列表过滤逻辑】
        当折扣券/利率券优惠后 ≥ 限时利率时：
        - 列表中只展示：天数券、限时降价（作为独立选项）、不使用优惠券
        - 不展示：折扣券、利率券
        - 当用户同时有天数券时：展示「天数券+限时」的券 cell，列表中只有天数券可选

        当折扣券/利率券优惠后 < 限时利率时：
        - 列表中只展示：折扣券/利率券、不使用优惠券
        - 不展示：限时降价
        - 当用户同时有天数券时：按券优先级展示（天数券优先于利率券）
    var_refs:
      - loan.has_flash_price
      - coupon.type
      - coupon.offer_rate
      - coupon.discount_ratio
      - loan.base_rate
      - coupon.flash_rate
      - coupon.benefit_type
    source: 产品确认规则
    test_tags:
      - critical

  - rule_id: RULE_043
