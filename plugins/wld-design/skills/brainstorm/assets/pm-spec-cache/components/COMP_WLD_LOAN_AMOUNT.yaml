# Bundled product knowledge snapshot @ 2026-05-07

header:
  spec_id: SPEC_WLD_LOAN_AMOUNT_20260422
  spec_name: 输入金额页规格文档
  component_id: COMP_WLD_LOAN_AMOUNT
  scene_ids:
    - SCENE_WLD_BORROW
  owner_pm: ""
  scope_in: 输入金额页所有用户交互、状态转换、业务规则、UI展示、元素交互
  scope_out: 不包含借款提交成功后的跳转逻辑，不包含其他页面的交互
  spec_version: "2.3.0"
  lifecycle_status: draft

state_machine:
  - state_id: STATE_LOAN_AMOUNT_EMPTY_HIGH
    state_name: 未输入-高额度
    state_type: normal
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: system
    entry_conditions:
      - 非首借用户进入输入金额页
      - 用户可借额度（user.credit_limit） ≥ 4万
    risk_level: low
    notes: 金额输入框显示占位字「最高可借x万」（x为用户可借额度（user.credit_limit），整万时显示万单位，如可借额度=13500时显示"最高可借13500"，可借额度=20000时显示"最高可借2万"）；快捷金额按钮可见；还款详情区空白；下一步按钮禁用（浅黄色）；复借用户进入页面时输入框默认为聚焦状态，键盘自动拉起用于引导用户输入金额（Figma ref 22415-48845）

  - state_id: STATE_LOAN_AMOUNT_EMPTY_LOW
    state_name: 未输入-低额度
    state_type: normal
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: system
    entry_conditions:
      - 非首借用户进入输入金额页
      - 用户可借额度（user.credit_limit） < 4万
    risk_level: low
    notes: 金额输入框显示占位字「输入金额」；下一步按钮禁用；无 Figma Frame 佐证，来自 loan.md 文档描述；复借用户进入页面时输入框默认为聚焦状态，键盘自动拉起用于引导用户输入金额（Figma ref 22415-48845）

  - state_id: STATE_LOAN_AMOUNT_AUTOFILLED
    state_name: 已带入金额
    state_type: normal
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: system
    entry_conditions:
      - 首借用户（user.is_first_loan = true）进入输入金额页，系统自动带入用户可借额度（user.credit_limit）
    risk_level: low
    notes: 金额区显示用户可借额度（user.credit_limit）（如¥10000）；键盘不弹出；还款详情完整展示（期数、还款计划、收款账户、借款用途、协议相关）；下一步按钮启用（亮黄色）；首借用户进入页面不自动弹出键盘，需点击输入框才拉起键盘；用户名下只要有优惠券，则输入区上方显示产品特性气泡「按天算利息，提前还无手续费」（Figma ref 24176-9184）；无优惠券且未输入金额时（键盘未弹出状态），也显示此气泡

  - state_id: STATE_LOAN_AMOUNT_EDITING_FIRST
    state_name: 输入中-首借
    state_type: normal
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 首借用户（user.is_first_loan = true）点击金额输入区或修改已带入金额
    risk_level: low
    notes: 数字键盘弹出；输入框黄色下划线激活；有优惠券时，气泡显示产品特性文案「按天算利息，提前还无手续费」而非试算气泡；无优惠券时，一旦输入合法金额（整百，且大于等于 100），气泡实时变化为「用1天利息约¥x.xx，提前还无手续费」，x.xx 为实际试算出来的金额（公式为输入的借款金额（loan.amount）乘以日利率）；键盘右下角CTA为「确定」，点击确定仅收起键盘，不触发提交（Figma ref 24176-9184）

  - state_id: STATE_LOAN_AMOUNT_EDITING_RELOAN
    state_name: 输入中-非首借
    state_type: normal
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 非首借用户点击金额输入区或点击快捷金额按钮
    risk_level: low
    notes: 数字键盘弹出；输入框黄色下划线激活；无利息气泡；键盘右下角CTA为「下一步」，点击直接收起键盘并触发提交，无需用户再次点击页面按钮

  - state_id: STATE_LOAN_AMOUNT_SUBMITTING
    state_name: 提交中
    state_type: loading
    is_terminal: true
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 首借用户点击页面「下一步」按钮
      - 或非首借用户点击键盘「下一步」按钮
    risk_level: medium
    notes: 下一步按钮显示加载状态；键盘已收起；调用后台借款提交接口；API成功后跳转至下一页（终止态）

  - state_id: STATE_LOAN_AMOUNT_TENOR_STANDARD
    state_name: 期数浮层-标准
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 用户点击「借款期数」入口
      - 用户无1期选项资格
    risk_level: low
    notes: 底部弹出浮层；选项为6个月、12个月、24个月；副标题「无论借多久，次日起都可以提前还」；当前选中项右侧显示✓

  - state_id: STATE_LOAN_AMOUNT_TENOR_WITH_1M
    state_name: 期数浮层-含1月
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 用户点击「借款期数」入口
      - 用户有1期选项资格
    risk_level: low
    notes: 底部弹出浮层；选项为1个月、6个月、12个月、24个月；当前选中项右侧显示✓

  - state_id: STATE_LOAN_AMOUNT_REPAYMENT_LOADING
    state_name: 还款计划-加载中
    state_type: loading
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 用户点击「还款计划」入口
    risk_level: low
    notes: 底部浮层弹出；内容区显示骨架屏（Skeleton）占位

  - state_id: STATE_LOAN_AMOUNT_REPAYMENT_LOADED
    state_name: 还款计划-已加载
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: async_api_response
    entry_conditions:
      - 还款计划接口返回成功
    risk_level: low
    notes: 浮层顶部显示「借满N个月总利息¥xxx.xx」；下方为逐期还款明细列表（期数、日期、应还金额），可滚动；此状态对应还款方式为等额本息时的展示；先息后本和灵活先息后本有独立状态（见 STATE_LOAN_AMOUNT_REPAYMENT_LOADED_STD_INT、STATE_LOAN_AMOUNT_REPAYMENT_LOADED_FLX_INT）

  - state_id: STATE_LOAN_AMOUNT_REPAYMENT_ERROR
    state_name: 还款计划-异常
    state_type: error
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: async_api_response
    entry_conditions:
      - 还款计划接口请求失败（网络异常或超时）
    risk_level: low
    notes: 浮层内显示警告图标+「网络异常」文案+「重新加载」按钮（黄色圆形按钮）；主页面还款计划 Cell 的文字会变为灰色刷新 icon 和"加载失败"文字，点击后重新加载数据；点击"重新加载"按钮后重新加载还款数据，浮层展示骨架屏 loading；异常状态包括：网络异常或超时；超时时长为 10 秒未返回结果则认为超时
    known_gaps:
      - field: ui_display
        gap: 主页面还款计划 Cell 加载失败时的具体显示样式（刷新 icon 颜色、尺寸、布局）待交互图确认
        input_required: figma_frame

  - state_id: STATE_LOAN_AMOUNT_CARD_LIST_NO_CARD
    state_name: 卡列表浮层-无可用卡
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 用户点击「收款账户」行
      - 且无可用借款卡（微信支付无WLD支持银行卡 / 批扣卡已从微信支付解绑 / 所有支持卡均在系统维护中）
    risk_level: low
    notes: 底部弹出卡列表浮层；列表为空或所有卡均呈灰色维护态；维护中的卡下方显示预计恢复时间（日期和时间由后台返回）；底部有「使用新银行卡」入口；Figma ref 8947-19107

  - state_id: STATE_LOAN_AMOUNT_CARD_LIST_HAS_CARD
    state_name: 卡列表浮层-有可用卡
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 用户点击「收款账户」行
      - 且有至少一张可用借款卡
    risk_level: low
    notes: 底部弹出卡列表浮层；展示微信支付中WLD支持银行的储蓄卡（信用卡不展示）；系统维护的卡呈灰色显示不可选，下方显示银行卡维护结束时间（bank_card.maintenance_end_time）（日期和时间由后台返回）；短暂维护（维护时间较短，在 30 分钟以内）卡可正常选中，下方显示短暂维护时的预计到账时间文案（bank_card.estimated_arrival_text）；预计到账时间文案规则：灰卡时间不跨日（维护结束时间不会跨过当天的 24 点）时维护时间＜30 分钟，文案展示为"预计半小时到账"，维护时间超过 30 分钟，文案展示具体的"预计HH:MM到账"；底部有「使用新银行卡」入口；切换到短暂维护的银行卡后，收款账户cell上显示预计到账时间提示；切换收款账户时，不会涉及到后端处理；Figma ref 252-1663、33572-39421、33412-21916

  - state_id: STATE_LOAN_AMOUNT_CARD_LIST_UNSUPPORTED
    state_name: 卡列表浮层-不支持银行卡
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: system
    entry_conditions:
      - 用户通过「使用新银行卡」绑卡流程添加了WLD不支持银行的储蓄卡后返回卡列表
    risk_level: low
    notes: 新添加的不支持银行卡显示「暂不支持该银行」文案提示；同时显示「查看支持银行」蓝色文字链；信用卡不会出现在卡列表中（在绑卡流程更早阶段过滤）；Figma ref 33403-21539

  - state_id: STATE_LOAN_AMOUNT_SUPPORTED_BANKS_DIALOG
    state_name: 支持银行列表弹窗
    state_type: dialog
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 用户点击「查看支持银行」蓝色文字链
    risk_level: low
    notes: 弹框展示WLD当前所有支持借款的银行列表；Figma ref 33572-39605

  - state_id: STATE_LOAN_AMOUNT_PURPOSE_SHEET
    state_name: 借款用途浮层
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 用户点击「借款用途」行
    risk_level: low
    notes: 底部弹出浮层；展示用途选项列表；普通用户和经营贷用户的选项列表不同（由后台返回）；当前选中项高亮；Figma ref 7796-15502

  - state_id: STATE_LOAN_AMOUNT_AGREEMENT_EXPANDED
    state_name: 协议相关-展开
    state_type: normal
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 用户点击「协议相关」行展开
    risk_level: low
    notes: 协议区展开显示详情；贷款提供方由后台返回（至少1个，最多2个提供方）；每个协议有「查看」按钮，点击在当前页面内展示协议全文；展开协议相关后，不影响其他 cell 的点击和输入框的操作；用户可继续进行金额输入、点击其他操作；Figma ref 26907-23151、33614-66513

  # 金额合法性校验错误状态
  - state_id: STATE_LOAN_AMOUNT_AMOUNT_TOO_LOW
    state_name: 金额校验-低于最低限额
    state_type: error
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_input
    entry_conditions:
      - 用户输入金额低于100元
    risk_level: low
    notes: 输入框下方显示警告提示「单笔借款金额最低 ¥100」；下一步按钮禁用；键盘仍保持展开状态；Figma ref 21071-54930

  - state_id: STATE_LOAN_AMOUNT_AMOUNT_EXCEEDED
    state_name: 金额校验-超出可借额度
    state_type: error
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_input
    entry_conditions:
      - 用户输入金额超出当前可借额度
    risk_level: low
    notes: 输入框下方显示「当前最多借 ¥x」，x 为用户当前可借额度；下一步按钮禁用；Figma ref 33018-12072

  - state_id: STATE_LOAN_AMOUNT_AMOUNT_BUSINESS_LIMIT
    state_name: 金额校验-经营贷超出20万
    state_type: error
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_input
    entry_conditions:
      - 用户为经营贷类型
      - 输入金额超出 20 万元
    risk_level: low
    notes: 显示提示「单次最高借 20 万，该金额可分多次借出」；下一步按钮禁用；Figma ref 33018-12178

  - state_id: STATE_LOAN_AMOUNT_AMOUNT_INADEQUATE
    state_name: 金额校验-可借额度不足上笔金额
    state_type: error
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_input
    entry_conditions:
      - 用户输入金额小于上笔借款金额（具体阈值和判断逻辑待交互图确认）
    risk_level: low
    notes: 对应 Figma ref 33090:55166（输入金额-可借额度不足上笔金额），状态定义已添加，细节待交互图补充
    known_gaps:
      - field: entry_conditions
        gap: 触发阈值和具体判断逻辑，需要 Figma ref 33090:55166 对应交互图
        input_required: figma_frame
      - field: ui_display
        gap: 错误态界面展示方式（文案、样式、操作引导）未知，待交互图确认

  # 还款方式浮层（仅在用户有两种还款方式时出现）
  - state_id: STATE_LOAN_AMOUNT_REPAY_METHOD_STANDARD_SHEET
    state_name: 还款方式浮层-标准先息后本
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 用户点击「还款方式」行
      - 可用还款方式为等额本息和标准先息后本
    risk_level: low
    notes: 底部弹出浮层，展示等额本息和标准先息后本两种选项；Figma ref 21844-43485

  - state_id: STATE_LOAN_AMOUNT_REPAY_METHOD_FLEXIBLE_SHEET
    state_name: 还款方式浮层-灵活先息后本
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 用户点击「还款方式」行
      - 可用还款方式为等额本息和灵活先息后本
    risk_level: low
    notes: 底部弹出浮层，展示等额本息和灵活先息后本两种选项；Figma ref 32515-19339

  # 还款计划加载完成（区分还款方式）
  - state_id: STATE_LOAN_AMOUNT_REPAYMENT_LOADED_STD_INT
    state_name: 还款计划-已加载-标准先息后本
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: async_api_response
    entry_conditions:
      - 还款计划接口返回成功
      - 用户还款方式为标准先息后本
    risk_level: low
    notes: 浮层展示先息后本还款结构（前期只还利息，最后一期还本金）；Figma ref 33598-48146

  - state_id: STATE_LOAN_AMOUNT_REPAYMENT_LOADED_FLX_INT
    state_name: 还款计划-已加载-灵活先息后本
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: async_api_response
    entry_conditions:
      - 还款计划接口返回成功
      - 用户还款方式为灵活先息后本
    risk_level: low
    notes: 浮层展示灵活先息后本还款结构；Figma ref 33598-49058

  - state_id: STATE_LOAN_AMOUNT_REPAYMENT_SHORT_FIRST_PERIOD
    state_name: 还款计划-已加载-先息后本首期不足15天
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: async_api_response
    entry_conditions:
      - 还款方式为先息后本（标准或灵活）
      - 借款当日至首个还款日不足 15 天
    risk_level: low
    notes: 首期利息合并至第二期还；首期条目右侧显示小 i 图标，点击弹出弹窗说明合并原因；Figma ref 30391-22866（列表）、30391-22919（弹窗）

  # 优惠券 Cell 状态组
  - state_id: STATE_LOAN_AMOUNT_COUPON_NO_AMOUNT
    state_name: 优惠券cell-未输入金额
    state_type: normal
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: system
    entry_conditions:
      - 有可用优惠券（或限时降价）
      - 用户尚未输入借款金额
    risk_level: low
    notes: |
      优惠券 cell 展示在还款详情列表中。
      cell 显示优惠券的基本信息（券名称、面额/折扣），但不计算优惠效果（因为金额未知）；
      有条件券（满额券/大于等于券/小于等于券）时显示使用条件提示；
      限时降价单独时也展示在此区域，格式不同；
      Figma 参考：天数券 13286-44124、折扣/利率券 25497-19714、满额天数 30415-24851、满额折扣 24419-23472、小于等于天数 36669-22191、小于等于利率 36631-35960、前N期 36724-24064、限定期数 36717-20686、组合券 36798-23911、条件组合 36798-24211、限时降价 36634-18387

  - state_id: STATE_LOAN_AMOUNT_COUPON_ELIGIBLE
    state_name: 优惠券cell-金额满足条件（券生效）
    state_type: normal
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_input
    entry_conditions:
      - 有可用优惠券（或限时降价）
      - 用户已输入借款金额
      - 输入金额满足优惠券使用条件（无条件券任意金额均满足）
    risk_level: low
    notes: |
      cell 显示优惠生效后的预估收益（如「免X天利息」「利率打X折」）；
      天数券和折扣/利率券共享此视觉模式：Figma ref 0-821（天数券）、20496-54682（折扣/利率券）；
      限时降价生效时：Figma ref 36634-18437；
      限时降价+券组合生效时：Figma ref 30421-25098；
      限定期数券/前N期券/组合券有各自变体

  - state_id: STATE_LOAN_AMOUNT_COUPON_INELIGIBLE
    state_name: 优惠券cell-金额不满足条件
    state_type: normal
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_input
    entry_conditions:
      - 有条件券（满额券/大于等于券/小于等于券/条件组合券）
      - 用户已输入借款金额
      - 输入金额不满足优惠券使用条件
    risk_level: low
    notes: |
      cell 显示条件不满足的提示，如「借满 ¥xxx 可用」或「借款金额需≥ ¥xxx」；
      满额天数/大于等于天数：Figma ref 30415-28490；
      满额折扣/大于等于折扣：Figma ref 30415-28297；
      条件组合：Figma ref 36798-24217；
      限时降价+满额天数/大于等于天数不满足：Figma ref 30429-29006；
      限时降价+满额折扣/大于等于折扣不满足：Figma ref 36651-20017

  - state_id: STATE_LOAN_AMOUNT_COUPON_DESELECTED
    state_name: 优惠券cell-不使用优惠券
    state_type: normal
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 有可用优惠券
      - 用户在优惠券浮层中选择「不使用优惠券」
    risk_level: low
    notes: |
      cell 显示「不使用优惠券」文案，背景/颜色与生效态不同；
      Figma ref 17415-15631（所有券类型的不使用状态共用此 Frame）

  - state_id: STATE_LOAN_AMOUNT_COUPON_SHEET
    state_name: 优惠券选择浮层
    state_type: sheet
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: user_action
    entry_conditions:
      - 用户点击优惠券 cell
    risk_level: low
    notes: 底部弹出浮层展示所有可用优惠券列表（含限时降价条目）；用户可选择使用某张券或选择「不使用」

  - state_id: STATE_LOAN_AMOUNT_FLASH_PRICE_ONLY
    state_name: 限时降价-单独存在
    state_type: normal
    is_terminal: false
    applies_scene_ids: []
    entry_trigger: system
    entry_conditions:
      - 有限时降价活动
      - 无其他优惠券
    risk_level: low
    notes: |
      优惠券 cell 区域展示限时降价信息，格式与券不同；
      未输入金额：Figma ref 36634-18387；
      输入金额后生效：Figma ref 36634-18437

transitions:
  # 金额输入交互
  - from: STATE_LOAN_AMOUNT_EMPTY_HIGH
    to: STATE_LOAN_AMOUNT_EDITING_RELOAN
    event: tap_amount_input
    transition_type: user_action
    conditions: []
    actions:
      - 弹出数字键盘
      - 输入框显示黄色下划线

  - from: STATE_LOAN_AMOUNT_EMPTY_LOW
    to: STATE_LOAN_AMOUNT_EDITING_RELOAN
    event: tap_amount_input
    transition_type: user_action
    conditions: []
    actions:
      - 弹出数字键盘
      - 输入框显示黄色下划线

  - from: STATE_LOAN_AMOUNT_EMPTY_HIGH
    to: STATE_LOAN_AMOUNT_EDITING_RELOAN
    event: tap_shortcut_amount
    transition_type: user_action
    conditions: []
    actions:
      - 快捷金额填入输入框
      - 收起数字键盘（不拉起键盘）
      - 刷新还款详情

  - from: STATE_LOAN_AMOUNT_EMPTY_LOW
    to: STATE_LOAN_AMOUNT_EDITING_RELOAN
    event: tap_shortcut_amount
    transition_type: user_action
    conditions: []
    actions:
      - 快捷金额填入输入框
      - 收起数字键盘（不拉起键盘）
      - 刷新还款详情

  - from: STATE_LOAN_AMOUNT_AUTOFILLED
    to: STATE_LOAN_AMOUNT_EDITING_FIRST
    event: tap_amount_input
    transition_type: user_action
    conditions:
      - 用户为首借用户
    actions:
      - 弹出数字键盘
      - 显示利息气泡

  - from: STATE_LOAN_AMOUNT_EDITING_FIRST
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: tap_keyboard_confirm
    transition_type: user_action
    conditions: []
    actions:
      - 收起数字键盘
      - 隐藏利息气泡
      - 刷新还款详情

  # 提交
  - from: STATE_LOAN_AMOUNT_AUTOFILLED
    to: STATE_LOAN_AMOUNT_SUBMITTING
    event: tap_next_step
    transition_type: user_action
    conditions:
      - 借款金额已填写（非空）
    actions:
      - 下一步按钮显示加载动画
      - 调用借款提交接口

  - from: STATE_LOAN_AMOUNT_EDITING_RELOAN
    to: STATE_LOAN_AMOUNT_SUBMITTING
    event: tap_keyboard_next_step
    transition_type: user_action
    conditions:
      - 借款金额已填写（非空）
    actions:
      - 收起数字键盘
      - 下一步按钮显示加载动画
      - 调用借款提交接口

  # 期数浮层
  - from: STATE_LOAN_AMOUNT_AUTOFILLED
    to: STATE_LOAN_AMOUNT_TENOR_STANDARD
    event: tap_tenor_row
    transition_type: user_action
    conditions:
      - 用户无1期选项资格
    actions:
      - 弹出期数选择浮层

  - from: STATE_LOAN_AMOUNT_AUTOFILLED
    to: STATE_LOAN_AMOUNT_TENOR_WITH_1M
    event: tap_tenor_row
    transition_type: user_action
    conditions:
      - 用户有1期选项资格
    actions:
      - 弹出期数选择浮层（含1个月选项）

  - from: STATE_LOAN_AMOUNT_EDITING_FIRST
    to: STATE_LOAN_AMOUNT_TENOR_STANDARD
    event: tap_tenor_row
    transition_type: user_action
    conditions:
      - 用户无1期选项资格
    actions:
      - 弹出期数选择浮层

  - from: STATE_LOAN_AMOUNT_EDITING_FIRST
    to: STATE_LOAN_AMOUNT_TENOR_WITH_1M
    event: tap_tenor_row
    transition_type: user_action
    conditions:
      - 用户有1期选项资格
    actions:
      - 弹出期数选择浮层（含1个月选项）

  - from: STATE_LOAN_AMOUNT_EDITING_RELOAN
    to: STATE_LOAN_AMOUNT_TENOR_STANDARD
    event: tap_tenor_row
    transition_type: user_action
    conditions:
      - 用户无1期选项资格
    actions:
      - 弹出期数选择浮层

  - from: STATE_LOAN_AMOUNT_EDITING_RELOAN
    to: STATE_LOAN_AMOUNT_TENOR_WITH_1M
    event: tap_tenor_row
    transition_type: user_action
    conditions:
      - 用户有1期选项资格
    actions:
      - 弹出期数选择浮层（含1个月选项）

  - from: STATE_LOAN_AMOUNT_TENOR_STANDARD
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: select_tenor_or_close
    transition_type: user_action
    conditions: []
    actions:
      - 关闭浮层
      - 更新借款期数（loan.tenor_months）显示
      - 还款计划cell上展示的月还款金额（loan.monthly_payment）会实时变化
      - 触发调用试算接口，由后台试算还款金额（loan.monthly_payment）后给前端展示

  - from: STATE_LOAN_AMOUNT_TENOR_WITH_1M
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: select_tenor_or_close
    transition_type: user_action
    conditions: []
    actions:
      - 关闭浮层
      - 更新借款期数（loan.tenor_months）显示
      - 还款计划cell上展示的月还款金额（loan.monthly_payment）会实时变化
      - 触发调用试算接口，由后台试算还款金额（loan.monthly_payment）后给前端展示

  # 还款计划浮层
  - from: STATE_LOAN_AMOUNT_AUTOFILLED
    to: STATE_LOAN_AMOUNT_REPAYMENT_LOADING
    event: tap_repayment_plan_row
    transition_type: user_action
    conditions: []
    actions:
      - 弹出还款计划浮层
      - 显示骨架屏
      - 发起还款计划接口请求

  - from: STATE_LOAN_AMOUNT_EDITING_RELOAN
    to: STATE_LOAN_AMOUNT_REPAYMENT_LOADING
    event: tap_repayment_plan_row
    transition_type: user_action
    conditions: []
    actions:
      - 弹出还款计划浮层
      - 显示骨架屏
      - 发起还款计划接口请求

  - from: STATE_LOAN_AMOUNT_REPAYMENT_LOADING
    to: STATE_LOAN_AMOUNT_REPAYMENT_LOADED
    event: api_repayment_success
    transition_type: async_api_response
    conditions:
      - 还款计划接口返回成功
    actions:
      - 替换骨架屏为还款明细列表
      - 展示总利息金额

  - from: STATE_LOAN_AMOUNT_REPAYMENT_LOADING
    to: STATE_LOAN_AMOUNT_REPAYMENT_ERROR
    event: api_repayment_fail
    transition_type: async_api_response
    conditions:
      - 还款计划接口请求失败（网络异常或超时）
    actions:
      - 显示「网络异常」+「重新加载」按钮
      - 主页面还款计划行显示「...」

  - from: STATE_LOAN_AMOUNT_REPAYMENT_ERROR
    to: STATE_LOAN_AMOUNT_REPAYMENT_LOADING
    event: tap_reload
    transition_type: user_action
    conditions: []
    actions:
      - 重新发起还款计划接口请求
      - 显示骨架屏

  - from: STATE_LOAN_AMOUNT_REPAYMENT_LOADED
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: close_repayment_sheet
    transition_type: user_action
    conditions: []
    actions:
      - 关闭还款计划浮层

  - from: STATE_LOAN_AMOUNT_REPAYMENT_ERROR
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: close_repayment_sheet
    transition_type: user_action
    conditions: []
    actions:
      - 关闭还款计划浮层

  # 收款账户（银行卡）浮层
  - from: STATE_LOAN_AMOUNT_AUTOFILLED
    to: STATE_LOAN_AMOUNT_CARD_LIST_HAS_CARD
    event: tap_card_row
    transition_type: user_action
    conditions:
      - 有至少一张可用借款卡
    actions:
      - 弹出卡列表浮层

  - from: STATE_LOAN_AMOUNT_AUTOFILLED
    to: STATE_LOAN_AMOUNT_CARD_LIST_NO_CARD
    event: tap_card_row
    transition_type: user_action
    conditions:
      - 无可用借款卡（无支持卡 / 批扣卡已解绑 / 所有卡维护中）
    actions:
      - 弹出卡列表浮层（空列表或全灰状态）

  - from: STATE_LOAN_AMOUNT_EDITING_RELOAN
    to: STATE_LOAN_AMOUNT_CARD_LIST_HAS_CARD
    event: tap_card_row
    transition_type: user_action
    conditions:
      - 有至少一张可用借款卡
    actions:
      - 弹出卡列表浮层

  - from: STATE_LOAN_AMOUNT_EDITING_RELOAN
    to: STATE_LOAN_AMOUNT_CARD_LIST_NO_CARD
    event: tap_card_row
    transition_type: user_action
    conditions:
      - 无可用借款卡
    actions:
      - 弹出卡列表浮层（空列表或全灰状态）

  - from: STATE_LOAN_AMOUNT_CARD_LIST_HAS_CARD
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: select_card_or_close
    transition_type: user_action
    conditions: []
    actions:
      - 关闭卡列表浮层
      - 更新收款账户行显示为所选银行卡

  - from: STATE_LOAN_AMOUNT_CARD_LIST_NO_CARD
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: close_card_list
    transition_type: user_action
    conditions: []
    actions:
      - 关闭卡列表浮层

  - from: STATE_LOAN_AMOUNT_CARD_LIST_HAS_CARD
    to: STATE_LOAN_AMOUNT_CARD_LIST_UNSUPPORTED
    event: return_from_bind_unsupported_card
    transition_type: system
    conditions:
      - 用户通过「使用新银行卡」绑定了WLD不支持银行的储蓄卡
    actions:
      - 卡列表中显示该卡的「暂不支持该银行」提示
      - 显示「查看支持银行」蓝色文字链

  - from: STATE_LOAN_AMOUNT_CARD_LIST_UNSUPPORTED
    to: STATE_LOAN_AMOUNT_SUPPORTED_BANKS_DIALOG
    event: tap_view_supported_banks
    transition_type: user_action
    conditions: []
    actions:
      - 弹出支持银行列表弹窗

  - from: STATE_LOAN_AMOUNT_SUPPORTED_BANKS_DIALOG
    to: STATE_LOAN_AMOUNT_CARD_LIST_UNSUPPORTED
    event: close_supported_banks_dialog
    transition_type: user_action
    conditions: []
    actions:
      - 关闭弹窗，返回卡列表浮层

  # 借款用途浮层
  - from: STATE_LOAN_AMOUNT_AUTOFILLED
    to: STATE_LOAN_AMOUNT_PURPOSE_SHEET
    event: tap_purpose_row
    transition_type: user_action
    conditions: []
    actions:
      - 弹出借款用途浮层

  - from: STATE_LOAN_AMOUNT_EDITING_RELOAN
    to: STATE_LOAN_AMOUNT_PURPOSE_SHEET
    event: tap_purpose_row
    transition_type: user_action
    conditions: []
    actions:
      - 弹出借款用途浮层

  - from: STATE_LOAN_AMOUNT_PURPOSE_SHEET
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: select_purpose_or_close
    transition_type: user_action
    conditions: []
    actions:
      - 关闭借款用途浮层
      - 更新借款用途行显示为所选用途

  # 协议相关
  - from: STATE_LOAN_AMOUNT_AUTOFILLED
    to: STATE_LOAN_AMOUNT_AGREEMENT_EXPANDED
    event: tap_agreement_expand
    transition_type: user_action
    conditions: []
    actions:
      - 展开协议区域，显示贷款提供方和协议列表

  - from: STATE_LOAN_AMOUNT_AGREEMENT_EXPANDED
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: tap_agreement_collapse
    transition_type: user_action
    conditions: []
    actions:
      - 收起协议区域

  # 金额校验
  - from: STATE_LOAN_AMOUNT_EDITING_FIRST
    to: STATE_LOAN_AMOUNT_AMOUNT_TOO_LOW
    event: input_amount_too_low
    transition_type: user_input
    conditions:
      - 输入金额 < 100 元
    actions:
      - 输入框下方显示「单笔借款金额最低 ¥100」提示

  - from: STATE_LOAN_AMOUNT_EDITING_RELOAN
    to: STATE_LOAN_AMOUNT_AMOUNT_TOO_LOW
    event: input_amount_too_low
    transition_type: user_input
    conditions:
      - 输入金额 < 100 元
    actions:
      - 输入框下方显示「单笔借款金额最低 ¥100」提示

  - from: STATE_LOAN_AMOUNT_EDITING_FIRST
    to: STATE_LOAN_AMOUNT_AMOUNT_EXCEEDED
    event: input_amount_exceeded
    transition_type: user_input
    conditions:
      - 输入金额 > 用户可借额度
    actions:
      - 输入框下方显示「当前最多借 ¥x」提示

  - from: STATE_LOAN_AMOUNT_EDITING_RELOAN
    to: STATE_LOAN_AMOUNT_AMOUNT_EXCEEDED
    event: input_amount_exceeded
    transition_type: user_input
    conditions:
      - 输入金额 > 用户可借额度
    actions:
      - 输入框下方显示「当前最多借 ¥x」提示

  - from: STATE_LOAN_AMOUNT_EDITING_FIRST
    to: STATE_LOAN_AMOUNT_AMOUNT_BUSINESS_LIMIT
    event: input_amount_business_limit
    transition_type: user_input
    conditions:
      - 用户为经营贷类型
      - 输入金额 > 200000 元
    actions:
      - 显示「单次最高借 20 万，该金额可分多次借出」提示

  - from: STATE_LOAN_AMOUNT_EDITING_RELOAN
    to: STATE_LOAN_AMOUNT_AMOUNT_BUSINESS_LIMIT
    event: input_amount_business_limit
    transition_type: user_input
    conditions:
      - 用户为经营贷类型
      - 输入金额 > 200000 元
    actions:
      - 显示「单次最高借 20 万，该金额可分多次借出」提示

  - from: STATE_LOAN_AMOUNT_AMOUNT_TOO_LOW
    to: STATE_LOAN_AMOUNT_EDITING_FIRST
    event: user_corrects_amount
    transition_type: user_input
    conditions:
      - 用户修改借款金额（loan.amount）至合法范围
      - 用户为首借用户（user.is_first_loan = true）
    actions:
      - 错误提示消失

  - from: STATE_LOAN_AMOUNT_AMOUNT_TOO_LOW
    to: STATE_LOAN_AMOUNT_EDITING_RELOAN
    event: user_corrects_amount
    transition_type: user_input
    conditions:
      - 用户修改借款金额（loan.amount）至合法范围
      - 用户为非首借用户（user.is_first_loan = false）
    actions:
      - 错误提示消失

  - from: STATE_LOAN_AMOUNT_AMOUNT_EXCEEDED
    to: STATE_LOAN_AMOUNT_EDITING_FIRST
    event: user_corrects_amount
    transition_type: user_input
    conditions:
      - 用户修改借款金额（loan.amount）至用户可借额度（user.credit_limit）范围内
      - 用户为首借用户（user.is_first_loan = true）
    actions:
      - 错误提示消失

  - from: STATE_LOAN_AMOUNT_AMOUNT_EXCEEDED
    to: STATE_LOAN_AMOUNT_EDITING_RELOAN
    event: user_corrects_amount
    transition_type: user_input
    conditions:
      - 用户修改借款金额（loan.amount）至用户可借额度（user.credit_limit）范围内
      - 用户为非首借用户（user.is_first_loan = false）
    actions:
      - 错误提示消失

  # 还款方式浮层
  - from: STATE_LOAN_AMOUNT_AUTOFILLED
    to: STATE_LOAN_AMOUNT_REPAY_METHOD_STANDARD_SHEET
    event: tap_repay_method_row
    transition_type: user_action
    conditions:
      - 用户有两种还款方式
      - 可用方式为等额本息和标准先息后本
    actions:
      - 弹出还款方式浮层

  - from: STATE_LOAN_AMOUNT_AUTOFILLED
    to: STATE_LOAN_AMOUNT_REPAY_METHOD_FLEXIBLE_SHEET
    event: tap_repay_method_row
    transition_type: user_action
    conditions:
      - 用户有两种还款方式
      - 可用方式为等额本息和灵活先息后本
    actions:
      - 弹出还款方式浮层

  - from: STATE_LOAN_AMOUNT_REPAY_METHOD_STANDARD_SHEET
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: select_repay_method_or_close
    transition_type: user_action
    conditions: []
    actions:
      - 关闭浮层
      - 更新还款方式（还款方式（loan.repay_method）/用户当前选择的还款方式（user.repay_method））行显示
      - 如果切换后的新还款方式（还款方式（loan.repay_method）/用户当前选择的还款方式（user.repay_method））下，没有当前已选的期数（loan.tenor_months），将默认选择可选的最大期数（loan.tenor_months）
      - 触发调用试算接口，由后台试算还款金额（loan.monthly_payment）后给前端展示

  - from: STATE_LOAN_AMOUNT_REPAY_METHOD_FLEXIBLE_SHEET
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: select_repay_method_or_close
    transition_type: user_action
    conditions: []
    actions:
      - 关闭浮层
      - 更新还款方式（还款方式（loan.repay_method）/用户当前选择的还款方式（user.repay_method））行显示
      - 如果切换后的新还款方式（还款方式（loan.repay_method）/用户当前选择的还款方式（user.repay_method））下，没有当前已选的期数（loan.tenor_months），将默认选择可选的最大期数（loan.tenor_months）
      - 触发调用试算接口，由后台试算还款金额（loan.monthly_payment）后给前端展示

  # 还款计划-先息后本变体
  - from: STATE_LOAN_AMOUNT_REPAYMENT_LOADING
    to: STATE_LOAN_AMOUNT_REPAYMENT_LOADED_STD_INT
    event: api_repayment_success
    transition_type: async_api_response
    conditions:
      - 还款计划接口返回成功
      - 还款方式为标准先息后本
    actions:
      - 替换骨架屏为先息后本还款明细

  - from: STATE_LOAN_AMOUNT_REPAYMENT_LOADING
    to: STATE_LOAN_AMOUNT_REPAYMENT_LOADED_FLX_INT
    event: api_repayment_success
    transition_type: async_api_response
    conditions:
      - 还款计划接口返回成功
      - 还款方式为灵活先息后本
    actions:
      - 替换骨架屏为灵活先息后本还款明细

  - from: STATE_LOAN_AMOUNT_REPAYMENT_LOADING
    to: STATE_LOAN_AMOUNT_REPAYMENT_SHORT_FIRST_PERIOD
    event: api_repayment_success
    transition_type: async_api_response
    conditions:
      - 还款方式为先息后本（标准或灵活）
      - 首期不足 15 天
    actions:
      - 展示首期利息合并提示
      - 首期条目显示小 i 图标

  - from: STATE_LOAN_AMOUNT_REPAYMENT_LOADED_STD_INT
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: close_repayment_sheet
    transition_type: user_action
    conditions: []
    actions:
      - 关闭还款计划浮层

  - from: STATE_LOAN_AMOUNT_REPAYMENT_LOADED_FLX_INT
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: close_repayment_sheet
    transition_type: user_action
    conditions: []
    actions:
      - 关闭还款计划浮层

  - from: STATE_LOAN_AMOUNT_REPAYMENT_SHORT_FIRST_PERIOD
    to: STATE_LOAN_AMOUNT_AUTOFILLED
    event: close_repayment_sheet
    transition_type: user_action
    conditions: []
    actions:
      - 关闭还款计划浮层

  # 优惠券 cell 状态转换
  - from: STATE_LOAN_AMOUNT_AUTOFILLED
    to: STATE_LOAN_AMOUNT_COUPON_SHEET
    event: tap_coupon_row
    transition_type: user_action
    conditions:
      - 有可用优惠券或限时降价
    actions:
      - 弹出优惠券选择浮层

  - from: STATE_LOAN_AMOUNT_EDITING_RELOAN
    to: STATE_LOAN_AMOUNT_COUPON_SHEET
    event: tap_coupon_row
    transition_type: user_action
    conditions:
      - 有可用优惠券或限时降价
    actions:
      - 弹出优惠券选择浮层

  - from: STATE_LOAN_AMOUNT_COUPON_SHEET
    to: STATE_LOAN_AMOUNT_COUPON_ELIGIBLE
    event: select_coupon
    transition_type: user_action
    conditions:
      - 用户选择一张优惠券
      - 当前输入金额满足该券使用条件
    actions:
      - 关闭浮层
      - coupon cell 更新为生效态

  - from: STATE_LOAN_AMOUNT_COUPON_SHEET
    to: STATE_LOAN_AMOUNT_COUPON_INELIGIBLE
    event: select_coupon
    transition_type: user_action
    conditions:
      - 用户选择一张有条件券
      - 当前输入金额不满足使用条件
    actions:
      - 关闭浮层
      - coupon cell 更新为条件不满足态

  - from: STATE_LOAN_AMOUNT_COUPON_SHEET
    to: STATE_LOAN_AMOUNT_COUPON_DESELECTED
    event: deselect_coupon
    transition_type: user_action
    conditions:
      - 用户选择「不使用优惠券」
    actions:
      - 关闭浮层
      - coupon cell 更新为不使用态

  - from: STATE_LOAN_AMOUNT_COUPON_ELIGIBLE
    to: STATE_LOAN_AMOUNT_COUPON_INELIGIBLE
    event: amount_changed_to_ineligible
    transition_type: user_input
    conditions:
      - 用户修改金额后不再满足当前券的使用条件
    actions:
      - coupon cell 切换为条件不满足态

  - from: STATE_LOAN_AMOUNT_COUPON_INELIGIBLE
    to: STATE_LOAN_AMOUNT_COUPON_ELIGIBLE
    event: amount_changed_to_eligible
    transition_type: user_input
    conditions:
      - 用户修改金额后满足当前券的使用条件
    actions:
      - coupon cell 切换为生效态

rules:
  - rule_id: RULE_001
    rule_name: 高额度占位字显示最高可借金额
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_EMPTY_HIGH
    applies_scene_ids: []
    predicate:
      description: 用户可借额度（user.credit_limit） ≥ 4万
    action:
      description: 金额输入框显示占位字「最高可借x万」，其中x为用户可借额度（user.credit_limit）（万元单位显示规则：整万时显示万单位，如可借额度（20000）时显示"最高可借2万"，可借额度（13500）时显示"最高可借13500"）
    var_refs:
      - user.credit_limit
    source: loan.md 第1节
    test_tags:
      - critical

  - rule_id: RULE_002
    rule_name: 低额度占位字显示"输入金额"
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_EMPTY_LOW
    applies_scene_ids: []
    predicate:
      description: 用户可借额度（user.credit_limit） < 4万
    action:
      description: 金额输入框显示占位字「输入金额」，不显示具体额度数字
    var_refs:
      - user.credit_limit
    source: loan.md 第1节
    test_tags:
      - critical

  - rule_id: RULE_003
    rule_name: 首借用户自动带入可借额度
    rule_category: init
    applies_state_ids:
      - STATE_LOAN_AMOUNT_AUTOFILLED
    applies_scene_ids: []
    predicate:
      description: 用户为首借用户（user.is_first_loan，历史无成功借款记录）
    action:
      description: 进入输入金额页时，系统自动将金额输入框填入用户可借额度（user.credit_limit），键盘不弹出，直接展示完整还款详情
    var_refs:
      - user.is_first_loan
      - user.credit_limit
    source: loan.md 第2.1节
    test_tags:
      - critical

  - rule_id: RULE_004
    rule_name: 无金额时下一步按钮禁用
    rule_category: interaction
    applies_state_ids:
      - STATE_LOAN_AMOUNT_EMPTY_HIGH
      - STATE_LOAN_AMOUNT_EMPTY_LOW
    applies_scene_ids: []
    predicate:
      description: 金额输入框为空（借款金额（loan.amount）为空，用户未输入任何金额）
    action:
      description: 页面底部「下一步」按钮置灰/禁用，用户无法点击触发提交
    var_refs:
      - loan.amount
    source: Figma 视觉分析（Frame 29292:23781，下一步按钮为浅黄色禁用态）
    test_tags:
      - critical

  - rule_id: RULE_005
    rule_name: 首借用户键盘CTA为"确定"
    rule_category: interaction
    applies_state_ids:
      - STATE_LOAN_AMOUNT_EDITING_FIRST
    applies_scene_ids: []
    predicate:
      description: 用户为首借用户（user.is_first_loan = true）且数字键盘处于激活状态
    action:
      description: 键盘右下角按钮显示「确定」；点击确定仅收起键盘，不触发借款提交；用户需再次点击页面底部「下一步」按钮才能提交
    var_refs:
      - user.is_first_loan
    source: Figma 视觉分析（Frame 28101:51769）+ PM在线确认
    test_tags:
      - critical

  - rule_id: RULE_006
    rule_name: 非首借用户键盘CTA为"下一步"
    rule_category: interaction
    applies_state_ids:
      - STATE_LOAN_AMOUNT_EDITING_RELOAN
    applies_scene_ids: []
    predicate:
      description: 用户为非首借用户（user.is_first_loan = false）且数字键盘处于激活状态
    action:
      description: 键盘右下角按钮显示「下一步」；点击即收起键盘并自动触发借款提交接口，无需用户再次点击页面按钮
    var_refs:
      - user.is_first_loan
    source: Figma 视觉分析（Frame 22415:48485）+ PM在线确认
    test_tags:
      - critical

  - rule_id: RULE_007
    rule_name: 首借用户输入金额时显示利息气泡
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_EDITING_FIRST
    applies_scene_ids: []
    predicate:
      description: 用户为首借用户（user.is_first_loan = true）且数字键盘处于激活状态
    action:
      description: 无优惠券时，一旦输入合法金额（整百，且大于等于 100），气泡实时变化为「用1天利息约¥x.xx，提前还无手续费」，x.xx 为实际试算出来的金额，公式为输入的借款金额（loan.amount）乘以日利率；有优惠券时，气泡固定展示为「按天算利息，提前还无手续费」
    var_refs:
      - user.is_first_loan
      - loan.daily_interest_approx
      - loan.amount
    source: Figma 视觉分析（Frame 28101:51769）+ 审查补充
    test_tags: []

  - rule_id: RULE_008
    rule_name: 期数选项根据用户资格动态展示
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_TENOR_STANDARD
      - STATE_LOAN_AMOUNT_TENOR_WITH_1M
    applies_scene_ids: []
    predicate:
      description: 用户有1期选项资格
    action:
      description: 期数浮层显示1/6/12/24个月四个选项；否则仅显示6/12/24个月三个选项
    var_refs:
      - user.available_tenors
    source: loan.md 第3.1节
    test_tags:
      - critical

  - rule_id: RULE_009
    rule_name: 期数默认选中规则
    rule_category: init
    applies_state_ids:
      - STATE_LOAN_AMOUNT_AUTOFILLED
      - STATE_LOAN_AMOUNT_EMPTY_HIGH
      - STATE_LOAN_AMOUNT_EMPTY_LOW
    applies_scene_ids: []
    predicate:
      description: 进入输入金额页时根据用户类型确定默认期数
    action:
      description: "首借用户有1期选项时默认1期；首借用户无1期选项时默认12期；非首借用户默认上一笔借款的期数"
    var_refs:
      - user.is_first_loan
      - user.available_tenors
      - user.last_loan_tenor
    source: loan.md 第3.1节
    test_tags:
      - critical

  - rule_id: RULE_010
    rule_name: 收款账户cell为空的三种条件
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_AUTOFILLED
      - STATE_LOAN_AMOUNT_EMPTY_HIGH
      - STATE_LOAN_AMOUNT_EMPTY_LOW
    applies_scene_ids: []
    predicate:
      description: 满足以下任意一种情况时收款账户行不显示银行卡信息
    action:
      description: |
        以下三种情况下收款账户cell展示为空：
        1）用户在微信支付没有WLD支持的银行卡；
        2）用户有批扣卡但该卡已从微信支付解绑（卡不存在于微信支付卡列表中）；
        3）用户微信支付中所有WLD支持的银行卡均在系统维护中
    var_refs:
      - bank_card.wechat_pay_supported_cards
      - bank_card.debit_card_list
      - bank_card.is_maintenance
    source: loan-2.md 第1.1节
    test_tags:
      - critical

  - rule_id: RULE_011
    rule_name: 收款账户默认选择规则
    rule_category: init
    applies_state_ids:
      - STATE_LOAN_AMOUNT_AUTOFILLED
      - STATE_LOAN_AMOUNT_EMPTY_HIGH
      - STATE_LOAN_AMOUNT_EMPTY_LOW
    applies_scene_ids: []
    predicate:
      description: 进入输入金额页时且有可用银行卡
    action:
      description: "首借用户默认微信支付卡列表的第一张卡；复借用户默认上一次的借款卡（批扣卡）"
    var_refs:
      - user.is_first_loan
      - bank_card.wechat_pay_first_card
      - bank_card.auto_debit_card
    source: loan-2.md 第1.2节
    test_tags:
      - critical

  - rule_id: RULE_012
    rule_name: 系统维护导致银行卡灰卡样式
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_CARD_LIST_NO_CARD
      - STATE_LOAN_AMOUNT_CARD_LIST_HAS_CARD
    applies_scene_ids: []
    predicate:
      description: 某张银行卡所在银行正在进行系统维护（维护时间较长）
    action:
      description: 该银行卡在卡列表中显示灰色不可选状态；卡下方展示维护结束时间提示，日期和时间均由后台返回
    var_refs:
      - bank_card.is_maintenance
      - bank_card.maintenance_end_time
    source: loan-2.md 第1.3.1节
    test_tags:
      - critical

  - rule_id: RULE_013
    rule_name: 短暂维护时显示预计到账时间而非灰卡
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_CARD_LIST_HAS_CARD
    applies_scene_ids: []
    predicate:
      description: 某张银行卡所在银行处于短暂系统维护状态（维护时间较短，不影响正常使用）
    action:
      description: |
        该银行卡不灰卡，可正常选中；
        卡下方显示预计到账时间提示，文案为以下二选一（由后台决定）：
        - 「预计30分钟内到账」（时间由后台返回）
        - 「预计10:30到账」（具体时间由后台返回）
    var_refs:
      - bank_card.is_short_maintenance
      - bank_card.estimated_arrival_text
    source: loan-2.md 第1.3.4节
    test_tags: []

  - rule_id: RULE_014
    rule_name: 不支持银行的储蓄卡处理规则
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_CARD_LIST_UNSUPPORTED
    applies_scene_ids: []
    predicate:
      description: 用户通过「使用新银行卡」绑定了WLD不支持银行的储蓄卡后返回卡列表
    action:
      description: |
        1）该卡在卡列表中显示「暂不支持该银行」文案；
        2）同时显示「查看支持银行」蓝色文字链，点击后弹出支持银行列表弹窗；
        注：信用卡不会出现在卡列表中（在微信支付绑卡流程中即过滤，不返回给WLD卡列表）
    var_refs:
      - bank_card.is_supported_bank
      - bank_card.card_type
    source: loan-2.md 第1.3.3节
    test_tags:
      - critical

  - rule_id: RULE_015
    rule_name: 借款用途默认规则（普通用户）
    rule_category: init
    applies_state_ids:
      - STATE_LOAN_AMOUNT_AUTOFILLED
      - STATE_LOAN_AMOUNT_EMPTY_HIGH
      - STATE_LOAN_AMOUNT_EMPTY_LOW
    applies_scene_ids: []
    predicate:
      description: 用户为非经营贷类型
    action:
      description: |
        首借用户默认「个人日常消费」；
        复借用户默认上一笔借款的用途；
        若上一笔借款用途不在后台返回的用途列表中，则回退默认「个人日常消费」
    var_refs:
      - user.is_first_loan
      - user.is_business_loan
      - loan.last_purpose
      - loan.purpose_list
    source: loan-2.md 第2节
    test_tags:
      - critical

  - rule_id: RULE_016
    rule_name: 借款用途默认规则（经营贷用户）
    rule_category: init
    applies_state_ids:
      - STATE_LOAN_AMOUNT_AUTOFILLED
      - STATE_LOAN_AMOUNT_EMPTY_HIGH
      - STATE_LOAN_AMOUNT_EMPTY_LOW
    applies_scene_ids: []
    predicate:
      description: 用户为经营贷类型
    action:
      description: |
        首借用户默认「日常经营活动」；
        复借用户默认上一笔借款的用途；
        若上一笔借款用途不在后台返回的用途列表中，则回退默认「日常经营活动」
    var_refs:
      - user.is_business_loan
      - user.is_first_loan
      - loan.last_purpose
      - loan.purpose_list
    source: loan-2.md 第2节
    test_tags:
      - critical

  - rule_id: RULE_017
    rule_name: 协议相关默认收起
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_AUTOFILLED
      - STATE_LOAN_AMOUNT_EDITING_FIRST
      - STATE_LOAN_AMOUNT_EDITING_RELOAN
    applies_scene_ids: []
    predicate:
      description: 进入输入金额页或返回主状态时
    action:
      description: 协议相关区域默认为收起状态，用户需主动点击展开按钮才能查看协议详情
    var_refs: []
    source: loan-2.md 第3节
    test_tags: []

  - rule_id: RULE_018
    rule_name: 贷款提供方数量及协议查看
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_AGREEMENT_EXPANDED
    applies_scene_ids: []
    predicate:
      description: 用户展开协议相关区域
    action:
      description: |
        展开后显示贷款提供方信息，由后台返回；
        至少有1个提供方，最多2个提供方；
        每个协议右侧有「查看」按钮，点击在当前页面内展示协议全文（非跳转新页面）
    var_refs:
      - agreement.providers_list
    source: loan-2.md 第3节
    test_tags: []

  - rule_id: RULE_019
    rule_name: 推荐金额按钮数量根据可借额度动态决定
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_EMPTY_HIGH
      - STATE_LOAN_AMOUNT_EMPTY_LOW
      - STATE_LOAN_AMOUNT_AUTOFILLED
      - STATE_LOAN_AMOUNT_EDITING_FIRST
      - STATE_LOAN_AMOUNT_EDITING_RELOAN
    applies_scene_ids: []
    predicate:
      description: 根据用户可借额度（user.credit_limit）决定推荐金额按钮的数量和内容
    action:
      description: |
        可借额度（user.credit_limit） < 1万：仅展示 1 个按钮「借全部」；
        可借额度（user.credit_limit） = 1万：展示 2 个按钮「借1万」「借全部」；
        可借额度（user.credit_limit） > 1万且 < 2万：展示 2 个按钮「借1万」「借全部」；
        可借额度（user.credit_limit） > 2万：展示 3 个按钮「借1万」「借2万」「借全部」；
        点击快捷金额时，自动填入对应金额，键盘不拉起
    var_refs:
      - user.credit_limit
    source: loan.md 第3.1节 + 审查补充
    test_tags:
      - critical

  - rule_id: RULE_020
    rule_name: 复借用户进入页面自动拉起键盘
    rule_category: interaction
    applies_state_ids:
      - STATE_LOAN_AMOUNT_EMPTY_HIGH
      - STATE_LOAN_AMOUNT_EMPTY_LOW
    applies_scene_ids: []
    predicate:
      description: 用户为非首借用户（user.is_first_loan = false）
    action:
      description: 进入输入金额页时，由于不会自动带入金额，输入框默认为聚焦状态，键盘自动拉起用于引导用户输入金额；首借用户（user.is_first_loan = true）不自动弹出键盘
    var_refs:
      - user.is_first_loan
    source: loan.md 第4节 + 审查补充
    test_tags:
      - critical

  - rule_id: RULE_021
    rule_name: 首借未输入金额时显示产品特性气泡
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_AUTOFILLED
    applies_scene_ids: []
    predicate:
      description: 用户为首借用户，金额输入框处于自动带入状态（键盘未弹出）
    action:
      description: 输入区上方显示产品特性气泡，文案为「按天算利息，提前还无手续费」；有优惠券时，在未输入状态下也显示此气泡
    var_refs:
      - user.is_first_loan
    source: loan.md 第2.2.1节
    figma_ref: "24176-9184"
    test_tags: []

  - rule_id: RULE_022
    rule_name: 非首借有限时降价时输入框下方显示试算文案
    rule_category: display
    applies_state_ids:
      - STATE_LOAN_AMOUNT_EDITING_RELOAN
    applies_scene_ids: []
    predicate:
      description: 用户为非首借用户（user.is_first_loan = false），且当前有限时降价活动（当前是否有限时降价活动（loan.has_flash_price） = true），且已输入合法金额（整百，且大于等于 100）
    action:
      description: 输入框下方显示试算文案「用 1 天利息约 ¥xx」，xx 为实际试算出来的金额，公式为输入的借款金额（loan.amount）乘以日利率（日利率为限时降价后的日利率）；无限时降价（当前是否有限时降价活动（loan.has_flash_price） = false）时，不展示气泡
    var_refs:
      - user.is_first_loan
      - loan.has_flash_price
      - loan.daily_interest_approx
      - loan.amount
    source: loan.md 第2.2.2节 + 审查补充
    test_tags: []

  - rule_id: RULE_023
    rule_name: 输入金额低于100元时校验提示
    rule_category: validation
    applies_state_ids:
      - STATE_LOAN_AMOUNT_AMOUNT_TOO_LOW
    applies_scene_ids: []
    predicate:
      description: 用户输入金额 < 100 元
    action:
