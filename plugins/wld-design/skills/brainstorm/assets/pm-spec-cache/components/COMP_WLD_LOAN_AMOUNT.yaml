    field_desc: 银行卡类型，信用卡在绑卡阶段即过滤，不进入 WLD 卡列表
    allowed_values: ["debit", "credit"]
    enum_desc: "debit=储蓄卡（可选）；credit=信用卡（不展示）"

  - field_name: loan.repay_method
    field_type: string
